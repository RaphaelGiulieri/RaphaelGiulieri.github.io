<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <pattern id="embargo" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#0c0a07"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(240,235,224,0.30)" stroke-width="1.4"/>
    </pattern>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(240,235,224,0.6)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="750" fill="#0c0a07"/>

  <!-- title -->
  <text x="48" y="56" fill="#f0ebe0" font-size="26" letter-spacing="1">Walk-forward with purged embargo</text>
  <text x="48" y="82" fill="rgba(240,235,224,0.6)" font-size="13" letter-spacing="0.5">five rolling folds — every cited result comes out of an out-of-sample test window</text>

  <!-- legend -->
  <g font-size="11.5">
    <rect x="48" y="104" width="16" height="14" fill="rgba(240,235,224,0.55)"/>
    <text x="72" y="116" fill="rgba(240,235,224,0.72)">train (756d)</text>
    <rect x="208" y="104" width="16" height="14" fill="#f2a51f"/>
    <text x="232" y="116" fill="rgba(240,235,224,0.72)">validation (252d)</text>
    <rect x="392" y="104" width="16" height="14" fill="#ff4b1f"/>
    <text x="416" y="116" fill="rgba(240,235,224,0.72)">test / out-of-sample (126d)</text>
    <rect x="624" y="104" width="16" height="14" fill="url(#embargo)" stroke="rgba(240,235,224,0.30)"/>
    <text x="648" y="116" fill="rgba(240,235,224,0.72)">embargo gap (label horizon)</text>
  </g>

  <!-- time axis -->
  <line x1="96" y1="600" x2="1120" y2="600" stroke="rgba(240,235,224,0.30)" stroke-width="1.4" marker-end="url(#wf-arrow)"/>
  <text x="96" y="624" fill="rgba(240,235,224,0.55)" font-size="11">earlier</text>
  <text x="1120" y="624" fill="rgba(240,235,224,0.55)" font-size="11" text-anchor="end">time &#8594; later</text>

  <!--
    Geometry: usable x-range 96..1120 (1024 wide). Each fold rolls forward.
    Per fold widths (px): train 360, embargo 28, val 150, embargo 28, test 96.
    Folds step forward by ~96px each row.
    Row y positions: 160, 240, 320, 400, 480 ; bar height 44.
  -->

  <!-- FOLD 1 -->
  <g>
    <text x="48" y="188" fill="rgba(240,235,224,0.72)" font-size="12">fold 1</text>
    <rect x="96"  y="160" width="360" height="44" fill="rgba(240,235,224,0.55)"/>
    <rect x="456" y="160" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="484" y="160" width="150" height="44" fill="#f2a51f"/>
    <rect x="634" y="160" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="662" y="160" width="96"  height="44" fill="#ff4b1f"/>
  </g>

  <!-- FOLD 2 (rolled +96) -->
  <g>
    <text x="48" y="268" fill="rgba(240,235,224,0.72)" font-size="12">fold 2</text>
    <rect x="192" y="240" width="360" height="44" fill="rgba(240,235,224,0.55)"/>
    <rect x="552" y="240" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="580" y="240" width="150" height="44" fill="#f2a51f"/>
    <rect x="730" y="240" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="758" y="240" width="96"  height="44" fill="#ff4b1f"/>
  </g>

  <!-- FOLD 3 -->
  <g>
    <text x="48" y="348" fill="rgba(240,235,224,0.72)" font-size="12">fold 3</text>
    <rect x="288" y="320" width="360" height="44" fill="rgba(240,235,224,0.55)"/>
    <rect x="648" y="320" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="676" y="320" width="150" height="44" fill="#f2a51f"/>
    <rect x="826" y="320" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="854" y="320" width="96"  height="44" fill="#ff4b1f"/>
  </g>

  <!-- FOLD 4 -->
  <g>
    <text x="48" y="428" fill="rgba(240,235,224,0.72)" font-size="12">fold 4</text>
    <rect x="384" y="400" width="360" height="44" fill="rgba(240,235,224,0.55)"/>
    <rect x="744" y="400" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="772" y="400" width="150" height="44" fill="#f2a51f"/>
    <rect x="922" y="400" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="950" y="400" width="96"  height="44" fill="#ff4b1f"/>
  </g>

  <!-- FOLD 5 -->
  <g>
    <text x="48" y="508" fill="rgba(240,235,224,0.72)" font-size="12">fold 5</text>
    <rect x="480"  y="480" width="360" height="44" fill="rgba(240,235,224,0.55)"/>
    <rect x="840"  y="480" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="868"  y="480" width="150" height="44" fill="#f2a51f"/>
    <rect x="1018" y="480" width="28"  height="44" fill="url(#embargo)"/>
    <rect x="1046" y="480" width="74"  height="44" fill="#ff4b1f"/>
  </g>

  <!-- callout: why embargo -->
  <g>
    <line x1="662" y1="154" x2="662" y2="138" stroke="rgba(240,235,224,0.35)" stroke-width="1"/>
    <text x="668" y="150" fill="rgba(240,235,224,0.6)" font-size="10.5">test window never overlaps</text>
    <line x1="456" y1="154" x2="456" y2="138" stroke="rgba(240,235,224,0.35)" stroke-width="1"/>
    <text x="320" y="150" fill="rgba(240,235,224,0.6)" font-size="10.5" text-anchor="middle">gap purges leak from the label horizon</text>
  </g>

  <!-- footer note REQUIRED -->
  <text x="48" y="664" fill="#f2a51f" font-size="12.5" letter-spacing="0.4">Illustrative — conceptual fold layout. Boundaries and embargo widths are schematic; exact dates are not in the published data.</text>
  <text x="48" y="688" fill="rgba(240,235,224,0.55)" font-size="11.5">The embargo drops samples whose forward label would overlap the test window, so nothing the model saw in training can leak into the score.</text>
</svg>
