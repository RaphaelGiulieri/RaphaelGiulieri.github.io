<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>particles · playground</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a07; color: #f0ebe0; font-family: "JetBrains Mono", ui-monospace, monospace; overflow: hidden;
    user-select: none; -webkit-user-select: none; -moz-user-select: none;
  }
  /* Allow selection inside fields the user actually types into. */
  input, textarea, select { user-select: text; -webkit-user-select: text; -moz-user-select: text; }
  canvas#c { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .topbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 360px); }
  .topbar button, .topbar .pop {
    font: inherit; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(240,235,224,0.85); background: rgba(12,10,7,0.55);
    border: 1px solid rgba(240,235,224,0.2); padding: 5px 10px;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  .topbar button:hover, .topbar button.on { border-color: #ff4b1f; color: #ff4b1f; }
  .topbar .gap { width: 12px; }
  .label { position: absolute; bottom: 12px; left: 12px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.4); pointer-events: none; line-height: 1.5; max-width: calc(100% - 360px); }
  .label b { color: #ff4b1f; font-weight: 500; }
  /* Stats overlay sits bottom-left so the right inspector panel never
     obstructs it. Toggleable via stage.showStats (General tab). */
  .stats { position: absolute; bottom: 36px; left: 12px; font-size: 10px; letter-spacing: 0.05em; color: rgba(240,235,224,0.55); text-align: left; line-height: 1.5; pointer-events: none; }
  .stats.hidden { display: none; }
  .stats b { color: #ff4b1f; font-weight: 500; }
  .stat-backend { font-weight: bold; }
  .stat-backend.backend-webgl2 { color: #5fb4f4; }
  .stat-backend.backend-webgpu { color: #9ee37d; }
  .stats .info { color: rgba(240,235,224,0.35); font-size: 9px; }

  /* ----- right inspector panel ----- */
  #panel {
    position: absolute; top: 12px; right: 12px;
    width: min(400px, calc(100vw - 24px));
    max-height: calc(100% - 24px);
    background: rgba(12,10,7,0.92); border: 1px solid rgba(240,235,224,0.18);
    backdrop-filter: blur(8px);
    font-size: 10px; letter-spacing: 0.04em;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
    z-index: 50;
  }
  /* Independent audio panel anchored top-left, below the topbar — kept fully
     separate from the inspector so the native <select>'s intrinsic width
     can never re-flow the inspector layout. */
  #audio-panel {
    position: fixed; top: 60px; left: 12px;
    width: min(340px, calc(100vw - 24px));
    background: rgba(12,10,7,0.92); border: 1px solid rgba(240,235,224,0.18);
    backdrop-filter: blur(8px);
    padding: 8px 10px 10px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 50;
  }
  #audio-panel::before {
    content: 'AUDIO';
    color: rgba(240,235,224,0.35);
    font: 600 8px/1 ui-monospace, monospace;
    letter-spacing: 0.20em; text-transform: uppercase;
    padding-bottom: 2px;
  }
  #audio-panel audio {
    /* Native browser controls hidden — we render our own UI in this panel
       and treat the <audio> element as a headless playback engine. */
    display: none;
  }

  /* ── Track header: round play button + title + volume control ─────── */
  #audio-panel .audio-head {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 8px; align-items: center;
    margin-top: 2px;
  }
  /* Compact volume control on the right of the header. Click icon toggles
     mute; the slider adjusts level. Browser-default range chrome dropped
     in favor of a flat orange thumb on a dim track. */
  #audio-panel .audio-vol {
    display: flex; gap: 4px; align-items: center;
  }
  #audio-panel .audio-vol-icon {
    font-size: 11px; line-height: 1; cursor: pointer;
    color: rgba(240,235,224,0.55);
    user-select: none;
  }
  #audio-panel .audio-vol-icon:hover { color: #f0ebe0; }
  #audio-panel .audio-vol-slider {
    -webkit-appearance: none; appearance: none;
    width: 56px; height: 3px;
    background: rgba(240,235,224,0.18);
    outline: none; cursor: pointer; padding: 0; margin: 0;
  }
  #audio-panel .audio-vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff4b1f; border: 0; cursor: pointer;
  }
  #audio-panel .audio-vol-slider::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff4b1f; border: 0; cursor: pointer;
  }
  #audio-panel .audio-play {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,75,31,0.18); color: #ff4b1f;
    border: 1px solid rgba(255,75,31,0.55);
    font-size: 10px; cursor: pointer; line-height: 1;
    padding: 0; display: flex; align-items: center; justify-content: center;
    transition: background 0.1s;
  }
  #audio-panel .audio-play:hover { background: rgba(255,75,31,0.32); }
  #audio-panel.has-track .audio-play { color: #f0ebe0; border-color: #ff4b1f; }
  #audio-panel .audio-title {
    color: #f0ebe0; font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.02em;
  }

  /* ── Stat row: BPM | KEY | LUFS ────────────────────────────────────── */
  #audio-panel .audio-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
  }
  #audio-panel .audio-stat {
    background: rgba(255,75,31,0.05);
    border: 1px solid rgba(255,75,31,0.18);
    padding: 4px 6px; text-align: center;
  }
  #audio-panel .audio-stat-value {
    color: #ff4b1f; font-size: 14px; font-weight: 500;
    line-height: 1.1; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  #audio-panel.has-track .audio-stat-value { color: #ff7a4f; }
  #audio-panel .audio-stat-unit {
    color: rgba(240,235,224,0.45); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-top: 1px;
  }

  /* ── Progress scrubber + time row ──────────────────────────────────── */
  #audio-panel .audio-progress {
    height: 14px; cursor: pointer; padding: 5px 0;
    position: relative;
  }
  #audio-panel .audio-progress-track {
    height: 4px; background: rgba(240,235,224,0.10);
    border-radius: 2px; position: relative; overflow: hidden;
  }
  #audio-panel .audio-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff4b1f, #ff7a4f);
    box-shadow: 0 0 6px rgba(255,75,31,0.55);
    transition: width 0.05s linear;
  }
  #audio-panel .audio-time-row {
    display: flex; justify-content: space-between;
    font-size: 9px; color: rgba(240,235,224,0.55);
    font-variant-numeric: tabular-nums;
    margin-top: -2px;
  }

  /* ── Live row: 7-band EQ bars + drum onset lights ──────────────────── */
  #audio-panel .audio-eq-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px; align-items: end;
    height: 32px;
    padding: 4px 2px 0;
    border-top: 1px dashed rgba(240,235,224,0.10);
    margin-top: 2px;
  }
  #audio-panel .audio-eq {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px; height: 100%; align-items: end;
  }
  #audio-panel .audio-eq-bar {
    height: 2%;
    background: linear-gradient(0deg, #ff4b1f, #ff7a4f 60%, #ffe1d2);
    border-radius: 1px 1px 0 0;
    transition: height 0.05s linear;
    min-height: 1px;
  }
  #audio-panel .audio-drum-lights {
    display: flex; gap: 3px; align-items: end; padding-bottom: 1px;
  }
  /* Drum onset lights — fully bound to the flash value via the --lit
     custom property (0..1). updateAudioDockLive() writes it every frame
     and the CSS interpolates colour/glow continuously. Smooth pulse
     instead of a binary class toggle so the eye reads the decay tail. */
  #audio-panel .audio-drum {
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 600; letter-spacing: 0;
    border-radius: 50%;
    color: rgba(255, 255, 255, calc(0.30 + 0.70 * var(--lit, 0)));
    background: rgba(255, 75, 31,  calc(var(--lit, 0) * 0.65 + 0.04));
    border: 1px solid rgba(255, 75, 31, calc(0.14 + var(--lit, 0) * 0.86));
    box-shadow: 0 0 calc(8px * var(--lit, 0)) rgba(255, 122, 79, 0.7);
  }

  /* ── Foot row: track picker + load / unload buttons ────────────────── */
  #audio-panel .audio-foot {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 4px; align-items: center;
    border-top: 1px dashed rgba(240,235,224,0.10);
    padding-top: 6px; margin-top: 2px;
  }
  #audio-panel .audio-track {
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 3px 6px;
    min-width: 0;
  }
  #audio-panel .audio-foot .grad-btn { font-size: 9px; padding: 3px 8px; }

  /* When no track loaded, hide the data-driven sections to avoid empty
     stat cards / meaningless EQ bars. */
  #audio-panel:not(.has-track) .audio-stats,
  #audio-panel:not(.has-track) .audio-progress,
  #audio-panel:not(.has-track) .audio-time-row,
  #audio-panel:not(.has-track) .audio-eq-row { display: none; }
  #audio-panel:not(.has-track) .audio-title { color: rgba(240,235,224,0.45); }

  /* Beat-pulse on the BPM stat card. Driven by an envelope (fast attack,
     slow release) computed in updateAudioDockLive — written into the
     --beat custom property so the box-shadow halo and value brightness
     interpolate continuously. Reads as a clear "tap your foot here" cue. */
  #audio-panel .audio-stat.bpm {
    box-shadow:
      0 0 calc(14px * var(--beat, 0)) rgba(255, 75, 31, calc(var(--beat, 0) * 0.55)),
      inset 0 0 calc(8px * var(--beat, 0)) rgba(255, 75, 31, calc(var(--beat, 0) * 0.18));
    border-color: rgba(255, 75, 31, calc(0.18 + 0.62 * var(--beat, 0)));
  }
  #audio-panel .audio-stat.bpm .audio-stat-value {
    color: rgb(
      calc(255 - 0 * var(--beat, 0)),
      calc(122 + 50 * var(--beat, 0)),
      calc(79  + 80 * var(--beat, 0))
    );
    text-shadow: 0 0 calc(8px * var(--beat, 0)) rgba(255, 200, 150, calc(var(--beat, 0) * 0.7));
  }

  /* Status line kept around for back-compat with code paths that read it,
     but visually demoted to invisible — the new UI conveys all state. */
  #audio-panel .audio-status { display: none; }
  #panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #ff4b1f 30%, #c23a17 70%, transparent);
    z-index: 1;
  }
  #editor {
    overflow-y: auto;
    padding: 12px 12px 16px;
  }
  #editor::-webkit-scrollbar { width: 6px; }
  #editor::-webkit-scrollbar-thumb { background: rgba(240,235,224,0.18); }
  #status-bar {
    border-top: 1px solid rgba(240,235,224,0.10);
    padding: 5px 12px;
    font: 400 9px/1.4 ui-monospace, monospace;
    letter-spacing: 0.10em;
    color: rgba(240,235,224,0.40);
    background: rgba(12,10,7,0.7);
    display: flex; justify-content: space-between;
  }
  #status-bar b { color: #ff4b1f; font-weight: 500; }

  /* tab-nav: two rows, scene + emitters with labelled gutters */
  #tab-nav { display: flex; flex-direction: column; }
  .tab-group-row {
    display: flex; flex-direction: column; align-items: stretch; min-width: 0;
    background: linear-gradient(180deg, #14110c, #0c0a07);
    border-bottom: 1px solid rgba(240,235,224,0.08);
  }
  .tab-group-row.last { border-bottom: 1px solid rgba(240,235,224,0.18); position: relative; }
  .tab-group-row.last::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: #ff4b1f; opacity: 0.45;
  }
  .tab-group-label {
    flex: 0 0 auto;
    padding: 6px 12px 2px;
    font: 600 8px/1 ui-monospace, monospace;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: rgba(240,235,224,0.30);
    background: #050402;
    border-right: 0;
    display: flex; align-items: center;
  }
  .tab-strip {
    display: flex; flex: 1 1 auto; min-width: 0; overflow-x: auto;
    scrollbar-width: none;
  }
  /* When the strip can grow tall (emitters), wrap onto multiple rows
     instead of scrolling off-screen. Each row stays single-line. */
  .tab-strip.wrap {
    flex-wrap: wrap; overflow-x: visible;
    align-content: flex-start;
  }
  .tab-strip::-webkit-scrollbar { display: none; }
  .tab {
    font: 600 9px/1 ui-monospace, monospace;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(240,235,224,0.55);
    background: transparent; border: 0; cursor: pointer;
    padding: 9px 9px;
    border-bottom: 2px solid transparent;
    position: relative;
    transition: color 120ms, background 120ms;
    flex: 0 0 auto;
    max-width: 130px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* In wrap mode each tab claims at least 200px so only 2 fit per row
     (strip width ~400px → 2×200=400 just fits, 3×200=600 wraps). Each tab
     ends up ~190-200px wide — comfortably more than any name + badge. */
  .tab-strip.wrap .tab {
    flex: 1 1 200px; min-width: 0; max-width: none;
    text-align: left;
  }
  .tab-strip.wrap .tab.tab-add { flex: 0 0 auto; }
  .tab:hover { color: #f0ebe0; }
  .tab.tab-em { padding-left: 16px; }
  .tab.tab-em::before {
    content: ''; position: absolute; left: 6px; top: 9px; bottom: 9px; width: 3px;
    background: var(--c, #ff4b1f);
    box-shadow: 0 0 6px var(--c, #ff4b1f);
  }
  .tab.selected {
    color: #f0ebe0;
    background: rgba(255,75,31,0.10);
    border-bottom-color: #ff4b1f;
  }
  .tab .tab-badge {
    display: inline-block; margin-left: 6px;
    font: 500 9px/1 ui-monospace, monospace;
    color: rgba(240,235,224,0.25);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .tab.selected .tab-badge { color: #ff4b1f; }
  .tab-add {
    color: #ff4b1f; font-weight: 700;
    border-left: 1px solid rgba(240,235,224,0.08);
  }

  /* emitter header */
  .em-head {
    display: grid;
    grid-template-columns: 22px 1fr auto auto auto;
    gap: 10px;
    align-items: center;
    padding: 4px 2px 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(240,235,224,0.08);
  }
  .em-head .em-power {
    background: transparent;
    border: 1px solid var(--c, #ff4b1f);
    color: var(--c, #ff4b1f);
    cursor: pointer;
    padding: 3px 7px;
    font: 600 9px/1 ui-monospace, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .em-head .em-power:hover { background: rgba(255,75,31,0.12); }
  /* disabled emitter visual treatment */
  .em-head.disabled .em-color::after { opacity: 0.30; }
  .em-head.disabled .em-name { color: rgba(240,235,224,0.45); }
  .em-head.disabled .em-power {
    border-color: rgba(240,235,224,0.30);
    color: rgba(240,235,224,0.45);
    background: rgba(240,235,224,0.04);
  }
  /* dim a disabled emitter's tab */
  .tab.tab-em.disabled { opacity: 0.45; }
  .tab.tab-em.disabled::before {
    background: rgba(240,235,224,0.30);
    box-shadow: none;
  }
  .em-head .em-color {
    width: 20px; height: 20px;
    border: 1px solid rgba(240,235,224,0.18);
    background: rgba(240,235,224,0.04);
    position: relative;
  }
  .em-head .em-color::after {
    content: ''; position: absolute; inset: 2px;
    background: var(--c, #ff4b1f);
    box-shadow: inset 0 0 8px rgba(0,0,0,0.35);
  }
  .em-head .em-name {
    font: 500 13px/1 ui-monospace, monospace;
    background: transparent; border: 0; color: #f0ebe0;
    padding: 4px 0;
    border-bottom: 1px dashed transparent;
    outline: none; width: 100%;
  }
  .em-head .em-name:hover { border-bottom-color: rgba(240,235,224,0.18); }
  .em-head .em-name:focus { border-bottom-color: #ff4b1f; }
  .em-head .em-stats {
    font-size: 9px; letter-spacing: 0.10em;
    color: rgba(240,235,224,0.55);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .em-head .em-stats b { color: #ff4b1f; font-weight: 500; }
  .em-head .em-del {
    background: transparent; border: 0;
    color: rgba(240,235,224,0.25); cursor: pointer;
    font: 400 12px/1 ui-monospace, monospace;
    padding: 4px 6px;
  }
  .em-head .em-del:hover { color: #ff4b1f; }

  /* phase dividers — clickable to collapse the whole phase */
  .phase-block {}
  .phase-block .phase-body { display: grid; gap: 0; }
  .phase-block.collapsed .phase-body { display: none; }
  .phase {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 10px; align-items: center;
    margin: 14px 0 6px;
    cursor: pointer;
    user-select: none;
    transition: opacity 120ms;
  }
  .phase:hover { opacity: 0.85; }
  .phase-block.collapsed .phase { opacity: 0.55; margin-bottom: 4px; }
  .phase-block:first-of-type .phase { margin-top: 4px; }
  .phase .ph-num {
    font: 700 9px/1 ui-monospace, monospace;
    color: #ff4b1f;
    letter-spacing: 0.10em;
    background: #050402;
    padding: 5px 7px;
    border: 1px solid #ff4b1f;
    font-variant-numeric: tabular-nums;
    transition: background 120ms;
  }
  .phase:hover .ph-num { background: rgba(255,75,31,0.12); }
  .phase .ph-name {
    font: 600 10px/1 ui-monospace, monospace;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #f0ebe0;
  }
  .phase .ph-name .ph-sub {
    display: block;
    font: 400 8px/1.4 ui-monospace, monospace;
    letter-spacing: 0.14em;
    color: rgba(240,235,224,0.30);
    margin-top: 4px;
    text-transform: lowercase;
  }
  .phase .ph-chev {
    font: 500 11px/1 ui-monospace, monospace;
    color: #ff4b1f;
    display: inline-block;
    transition: transform 150ms;
    padding-left: 4px;
  }
  .phase-block.collapsed .ph-chev { transform: rotate(-90deg); }
  .phase .ph-line {
    height: 1px;
    background: linear-gradient(90deg, #ff4b1f, transparent);
    opacity: 0.6;
  }

  /* updated module cards: header row + collapsible body */
  .mod {
    background: rgba(255,75,31,0.04);
    border: 1px solid rgba(240,235,224,0.10);
    border-left: 2px solid var(--c, #ff4b1f);
    margin-bottom: 4px;
    transition: opacity 120ms, border-left-color 120ms;
  }
  .mod.disabled { opacity: 0.40; border-left-color: rgba(240,235,224,0.20); }
  .mod-head {
    display: grid;
    grid-template-columns: auto auto 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    cursor: pointer;
    transition: background 120ms;
    background: transparent;
  }
  .mod-head .pip {
    width: 10px; height: 10px;
    border: 1px solid var(--c, #ff4b1f);
    background: var(--c, #ff4b1f);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 120ms;
  }
  .mod.disabled .mod-head .pip {
    background: transparent;
    border-color: rgba(240,235,224,0.30);
  }
  .mod-head .pip:hover { box-shadow: 0 0 0 1px var(--c, #ff4b1f); }
  .mod-head:hover { background: rgba(255,75,31,0.10); }
  .mod-head .mod-chev {
    display: inline-block; width: 10px;
    font-size: 10px; color: #ff4b1f;
    transition: transform 150ms;
  }
  .mod.collapsed .mod-chev { transform: rotate(-90deg); }
  .mod-head .name {
    font: 500 10px/1.1 ui-monospace, monospace;
    color: #f0ebe0; flex: 1; letter-spacing: 0.04em;
  }
  .mod-head .name .ns { color: rgba(240,235,224,0.40); }
  .mod-head .kind {
    font: 500 8px/1 ui-monospace, monospace;
    color: var(--c, #ff4b1f);
    letter-spacing: 0.16em; text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid var(--c, #ff4b1f);
    background: rgba(255,255,255,0.02);
  }
  .mod-head .del {
    background: transparent; border: 0;
    color: rgba(240,235,224,0.25); cursor: pointer;
    font-size: 10px; padding: 4px;
  }
  .mod-head .del:hover { color: #ff4b1f; }
  .mod-body {
    border-top: 1px solid rgba(240,235,224,0.08);
    padding: 8px 10px 10px 14px;
    background: rgba(12,10,7,0.5);
    display: grid; gap: 4px;
  }
  .mod.collapsed .mod-body { display: none; }

  /* sub-section card refresh — high-specificity to beat #panel h3 base rule */
  #editor .section {
    border: 1px solid rgba(240,235,224,0.08);
    margin-bottom: 8px;
    background: rgba(20,17,12,0.5);
    position: relative;
  }
  #editor .section h3 {
    margin: 0;
    padding: 8px 10px;
    background: linear-gradient(90deg, rgba(28,24,18,0.7), transparent 70%);
    border-bottom: 1px solid rgba(240,235,224,0.08);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(240,235,224,0.55);
    font-weight: 500;
  }
  #editor .section h3.collapsible.collapsed { border-bottom-color: transparent; color: rgba(240,235,224,0.30); }
  #editor .section .section-body { padding: 8px 10px 10px; display: grid; gap: 4px; }
  #editor .section .section-body:empty { display: none; }
  /* The "Modules" body should not gridify so cards take full width tightly */
  #editor .section .section-body .mod { gap: 0; }
  #panel h3 { margin: 0; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(240,235,224,0.45); font-weight: 500; padding: 8px 0 4px; border-bottom: 1px solid rgba(240,235,224,0.12); }
  #panel h3:first-child { padding-top: 0; }
  #panel h3.collapsible { cursor: pointer; user-select: none; }
  #panel h3.collapsible:hover { color: #ff4b1f; }
  #panel h3.collapsible .caret { display: inline-block; width: 9px; transition: transform 0.12s; color: rgba(240,235,224,0.55); }
  #panel h3.collapsible.collapsed .caret { transform: rotate(-90deg); }
  #panel h3.collapsible.collapsed { color: rgba(240,235,224,0.30); }
  .section-body { padding-bottom: 4px; }
  .row { display: grid; grid-template-columns: 88px 1fr 42px; gap: 6px; align-items: center; margin: 2px 0; }
  .row label { color: rgba(240,235,224,0.55); text-transform: uppercase; font-size: 9px; }
  .row input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: rgba(240,235,224,0.20); outline: none; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 8px; height: 12px; background: #ff4b1f; cursor: pointer; }
  .row input[type=range]::-moz-range-thumb { width: 8px; height: 12px; background: #ff4b1f; cursor: pointer; border: none; }
  .row input[type=checkbox] { accent-color: #ff4b1f; }
  .row select { background: rgba(12,10,7,0.7); color: #f0ebe0; border: 1px solid rgba(240,235,224,0.18); font: inherit; font-size: 10px; padding: 1px 2px; }
  .row .v { color: #ff4b1f; text-align: right; font-weight: 500; font-size: 10px; }
  /* Click-to-edit numeric value column. Looks like the read-only `.v` span
     until you click it, then turns into a focused input you can type into. */
  input.v.v-input {
    background: transparent; border: 0;
    color: #ff4b1f; text-align: right; font-weight: 500;
    font: inherit; font-size: 10px; line-height: 1;
    padding: 1px 2px; width: 100%; box-sizing: border-box;
    font-variant-numeric: tabular-nums;
    cursor: text;
  }
  input.v.v-input:hover { background: rgba(255,75,31,0.08); }
  input.v.v-input:focus {
    outline: 1px solid rgba(255,75,31,0.55);
    outline-offset: 0;
    background: rgba(255,75,31,0.10);
  }

  /* ----- module list ----- */
  .mod {
    background: rgba(255,75,31,0.04);
    border: 1px solid rgba(240,235,224,0.10);
    padding: 6px 8px; margin: 4px 0;
  }
  .mod.disabled { opacity: 0.4; }
  .mod-head {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
    margin: -6px -8px 4px; padding: 6px 8px;
    background: rgba(240,235,224,0.04);
  }
  .mod-head:hover { background: rgba(255,75,31,0.10); }
  .mod-head .name { color: #ff4b1f; font-weight: 500; flex: 1; font-size: 10px; }
  .mod-head .kind { color: rgba(240,235,224,0.40); font-size: 9px; }
  .mod-head .del { color: rgba(240,235,224,0.55); padding: 0 2px; cursor: pointer; }
  .mod-head .del:hover { color: #ff4b1f; }
  .mod-body { display: block; }
  .mod.collapsed .mod-body { display: none; }
  .mod-body textarea {
    width: 100%; box-sizing: border-box; min-height: 38px; font: inherit; font-size: 10px;
    background: rgba(12,10,7,0.7); color: #f0ebe0; border: 1px solid rgba(240,235,224,0.18); padding: 3px 4px;
    margin: 2px 0; resize: vertical;
  }
  .preview { height: 28px; background: rgba(12,10,7,0.5); margin: 2px 0 4px; }

  /* ----- add-module modal ----- */
  #addBtn {
    background: rgba(255,75,31,0.12); color: #ff4b1f; border: 1px dashed rgba(255,75,31,0.4);
    padding: 6px; cursor: pointer; font: inherit; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; text-align: center;
  }
  #addBtn:hover { background: rgba(255,75,31,0.20); }
  #picker {
    position: absolute; top: 12px; right: 348px; width: 280px; max-height: calc(100% - 24px);
    background: rgba(12,10,7,0.95); border: 1px solid #ff4b1f;
    backdrop-filter: blur(8px); padding: 10px;
    font-size: 10px; display: none; z-index: 50; overflow-y: auto;
  }
  #picker.show { display: block; }
  #picker input[type=search] {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 11px;
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.20); padding: 5px 6px; margin-bottom: 6px;
  }
  .pcat { color: rgba(240,235,224,0.45); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 0 2px; }
  .pitem { padding: 5px 6px; cursor: pointer; border: 1px solid transparent; }
  .pitem:hover { border-color: #ff4b1f; background: rgba(255,75,31,0.08); }
  .pitem .pname { color: #ff4b1f; font-weight: 500; }
  .pitem .pdoc { color: rgba(240,235,224,0.55); font-size: 9px; margin-top: 1px; }

  /* ----- gradient picker ----- */
  .grad-picker { padding: 4px 0; }
  .grad-track-host {
    position: relative; width: 100%; height: 22px; margin-bottom: 14px;
    border: 1px solid rgba(240,235,224,0.18);
  }
  .grad-track { display: block; width: 100%; height: 22px; cursor: crosshair; }
  .grad-stops { position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; }
  .grad-stop {
    position: absolute; bottom: 0;
    width: 10px; height: 10px;
    transform: translateX(-50%);
    border: 1px solid rgba(240,235,224,0.30);
    cursor: ew-resize;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    box-sizing: border-box;
  }
  .grad-stop.selected { border-color: #ff4b1f; transform: translateX(-50%) scale(1.25); z-index: 2; }
  .grad-btn-row { display: flex; gap: 4px; margin: 4px 0 6px; }
  .grad-btn {
    background: rgba(255,75,31,0.10); color: #ff4b1f;
    border: 1px solid rgba(255,75,31,0.30); cursor: pointer;
    padding: 2px 8px; font: inherit; font-size: 11px;
  }
  .grad-btn:hover { background: rgba(255,75,31,0.25); }
  .grad-editor { display: flex; gap: 8px; align-items: flex-start; }
  .grad-wheel-stack { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
  .grad-wheel, .grad-wheel-overlay {
    position: absolute; left: 0; top: 0; width: 110px; height: 110px;
    border-radius: 55px; cursor: crosshair;
  }
  .grad-wheel-overlay { pointer-events: none; }
  .grad-controls { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .grad-row {
    display: grid; grid-template-columns: 50px 1fr 36px;
    gap: 4px; align-items: center; font-size: 9px;
  }
  .grad-row label { color: rgba(240,235,224,0.55); text-transform: uppercase; }
  .grad-row input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px; background: rgba(240,235,224,0.20); outline: none;
  }
  .grad-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 8px; height: 12px; background: #ff4b1f; cursor: pointer;
  }
  .grad-row .gv { color: #ff4b1f; text-align: right; font-size: 9px; }
  .grad-hex {
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 1px 3px; width: 100%;
    box-sizing: border-box;
  }

  /* ----- curve picker ----- */
  .curve-picker { padding: 4px 0; }
  .curve-canvas {
    display: block; width: 100%; max-width: 100%; height: 100px;
    background: #0c0a07; border: 1px solid rgba(240,235,224,0.18); cursor: crosshair;
  }
  .curve-help { color: rgba(240,235,224,0.45); font-size: 9px; margin: 3px 0 4px; }
  .curve-vmax {
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 1px 3px; width: 100%;
    box-sizing: border-box;
  }

  /* ----- binding link icon + popover ----- */
  .row-bindable { grid-template-columns: 64px 1fr 18px 32px; }
  .link-btn {
    color: rgba(240,235,224,0.40); cursor: pointer; text-align: center;
    font-size: 10px; line-height: 1; user-select: none; padding: 0 2px;
  }
  .link-btn:hover { color: #ff4b1f; }
  .bound-pill {
    background: rgba(255,75,31,0.15); color: #ff4b1f;
    border: 1px solid rgba(255,75,31,0.45);
    padding: 2px 6px; cursor: pointer; font-size: 9px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bound-pill:hover { background: rgba(255,75,31,0.30); }
  .bound-pill .src { color: #f0ebe0; }
  .bound-pill .src::before { content: '🔗 '; opacity: 0.6; }

  /* Inline editor shown in the spawn-rules grid when a constant value
     was replaced by a Bound (e.g. rate ← audio.bands.mid × 1000). */
  .row.row-bound { grid-template-columns: 88px 1fr 22px; align-items: center; }
  .bound-editor {
    display: flex; gap: 6px; align-items: center; min-width: 0;
  }
  .bound-editor .bound-pill {
    flex: 1 1 auto; min-width: 0;
    /* Pills inside the bound editor get cramped by the scale input. Allow
       the source path to wrap onto two lines instead of ellipsis-clipping
       it to "audio.b_" — the user needs to read the full path. */
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.25;
    text-overflow: clip;
  }
  .bound-editor .bound-mul {
    color: rgba(240,235,224,0.45); font-size: 10px; flex: 0 0 auto;
  }
  .bound-editor .bound-scale {
    flex: 0 0 64px;
    background: rgba(12,10,7,0.7); color: #ff4b1f;
    border: 1px solid rgba(255,75,31,0.30);
    font: inherit; font-size: 10px; padding: 1px 4px;
    text-align: right;
  }
  .bound-unbind {
    background: transparent; border: 0; cursor: pointer;
    color: rgba(240,235,224,0.45); font-size: 11px; padding: 0;
    line-height: 1;
  }
  .bound-unbind:hover { color: #ff4b1f; }

  /* Backdrop dim while the source panel is open */
  .source-backdrop {
    position: fixed; inset: 0; z-index: 199;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(2px);
  }
  /* Wide centred source-picker panel — every category visible at once via
     multi-column flow, no scrolling needed under typical conditions. */
  .source-pop {
    position: fixed; z-index: 200;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(12,10,7,0.97); color: #f0ebe0;
    border: 1px solid #ff4b1f;
    width: min(960px, 92vw); max-height: 86vh; overflow-y: auto;
    padding: 14px 16px;
    font-size: 10px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.75);
  }
  .source-pop-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(240,235,224,0.10);
  }
  .source-pop-title {
    color: rgba(240,235,224,0.55);
    font-size: 9px; letter-spacing: 0.20em; text-transform: uppercase;
    flex: 0 0 auto;
  }
  .source-pop-search {
    flex: 1 1 auto;
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 11px; padding: 4px 8px;
    letter-spacing: 0.04em;
  }
  .source-pop-search:focus {
    outline: 1px solid rgba(255,75,31,0.55); outline-offset: 0;
    border-color: rgba(255,75,31,0.55);
  }
  .source-pop-close {
    flex: 0 0 auto;
    background: transparent; border: 0; cursor: pointer;
    color: rgba(240,235,224,0.55); font-size: 14px; padding: 0 4px;
  }
  .source-pop-close:hover { color: #ff4b1f; }
  .source-pop-grid {
    column-width: 220px; column-gap: 18px;
  }
  /* Each category is a "card" inside the multi-column grid. break-inside
     keeps a category whole rather than splitting across columns. */
  .source-pop .sp-category {
    break-inside: avoid; -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    margin-bottom: 14px;
    border: 1px solid rgba(240,235,224,0.08);
    background: rgba(20,17,12,0.45);
  }
  .source-pop .sp-cat {
    color: rgba(240,235,224,0.55); padding: 6px 8px;
    font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase;
    display: grid; grid-template-columns: 1fr auto; gap: 6px;
    align-items: center;
    background: linear-gradient(90deg, rgba(28,24,18,0.7), transparent 70%);
    border-bottom: 1px solid rgba(240,235,224,0.08);
  }
  .source-pop .sp-category.is-audio .sp-cat { color: #ff4b1f; }
  .source-pop .sp-cat-count {
    color: rgba(240,235,224,0.35); font-size: 9px;
    font-variant-numeric: tabular-nums; letter-spacing: 0;
  }
  .source-pop .sp-cat-warn {
    grid-column: 1 / -1;
    color: rgba(255,75,31,0.65); font-size: 8px; letter-spacing: 0.05em;
    text-transform: lowercase; font-style: italic; margin-top: 2px;
  }
  .source-pop .sp-cat-body { padding: 2px 0; }
  .source-pop .sp-item {
    padding: 4px 10px; cursor: pointer; font-family: ui-monospace, monospace;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .source-pop .sp-item:hover { background: rgba(255,75,31,0.15); }
  .source-pop .sp-item.disabled { color: rgba(240,235,224,0.25); cursor: not-allowed; }
  .source-pop .sp-item.disabled:hover { background: transparent; }
  .source-pop .sp-item .sp-range {
    color: rgba(240,235,224,0.45); font-size: 9px;
  }
  .source-pop .sp-unbind {
    margin-top: 6px; padding: 6px 10px; cursor: pointer;
    background: rgba(240,235,224,0.06);
    border-top: 1px solid rgba(240,235,224,0.12);
    color: #ff4b1f; text-align: center; letter-spacing: 0.10em;
    text-transform: uppercase; font-size: 9px;
  }
  .source-pop .sp-unbind:hover { background: rgba(255,75,31,0.20); }

  /* ----- emitter spawn settings ----- */
  .rng-toggle {
    background: rgba(255,75,31,0.10); color: #ff4b1f;
    border: 1px solid rgba(255,75,31,0.30); cursor: pointer;
    padding: 1px 6px; font: inherit; font-size: 9px; letter-spacing: 0.06em;
    text-transform: uppercase; border-radius: 0;
  }
  .rng-toggle:hover { background: rgba(255,75,31,0.25); }
  /* Inline sub-divider inside a section (e.g. between origin and shape). */
  .sub-divider {
    margin: 8px 0 4px;
    color: rgba(240,235,224,0.45); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-top: 1px dashed rgba(240,235,224,0.10);
    padding-top: 6px;
  }
  .modules-empty {
    color: rgba(240,235,224,0.40); font-size: 10px; font-style: italic;
    padding: 8px 4px; line-height: 1.4;
  }
  /* Top of the Trigger section — at-a-glance summary of which spawn
     sources are live for this emitter (continuous / bursts / triggers). */
  .trigger-summary {
    font-size: 10px; color: rgba(240,235,224,0.80);
    background: rgba(255,75,31,0.07);
    border-left: 2px solid rgba(255,75,31,0.50);
    padding: 6px 10px; margin: 0 0 6px 0;
    line-height: 1.45; letter-spacing: 0.04em;
  }

  /* Direction-override editor inside Initial values. */
  .dir-editor { display: flex; flex-direction: column; gap: 2px; }
  .dir-editor select {
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 1px 4px;
    text-transform: lowercase;
  }
  .dir-hint {
    color: rgba(240,235,224,0.40); font-size: 9px; line-height: 1.3;
    padding: 2px 6px 4px; font-style: italic;
  }

  /* Incoming sub-emit triggers: list of other emitters whose emit.* modules
     target this one. Click to jump to the source emitter. */
  .incoming-head {
    margin-top: 6px;
    color: rgba(240,235,224,0.40);
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    border-top: 1px dashed rgba(240,235,224,0.10);
    padding: 6px 0 2px;
  }
  .incoming-row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 6px;
    align-items: center;
    padding: 3px 6px; cursor: pointer;
    background: rgba(255,75,31,0.06);
    border-left: 2px solid rgba(255,75,31,0.55);
    font-size: 9px;
  }
  .incoming-row:hover { background: rgba(255,75,31,0.14); }
  .incoming-row .inc-from { color: #ff4b1f; font-weight: 500; }
  .incoming-row .inc-trigger { color: rgba(240,235,224,0.65); overflow: hidden; text-overflow: ellipsis; }
  .incoming-row .inc-count { color: rgba(240,235,224,0.45); font-variant-numeric: tabular-nums; }

  .static-color { padding: 4px 0; }
  .color-swatch {
    width: 100%; height: 22px;
    border: 1px solid rgba(240,235,224,0.20);
    background: #fff;
    box-sizing: border-box;
    cursor: pointer;
    padding: 0; margin: 0;
    position: relative;
  }
  .color-swatch::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg,
      transparent 0 4px, rgba(240,235,224,0.05) 4px 5px);
    pointer-events: none;
  }
  /* ----- custom color picker popover ----- */
  .color-pop {
    position: fixed; z-index: 200;
    background: rgba(12,10,7,0.97); color: #f0ebe0;
    border: 1px solid #ff4b1f;
    padding: 10px;
    width: 220px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    display: flex; flex-direction: column; gap: 8px;
    user-select: none;
  }
  .color-pop .cp-sat {
    width: 200px; height: 140px;
    position: relative; cursor: crosshair;
    background-image:
      linear-gradient(to top, #000, transparent),
      linear-gradient(to right, #fff, var(--hue-color, #f00));
  }
  .color-pop .cp-sat-thumb {
    position: absolute; width: 12px; height: 12px;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    border-radius: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .color-pop .cp-hue {
    width: 200px; height: 14px; position: relative; cursor: ew-resize;
    background: linear-gradient(to right,
      #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
  }
  .color-pop .cp-hue-thumb {
    position: absolute; top: -2px; bottom: -2px; width: 4px;
    background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.7);
    transform: translateX(-50%); pointer-events: none;
  }
  .color-pop .cp-foot {
    display: flex; gap: 6px; align-items: center;
  }
  .color-pop .cp-preview {
    width: 28px; height: 22px;
    border: 1px solid rgba(240,235,224,0.20);
  }
  .color-pop .cp-hex {
    flex: 1 1 auto;
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 3px 6px;
    text-transform: lowercase;
  }
  .bursts { display: flex; flex-direction: column; gap: 6px; padding: 2px 0 4px; }
  /* Each burst is a small card. Values stack one per row so the user can
     see full numbers without truncation (1,000,000 fit comfortably). */
  .burst-card {
    border: 1px solid rgba(240,235,224,0.10);
    padding: 6px 6px 4px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .burst-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 6px; align-items: center; font-size: 9px;
  }
  .burst-row > .burst-label {
    color: rgba(240,235,224,0.55);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .burst-row input[type=number], .burst-row input[type=text] {
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 2px 5px; min-width: 0;
    box-sizing: border-box; width: 100%;
  }
  .burst-row input[type=checkbox] { accent-color: #ff4b1f; justify-self: start; }
  .burst-actions { display: flex; justify-content: flex-end; padding-top: 2px; }

  /* ----- audio block ----- */
  .audio-block { padding: 4px 0; }
  .audio-row {
    display: flex; gap: 4px; align-items: center; margin-top: 6px;
    flex-wrap: wrap;
  }
  .audio-track {
    background: rgba(12,10,7,0.7); color: #f0ebe0;
    border: 1px solid rgba(240,235,224,0.18);
    font: inherit; font-size: 10px; padding: 2px 4px;
    flex: 1 1 100%; min-width: 0; max-width: 100%;
  }
  .audio-status { color: #9ee37d; font-size: 9px; margin-left: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="scene-overlay" xmlns="http://www.w3.org/2000/svg" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible"></svg>

<div class="topbar" id="topbar">
  <button data-preset="fountain"  class="on">Fountain</button>
  <button data-preset="explosion">Explosion</button>
  <button data-preset="snow">Snow</button>
  <button data-preset="rain">Rain</button>
  <button data-preset="smoke">Smoke</button>
  <button data-preset="galaxy">Galaxy</button>
  <button data-preset="beats">Beats</button>
  <button data-preset="boids">Boids</button>
  <button data-preset="fluid">Fluid</button>
  <button data-preset="balls">Balls</button>
  <button data-preset="stress">Stress 1M</button>
  <button data-preset="empty">Empty</button>
  <span class="gap"></span>
  <button id="reset" title="Clear particles + restart simulation; keeps your parameter edits">Reset Sim</button>
  <button id="reload" title="Rebuild emitter from preset defaults — discards your edits">Reload Preset</button>
  <button id="pause">Pause</button>
  <button id="dumpJson">Copy JSON</button>
</div>

<p class="label"><b>particle playground</b> · click to fire a 100-particle burst at the cursor · drag to orbit · scroll to zoom</p>
<div class="stats" id="stats">
  <div class="stat-backend" id="stat-backend">backend: ?</div>
  <div><b id="stat-fps">0</b> fps</div>
  <div>alive: <b id="stat-alive">0</b></div>
  <div>sim: <b id="stat-sim">0.0</b> ms <span class="info">approx</span></div>
  <div>render: <b id="stat-render">0.0</b> ms <span class="info">approx</span></div>
  <div>gpuMem: <b id="stat-gpumem">0.0</b> MB</div>
</div>

<aside id="panel">
  <nav id="tab-nav"></nav>
  <main id="editor" class="editor"></main>
  <footer id="status-bar"></footer>
</aside>
<!-- audio-panel removed: core/audio.js not vendored into the portfolio -->
<aside id="picker"><input type="search" id="pickerSearch" placeholder="search modules…"><div id="pickerList"></div></aside>

<script type="module">
import {
  createParticleSystem, Emitter,
  PRESETS, buildPreset, modules, shapes, SHAPE_FACTORIES, MODULE_DEFS,
  Curve, Gradient, gradientPicker, curvePicker,
  isSourceBinding, evalBoundScalar, getSource,
  mat4LookAt, mat4Perspective,
} from '../js/particles/index.js';

// AudioFeed is dropped from the portfolio vendoring — declare a stub so any
// unreachable references (inside the audio dock builder, which we no-op below)
// still parse without ReferenceError.
const AudioFeed = null;

// WebGPU-only playground. No-WebGPU visitors get a small notice + a back link.
if (!('gpu' in navigator)) {
  document.body.innerHTML = '<p style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:13px;line-height:1.7;color:#ff4b1f;font-family:JetBrains Mono,monospace">'
    + 'WebGPU required.<br><span style="color:rgba(240,235,224,0.6)">This playground exposes the full GPGPU pipeline — Chrome 113+, Edge 113+, or any Chromium with WebGPU enabled.</span><br><br>'
    + '<a href="/" style="color:#ff4b1f;border:1px solid #ff4b1f;padding:6px 14px;text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;font-size:10px">← back to portfolio</a></p>';
  throw new Error('WebGPU unavailable');
}

const params = new URLSearchParams(location.search);
const backend = params.get('backend') ?? 'webgpu';
const initialPreset = params.get('preset') ?? 'fountain';

const canvas = document.getElementById('c');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(canvas.clientWidth  * dpr);
  canvas.height = Math.floor(canvas.clientHeight * dpr);
  // postfx setSize is handled inside ps.render() on each frame.
}

// ============================================================ camera
let camAngle = 0.0, camAngleY = 0.25, camDist = 18;
let dragging = false, lastX = 0, lastY = 0, dragMoved = 0;
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; dragMoved = 0; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  dragMoved += Math.abs(e.movementX) + Math.abs(e.movementY);
  camAngle  += (e.clientX - lastX) * 0.01;
  camAngleY = Math.max(-1.5, Math.min(1.5, camAngleY + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
  camDist = Math.max(2, Math.min(80, camDist * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('click', e => {
  if (e.detail === 0) return;
  if (dragMoved > 4) return;
  // Plain click is now reserved for emitter pick (Phase D). The legacy
  // 100-particle debug burst stays available behind Alt+click so the
  // affordance isn't lost.
  if (!e.altKey) return;
  if (!ps.emitters.length) return;
  const rect = canvas.getBoundingClientRect();
  const ndcX = ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  const ndcY = -(((e.clientY - rect.top)  / rect.height) * 2 - 1);
  const e0 = pickWorldOnY(ndcX, ndcY);
  if (e0) {
    const em = ps.emitters[0];
    const oldPos = em.config.position.slice();
    em.config.position = [e0[0], e0[1], e0[2]];
    em.burst(100);
    em.config.position = oldPos;
  }
});

function pickWorldOnY(ndcX, ndcY) {
  const inv = mat4Inverse(mat4MultiplyOut(proj, view));
  const a = transformVec4(inv, [ndcX, ndcY, -1, 1]);
  const b = transformVec4(inv, [ndcX, ndcY, +1, 1]);
  for (let k = 0; k < 4; k++) { a[k] /= a[3]; b[k] /= b[3]; }
  const dy = b[1]-a[1];
  if (Math.abs(dy) < 1e-6) return null;
  const t = -a[1] / dy;
  return [a[0] + (b[0]-a[0]) * t, 0, a[2] + (b[2]-a[2]) * t];
}
function mat4MultiplyOut(p, v) {
  const r = new Float32Array(16);
  for (let i = 0; i < 4; i++) {
    const bi0 = v[i*4], bi1 = v[i*4+1], bi2 = v[i*4+2], bi3 = v[i*4+3];
    r[i*4]     = p[0]*bi0 + p[4]*bi1 + p[8] *bi2 + p[12]*bi3;
    r[i*4 + 1] = p[1]*bi0 + p[5]*bi1 + p[9] *bi2 + p[13]*bi3;
    r[i*4 + 2] = p[2]*bi0 + p[6]*bi1 + p[10]*bi2 + p[14]*bi3;
    r[i*4 + 3] = p[3]*bi0 + p[7]*bi1 + p[11]*bi2 + p[15]*bi3;
  }
  return r;
}
function transformVec4(m, v) {
  return [
    m[0]*v[0] + m[4]*v[1] + m[8] *v[2] + m[12]*v[3],
    m[1]*v[0] + m[5]*v[1] + m[9] *v[2] + m[13]*v[3],
    m[2]*v[0] + m[6]*v[1] + m[10]*v[2] + m[14]*v[3],
    m[3]*v[0] + m[7]*v[1] + m[11]*v[2] + m[15]*v[3],
  ];
}
function mat4Inverse(m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3];
  const a10=m[4],a11=m[5],a12=m[6],a13=m[7];
  const a20=m[8],a21=m[9],a22=m[10],a23=m[11];
  const a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10;
  const b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12;
  const b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30;
  const b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if (!det) return new Float32Array(16);
  det = 1/det;
  const o = new Float32Array(16);
  o[0]=( a11*b11 -a12*b10 +a13*b09)*det; o[1]=(-a01*b11 +a02*b10 -a03*b09)*det;
  o[2]=( a31*b05 -a32*b04 +a33*b03)*det; o[3]=(-a21*b05 +a22*b04 -a23*b03)*det;
  o[4]=(-a10*b11 +a12*b08 -a13*b07)*det; o[5]=( a00*b11 -a02*b08 +a03*b07)*det;
  o[6]=(-a30*b05 +a32*b02 -a33*b01)*det; o[7]=( a20*b05 -a22*b02 +a23*b01)*det;
  o[8]=( a10*b10 -a11*b08 +a13*b06)*det; o[9]=(-a00*b10 +a01*b08 -a03*b06)*det;
  o[10]=( a30*b04 -a31*b02 +a33*b00)*det; o[11]=(-a20*b04 +a21*b02 -a23*b00)*det;
  o[12]=(-a10*b09 +a11*b07 -a12*b06)*det; o[13]=( a00*b09 -a01*b07 +a02*b06)*det;
  o[14]=(-a30*b03 +a31*b01 -a32*b00)*det; o[15]=( a20*b03 -a21*b01 +a22*b00)*det;
  return o;
}

// ============================================================ system + grid + postfx
// Stage-level state (declared before `ps` so the maxParticles default is
// available for the initial createParticleSystem call below).
const stage = {
  showGrid: true,
  showStats: true,
  bgColor: [0.047, 0.039, 0.027, 1.0],   // #0c0a07 — warm dark brown
  // Authoritative particle-pool size. Preset hints are ignored — the user
  // sets this once in the General tab and every preset respects it.
  maxParticles: 1000000,
  enableBloom: true,
  bloomThreshold: 0.85,
  bloomIntensity: 0.7,
  bloomSoftKnee: 0.7,
  blurPasses: 3,
  exposure: 1.0,
  vignette: 0.30,
};

// Initial pool size comes from stage.maxParticles so the General-tab
// control reflects reality from frame 1. loadPreset() respects this too.
let ps = await createParticleSystem({ canvas, backend, maxParticles: stage.maxParticles, blend: 'additive', seed: 1 });
// WebGL2 backend was decommissioned in Phase 7. PostFX runs inside
// ps.render() on WebGPU. The reference grid was a WebGL2-only debug
// helper.
window.__pSystem = ps;

resize();
new ResizeObserver(resize).observe(canvas);

// State for the persistent audio dock — declared up here (before the init
// call below) so buildAudioDock's `_audioEl =` assignment doesn't hit a TDZ.
let _audioEl = null;
let _audioStatus = null;
// Refs into the audio dock UI, populated by buildAudioDock(). Read every
// frame by updateAudioDockLive() to drive playhead / EQ / drum lights.
let _audioDock = null;

// Build the persistent audio dock once. It lives above the tab content
// so playback continues regardless of which tab is active.
buildAudioDock();

let activePresetName = 'fountain';
async function loadPreset(name) {
  const cfg = buildPreset(name);
  // Preset's `maxParticles` field is IGNORED — stage.maxParticles (set in
  // the General tab) is the only authority on pool size. The user said so.
  if (stage.maxParticles !== ps.maxParticles) {
    ps = await createParticleSystem({
      canvas, backend, maxParticles: stage.maxParticles, blend: cfg.blend || 'additive', seed: 1,
    });
    window.__pSystem = ps;
  }
  ps.reset();
  ps.emitters.length = 0;
  ps.blend = cfg.blend || 'additive';
  if (cfg.interaction) {
    // Deep-merge user-supplied fields onto defaults so presets can omit
    // any sub-object and inherit the spec's defaults.
    const def = ps.interaction;
    ps.interaction = {
      mode:            cfg.interaction.mode            ?? def.mode,
      cellSize:        cfg.interaction.cellSize        ?? def.cellSize,
      worldHalfExtent: cfg.interaction.worldHalfExtent ?? def.worldHalfExtent,
      boids: { ...def.boids, ...(cfg.interaction.boids || {}) },
      sph:   { ...def.sph,   ...(cfg.interaction.sph   || {}) },
    };
  } else {
    // Preset omits interaction → reset to defaults so a previous preset's
    // mode='boids' doesn't leak into a vanilla preset.
    ps.interaction = {
      mode: 'none',
      cellSize: 1.0, worldHalfExtent: 25.0,
      boids: { sepRadius: 0.5, sepWeight: 1.5, alignWeight: 1.0, cohWeight: 0.8, maxAccel: 20, maxSpeed: 8 },
      sph:   { smoothingRadius: 1.0, restDensity: 1000, stiffness: 400, viscosity: 50, mass: 1.0 },
    };
  }
  for (const eCfg of cfg.emitters) await ps.addEmitter(new Emitter(eCfg));
  camDist = cfg.cameraDist || 18;
  // Optional initial camera angles per preset — the beats debug preset
  // wants a 3/4 top-down view to make all four rows readable at once.
  // User can still drag to override after the preset loads.
  if (cfg.cameraAngle  != null) camAngle  = cfg.cameraAngle;
  if (cfg.cameraAngleY != null) camAngleY = cfg.cameraAngleY;
  activePresetName = cfg.name || name;
  document.querySelectorAll('.topbar button[data-preset]').forEach(b =>
    b.classList.toggle('on', b.dataset.preset === activePresetName));
  buildPanel();
}

document.querySelectorAll('.topbar button[data-preset]').forEach(b => {
  b.addEventListener('click', () => loadPreset(b.dataset.preset));
});
document.getElementById('reset').addEventListener('click', () => {
  // Clear alive particles + reset emitter timers, but PRESERVE the current
  // emitter configs (including any param edits made through the inspector).
  ps.reset();
});
document.getElementById('reload').addEventListener('click', () => loadPreset(activePresetName));

// Backend toggle was removed in Phase 7 — WebGPU is the only backend.
let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Play' : 'Pause';
  pauseBtn.classList.toggle('on', paused);
});
document.getElementById('dumpJson').addEventListener('click', async () => {
  const out = { preset: activePresetName, blend: ps.blend, stage, interaction: JSON.parse(JSON.stringify(ps.interaction)), emitters: ps.emitters.map(serialiseEmitter) };
  const txt = JSON.stringify(out, null, 2);
  try { await navigator.clipboard.writeText(txt); } catch (_) {}
  console.log(txt);
});

function serialiseEmitter(e) {
  return {
    position: e.config.position,
    rate: e.config.rate,
    bursts: e.config.bursts,
    shape: e.config.shape.type || '?',
    initial: e.config.initial,
    modules: (e.config.modules || []).map(serialiseModule),
  };
}
function serialiseModule(m) {
  if (!m.moduleName) return { kind: 'fn' };
  const out = { name: m.moduleName, params: {} };
  for (const k of Object.keys(m.params)) {
    const v = m.params[k];
    if (v && typeof v === 'object' && v.keys) out.params[k] = { keys: v.keys };  // Curve/Gradient
    else out.params[k] = v;
  }
  return out;
}

// ============================================================ inspector / module editor
const panel = document.getElementById('panel');
const picker = document.getElementById('picker');
const pickerSearch = document.getElementById('pickerSearch');
const pickerList = document.getElementById('pickerList');

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') {
      for (const sk of Object.keys(v)) e.style.setProperty(sk, v[sk]);
    }
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

// Panel state — which tab is active, expand state for module cards.
// `active` is the single anchor used for module-card keys / rename / scroll.
// `selectedIdx` is the multi-selection set, holding *Emitter object refs* so
// it survives array reorders/splices (object identity, not array index).
const panelState = {
  active: { type: 'em', idx: 0 },     // 'general' | 'fx' | 'em'
  selectedIdx: new Set(),             // Set<Emitter>
  modOpen: {},                        // emitterIdx + '/' + moduleIdx -> bool
};

function getSelectedEmitters() {
  return ps.emitters.filter(em => panelState.selectedIdx.has(em));
}

// Drop refs to deleted emitters; if active is em and selection is empty,
// seed selection with the active emitter so single-click flow works.
function syncSelectionToActive() {
  if (panelState.active.type !== 'em') {
    panelState.selectedIdx.clear();
    return;
  }
  for (const em of [...panelState.selectedIdx]) {
    if (!ps.emitters.includes(em)) panelState.selectedIdx.delete(em);
  }
  const anchor = ps.emitters[panelState.active.idx];
  if (panelState.selectedIdx.size === 0 && anchor) panelState.selectedIdx.add(anchor);
}

function buildPanel() {
  // Defensive: clamp emitter index if emitters changed
  if (panelState.active.type === 'em') {
    if (ps.emitters.length === 0) panelState.active = { type: 'general' };
    else if (panelState.active.idx >= ps.emitters.length) panelState.active.idx = ps.emitters.length - 1;
  }
  syncSelectionToActive();
  renderTabs();
  renderEditor();
  renderStatusBar();
}

function renderTabs() {
  const nav = document.getElementById('tab-nav');
  nav.innerHTML = '';

  // Scene group (general + post-fx — these aren't part of any emitter).
  // The audio tab was removed: it only displayed live source readouts and
  // wasn't used in practice; the audio dock above the panel provides what
  // we still need.
  const sceneRow = el('div', { class: 'tab-group-row' });
  sceneRow.appendChild(el('div', { class: 'tab-group-label' }, ['scene']));
  const sceneStrip = el('div', { class: 'tab-strip' });
  sceneStrip.appendChild(makeTab('general', { type: 'general' }));
  sceneStrip.appendChild(makeTab('post-fx', { type: 'fx' }));
  sceneRow.appendChild(sceneStrip);
  nav.appendChild(sceneRow);

  // Emitter group
  const emRow = el('div', { class: 'tab-group-row last' });
  emRow.appendChild(el('div', { class: 'tab-group-label' }, ['emitters']));
  const emStrip = el('div', { class: 'tab-strip wrap' });
  ps.emitters.forEach((em, i) => {
    const c = em.config.initial?.color || [1, 0.5, 0.1, 1];
    emStrip.appendChild(makeTab(em.config.name || ('em_' + i), { type: 'em', idx: i }, {
      em: true, color: rgbCss(c), badge: countAlive(i),
      disabled: !!em.config.disabled,
    }));
  });
  emStrip.appendChild(el('button', { class: 'tab tab-add', onclick: addNewEmitter }, ['+ NEW']));
  emRow.appendChild(emStrip);
  nav.appendChild(emRow);
}
function makeTab(label, target, opts = {}) {
  const isActive = sameTab(target, panelState.active);
  let isSelected = isActive;
  if (target.type === 'em') {
    const em = ps.emitters[target.idx];
    isSelected = !!(em && panelState.selectedIdx.has(em));
  }
  const cls = ['tab'];
  if (opts.em) cls.push('tab-em');
  if (isSelected) cls.push('selected');
  if (isActive && target.type === 'em' && panelState.selectedIdx.size > 1) cls.push('anchor');
  if (opts.disabled) cls.push('disabled');
  const props = { class: cls.join(' '), onclick: (ev) => {
    if (target.type === 'em') {
      const em = ps.emitters[target.idx];
      if (!em) return;
      if (ev.shiftKey && panelState.active.type === 'em') {
        const lo = Math.min(panelState.active.idx, target.idx);
        const hi = Math.max(panelState.active.idx, target.idx);
        panelState.selectedIdx.clear();
        for (let i = lo; i <= hi; i++) panelState.selectedIdx.add(ps.emitters[i]);
        panelState.active = target;
      } else if (ev.ctrlKey || ev.metaKey) {
        if (panelState.selectedIdx.has(em)) {
          panelState.selectedIdx.delete(em);
          if (panelState.active.type === 'em' && panelState.active.idx === target.idx) {
            const nextIdx = ps.emitters.findIndex(x => panelState.selectedIdx.has(x));
            if (nextIdx >= 0) panelState.active = { type: 'em', idx: nextIdx };
          }
        } else {
          panelState.selectedIdx.add(em);
          panelState.active = target;
        }
      } else {
        panelState.selectedIdx.clear();
        panelState.selectedIdx.add(em);
        panelState.active = target;
      }
    } else {
      panelState.selectedIdx.clear();
      panelState.active = target;
    }
    buildPanel();
  } };
  if (opts.color) props.style = { '--c': opts.color };
  if (target.type === 'em') props['data-em-idx'] = String(target.idx);
  const kids = [label];
  if (opts.badge != null) kids.push(el('span', { class: 'tab-badge' }, [String(opts.badge)]));
  return el('button', props, kids);
}

// Periodic live-count refresh — updates emitter tab badges, the active
// emitter header's "X ALIVE" line, and the status bar in place. Runs every
// 200 ms so counts stay current without needing UI interaction.
function refreshLiveCounts() {
  if (!ps || !ps.emitterId) return;
  // tab badges (cheap: just text content)
  const tabs = document.querySelectorAll('.tab.tab-em[data-em-idx]');
  for (const t of tabs) {
    const idx = parseInt(t.getAttribute('data-em-idx'), 10);
    const badge = t.querySelector('.tab-badge');
    if (badge && Number.isFinite(idx)) badge.textContent = String(countAlive(idx));
  }
  // emitter header alive count (if an emitter tab is currently active)
  if (panelState.active && panelState.active.type === 'em') {
    const stats = document.querySelector('#editor .em-stats');
    if (stats) stats.innerHTML = `<b>${countAlive(panelState.active.idx)}</b> ALIVE`;
  }
  // status bar global alive
  renderStatusBar();
}
setInterval(refreshLiveCounts, 200);
function sameTab(a, b) {
  if (a.type !== b.type) return false;
  if (a.type === 'em') return a.idx === b.idx;
  return true;
}
function rgbCss(c) {
  return `rgb(${(Math.min(1,c[0])*255)|0},${(Math.min(1,c[1])*255)|0},${(Math.min(1,c[2])*255)|0})`;
}
function countAlive(emitterIdx) {
  if (!ps) return 0;
  // WebGPU: O(1) lookup into the GPU-synced CPU mirror (compaction Pass C
  // atomicAdds per-emitter; readback every 60 frames). Up to 1s stale,
  // accurate across all emitters.
  if (ps.backend === 'webgpu') {
    return ps.aliveByEmitter ? ps.aliveByEmitter(emitterIdx) : 0;
  }
  // WebGL2: walk the SoA arrays directly.
  if (!ps.emitterId) return 0;
  let n = 0;
  for (let i = 0; i < ps.alive; i++) if (ps.emitterId[i] === emitterIdx) n++;
  return n;
}

function renderEditor() {
  const editor = document.getElementById('editor');
  editor.innerHTML = '';
  if (panelState.active.type === 'general') return renderGeneralTab(editor);
  if (panelState.active.type === 'fx')      return renderFXTab(editor);
  if (panelState.active.type === 'em') {
    const sel = getSelectedEmitters();
    if (sel.length > 1) return renderEmittersTab(editor, sel);
    return renderEmitterTab(editor, ps.emitters[panelState.active.idx]);
  }
}

function renderStatusBar() {
  const bar = document.getElementById('status-bar');
  if (!bar) return;
  // Same fps source as the stats overlay: prefer realFps (actual GPU-
  // presented rate) when the backend reports it; fall back to rAF rate.
  // Without this, the panel and the overlay disagree under GPU saturation
  // (rAF=70+ but realFps=6).
  const realFps = ps.getStats?.()?.realFps;
  const fps = (typeof realFps === 'number' && realFps > 0) ? realFps : currentFps();
  bar.innerHTML =
    `<span><b>${fps.toFixed(0)}</b> FPS · <b>${ps.alive}</b> ALIVE</span>` +
    `<span>${ps.audioFeed ? '<b>♪ '+ps.audioFeed.bpm.toFixed(0)+' BPM</b>' : 'no audio'}</span>`;
}

async function addNewEmitter() {
  const palette = [[1,0.55,0.1,1],[1,0.85,0.4,1],[0.4,0.78,1,1],[0.65,0.4,1,1],[0.4,1,0.6,1]];
  const i = ps.emitters.length;
  const em = new Emitter({
    name: 'em_' + (i + 1),
    shape: shapes.point(),
    rate: 100,
    initial: {
      lifetime: 1.0, speed: 0, size: 0.3,
      color: palette[i % palette.length].slice(),
    },
    modules: [],
  });
  await ps.addEmitter(em);
  panelState.active = { type: 'em', idx: i };
  buildPanel();
}

// Collapsible section. State persists per title in localStorage so navigation
// or panel rebuilds (e.g. after preset switch) preserve open/closed state.
function getCollapsed(id) { return localStorage.getItem('particles.collapse.' + id) === '1'; }
function setCollapsedSt(id, v) {
  if (v) localStorage.setItem('particles.collapse.' + id, '1');
  else localStorage.removeItem('particles.collapse.' + id);
}
function section(title, contents) {
  const id = title.replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  const collapsed = getCollapsed(id);
  const head = el('h3', {
    class: 'collapsible' + (collapsed ? ' collapsed' : ''),
    html: '<span class="caret">▾</span> ' + title,
  });
  const body = el('div', { class: 'section-body' });
  if (collapsed) body.style.display = 'none';
  for (const c of contents) if (c) body.appendChild(c);
  head.addEventListener('click', () => {
    const willCollapse = !head.classList.contains('collapsed');
    head.classList.toggle('collapsed', willCollapse);
    body.style.display = willCollapse ? 'none' : '';
    setCollapsedSt(id, willCollapse);
  });
  const wrap = el('div', { class: 'section' });
  wrap.appendChild(head);
  wrap.appendChild(body);
  return wrap;
}

// Custom row for stage.maxParticles: number input that calls
// ps.setMaxParticles(n) on change. setMaxParticles is destructive (clears
// alive particles + reallocates GPU buffers) so we don't fire it for every
// keystroke — only on `change` (blur or Enter) and we guard against
// re-entry while a previous resize is still in flight.
function rowMaxParticles() {
  const inp = el('input', {
    type: 'number', step: 1000, min: 1000,
    value: stage.maxParticles, class: 'v v-input',
  });
  let pending = false;
  inp.addEventListener('change', async () => {
    let v = parseInt(inp.value, 10);
    if (!isFinite(v) || v < 1000) v = 1000;
    inp.value = v;
    if (v === ps.maxParticles || pending) return;
    pending = true;
    stage.maxParticles = v;
    try {
      await ps.setMaxParticles(v);
      ps.reset();
    } catch (e) {
      console.error('setMaxParticles:', e);
    } finally {
      pending = false;
    }
  });
  return el('div', { class: 'row' }, [
    el('label', { html: 'max particles', title: 'pool size — destructive on change' }),
    inp,
    el('span', { class: 'v', html: 'destr.', title: 'changing this clears alive particles' }),
  ]);
}
