<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" role="img"
     aria-label="De-identified type specimen of the design system: a placeholder legal-guide article layout with a clamp() type scale, a two-column desktop grid and an FAQ block. Not the live client site.">
  <defs>
    <style>
      text { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .h-eyebrow { font-size: 13px; letter-spacing: 0.18em; fill: #ff4b1f; }
      .h-title   { font-size: 46px; font-weight: 700; fill: #f7f3ea; }
      .h-sub     { font-size: 15px; fill: rgba(240,235,224,0.6); letter-spacing: 0.02em; }
      .h-tag     { font-size: 10px; letter-spacing: 0.1em; fill: rgba(240,235,224,0.45); }
      .card      { fill: #141009; stroke: rgba(240,235,224,0.14); stroke-width: 1; }
      .crumb     { font-size: 12px; fill: rgba(240,235,224,0.5); }
      .doc-h1    { font-size: 30px; font-weight: 600; fill: #f7f3ea; }
      .doc-h2    { font-size: 17px; font-weight: 600; fill: #f2a51f; }
      .scale-n   { font-size: 10px; letter-spacing: 0.08em; fill: #ff4b1f; }
      .side-h    { font-size: 10px; letter-spacing: 0.1em; fill: rgba(240,235,224,0.46); }
      .side-li   { font-size: 12px; fill: rgba(240,235,224,0.66); }
      .faq-q     { font-size: 13px; font-weight: 600; fill: #f0ebe0; }
    </style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ff4b1f"/>
      <stop offset="38%" stop-color="#ff4b1f"/>
      <stop offset="38%" stop-color="#f2a51f"/>
      <stop offset="62%" stop-color="#f2a51f"/>
      <stop offset="62%" stop-color="rgba(240,235,224,0.25)"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="600" fill="#0c0a07"/>

  <!-- left masthead column -->
  <g>
    <text x="64" y="158" class="h-eyebrow">DESIGN-SYSTEM SPECIMEN</text>
    <text x="64" y="214" class="h-title">Type, structure,</text>
    <text x="64" y="262" class="h-title">reflow.</text>
    <text x="64" y="304" class="h-sub">A de-identified specimen of the firm's kind of page.</text>
    <text x="64" y="326" class="h-sub">Placeholder copy · representative palette · not the live site.</text>

    <!-- mini clamp() scale rail -->
    <g transform="translate(64,372)">
      <rect class="card" x="0" y="0" width="430" height="150" rx="4" stroke-dasharray="4 4"/>
      <text x="16" y="24" class="h-tag">CLAMP() FLUID TYPE SCALE</text>
      <text x="16" y="52" class="scale-n">H1</text><text x="64" y="54" font-size="20" font-weight="600" fill="#f0ebe0">Aa Titre</text><text x="414" y="52" text-anchor="end" font-size="10" fill="rgba(240,235,224,0.42)">clamp(26,5.4cqi,46)</text>
      <text x="16" y="82" class="scale-n">H2</text><text x="64" y="84" font-size="16" font-weight="600" fill="#f2a51f">Aa Section</text><text x="414" y="82" text-anchor="end" font-size="10" fill="rgba(240,235,224,0.42)">clamp(17,2.8cqi,24)</text>
      <text x="16" y="110" class="scale-n">BODY</text><text x="64" y="112" font-size="13" fill="#f0ebe0">Aa corps de texte</text><text x="414" y="110" text-anchor="end" font-size="10" fill="rgba(240,235,224,0.42)">clamp(13,1.55cqi,16)</text>
      <text x="16" y="136" class="scale-n">SMALL</text><text x="64" y="138" font-size="11" fill="rgba(240,235,224,0.6)">Aa note</text><text x="414" y="136" text-anchor="end" font-size="10" fill="rgba(240,235,224,0.42)">clamp(10,1.1cqi,12)</text>
    </g>
  </g>

  <!-- right: the rendered specimen "browser" -->
  <g transform="translate(636,52)">
    <rect class="card" x="0" y="0" width="900" height="496" rx="6"/>
    <!-- chrome bar -->
    <rect x="0" y="0" width="900" height="34" rx="6" fill="rgba(12,10,7,0.6)"/>
    <rect x="0" y="20" width="900" height="14" fill="rgba(12,10,7,0.6)"/>
    <circle cx="22" cy="17" r="4" fill="rgba(240,235,224,0.22)"/>
    <circle cx="38" cy="17" r="4" fill="rgba(240,235,224,0.22)"/>
    <circle cx="54" cy="17" r="4" fill="rgba(240,235,224,0.22)"/>
    <text x="80" y="21" font-size="10" fill="rgba(240,235,224,0.4)">cabinet-placeholder.example / guides / depot-de-garantie</text>
    <text x="884" y="21" text-anchor="end" class="h-tag">CABINET &#9634; · SPECIMEN</text>
    <!-- neutral accent strip -->
    <rect x="0" y="34" width="900" height="4" fill="url(#accent)"/>

    <!-- two-column page -->
    <!-- main doc -->
    <g transform="translate(32,62)">
      <text x="0" y="14" class="crumb">Accueil / Guides / Dépôt de garantie</text>
      <text x="0" y="56" class="doc-h1">Récupérer un dépôt de garantie</text>
      <!-- body lines -->
      <rect x="0" y="74" width="540" height="9" rx="2" fill="rgba(240,235,224,0.5)"/>
      <rect x="0" y="92" width="540" height="9" rx="2" fill="rgba(240,235,224,0.34)"/>
      <rect x="0" y="110" width="420" height="9" rx="2" fill="rgba(240,235,224,0.34)"/>

      <text x="0" y="158" class="doc-h2">Le délai légal de restitution</text>
      <rect x="0" y="172" width="540" height="9" rx="2" fill="rgba(240,235,224,0.5)"/>
      <rect x="0" y="190" width="540" height="9" rx="2" fill="rgba(240,235,224,0.34)"/>
      <rect x="0" y="208" width="470" height="9" rx="2" fill="rgba(240,235,224,0.34)"/>

      <!-- FAQ accordion -->
      <text x="0" y="252" class="doc-h2">Questions fréquentes</text>
      <line x1="0" y1="266" x2="540" y2="266" stroke="rgba(240,235,224,0.12)"/>
      <text x="0" y="290" class="faq-q">Sous quel délai le dépôt doit-il être restitué ?</text>
      <text x="528" y="291" text-anchor="end" font-size="18" fill="#ff4b1f">&#8722;</text>
      <rect x="0" y="302" width="500" height="8" rx="2" fill="rgba(240,235,224,0.28)"/>
      <rect x="0" y="318" width="430" height="8" rx="2" fill="rgba(240,235,224,0.28)"/>
      <line x1="0" y1="340" x2="540" y2="340" stroke="rgba(240,235,224,0.12)"/>
      <text x="0" y="364" class="faq-q">Que faire en cas de retenue abusive ?</text>
      <text x="528" y="365" text-anchor="end" font-size="18" fill="#ff4b1f">+</text>
      <line x1="0" y1="382" x2="540" y2="382" stroke="rgba(240,235,224,0.12)"/>
      <text x="0" y="406" class="faq-q">Le bailleur peut-il déduire l'usure normale ?</text>
      <text x="528" y="407" text-anchor="end" font-size="18" fill="#ff4b1f">+</text>
    </g>

    <!-- sidebar -->
    <line x1="616" y1="50" x2="616" y2="476" stroke="rgba(240,235,224,0.1)"/>
    <g transform="translate(648,76)">
      <text x="0" y="12" class="side-h">SUR CETTE PAGE</text>
      <rect x="-12" y="26" width="2" height="14" fill="#ff4b1f"/>
      <text x="0" y="38" class="side-li" fill="#ff4b1f">Délai légal de restitution</text>
      <text x="0" y="60" class="side-li">Ce qu'il faut réunir</text>
      <text x="0" y="82" class="side-li">Questions fréquentes</text>

      <rect class="card" x="0" y="106" width="200" height="120" rx="3"/>
      <text x="14" y="130" font-size="11" fill="#f0ebe0">Prise de contact</text>
      <text x="14" y="150" font-size="9.5" fill="rgba(240,235,224,0.5)">mailto: — aucune donnée</text>
      <text x="14" y="164" font-size="9.5" fill="rgba(240,235,224,0.5)">ne quitte l'appareil.</text>
      <rect x="14" y="176" width="120" height="24" rx="2" fill="none" stroke="#ff4b1f"/>
      <text x="74" y="192" text-anchor="middle" font-size="10" fill="#ff4b1f">ÉCRIRE</text>
      <text x="14" y="218" font-size="8.5" fill="rgba(240,235,224,0.4)">Article · FAQPage · BreadcrumbList</text>
    </g>
  </g>

  <!-- bottom provenance -->
  <text x="64" y="566" class="h-tag">DE-IDENTIFIED CONCEPT VISUAL · PLACEHOLDER COPY · THE CLIENT SITE IS PRIVATE — NOT A SCREENSHOT</text>
</svg>
