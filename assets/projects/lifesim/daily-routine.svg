<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect x="0" y="0" width="1200" height="750" fill="#0c0a07"/>

  <!-- Title -->
  <text x="48" y="56" fill="#f0ebe0" font-size="26" letter-spacing="1">Daily routine</text>
  <text x="48" y="82" fill="rgba(240,235,224,0.6)" font-size="13" letter-spacing="0.5">Authored schedule templates — the elder's round and the herd's day</text>

  <!-- ===== Time axis ===== -->
  <!-- map 04:00 .. 24:00 across x = 90 .. 1140  (20 h over 1050 px) -->
  <g stroke="rgba(240,235,224,0.16)" stroke-width="1">
    <line x1="90" y1="160" x2="1140" y2="160"/>
  </g>
  <!-- hour ticks every 2h -->
  <g fill="rgba(240,235,224,0.55)" font-size="11" text-anchor="middle">
    <!-- x for hour h = 90 + (h-4)/20*1050 -->
    <line x1="90"   y1="155" x2="90"   y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="90" y="148">04:00</text>
    <line x1="195"  y1="155" x2="195"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="195" y="148">06:00</text>
    <line x1="300"  y1="155" x2="300"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="300" y="148">08:00</text>
    <line x1="405"  y1="155" x2="405"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="405" y="148">10:00</text>
    <line x1="510"  y1="155" x2="510"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="510" y="148">12:00</text>
    <line x1="615"  y1="155" x2="615"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="615" y="148">14:00</text>
    <line x1="720"  y1="155" x2="720"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="720" y="148">16:00</text>
    <line x1="825"  y1="155" x2="825"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="825" y="148">18:00</text>
    <line x1="930"  y1="155" x2="930"  y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="930" y="148">20:00</text>
    <line x1="1035" y1="155" x2="1035" y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="1035" y="148">22:00</text>
    <line x1="1140" y1="155" x2="1140" y2="600" stroke="rgba(240,235,224,0.08)" stroke-width="1"/>
    <text x="1140" y="148">24:00</text>
  </g>

  <!-- phase-of-day band labels -->
  <g fill="rgba(240,235,224,0.4)" font-size="11" text-anchor="middle" letter-spacing="1">
    <text x="142" y="128">DAWN</text>
    <text x="352" y="128">MORNING</text>
    <text x="562" y="128">MIDDAY</text>
    <text x="877" y="128">EVENING</text>
    <text x="1090" y="128">NIGHT</text>
  </g>

  <!-- ===== Lane 1 : Elder's morning round ===== -->
  <text x="48" y="232" fill="#ff4b1f" font-size="14" letter-spacing="0.5">ELDER</text>
  <text x="48" y="250" fill="rgba(240,235,224,0.55)" font-size="11">role · morning round</text>
  <line x="90" y1="215" x2="1140" y2="215" stroke="rgba(240,235,224,0.06)" stroke-width="1"/>

  <!-- blocks: x = 90 + (h-4)/20*1050 ; key civic duties in accent -->
  <g font-size="11.5">
    <!-- wake 05:00-05:30 -->
    <rect x="142" y="222" width="26" height="40" rx="5" fill="#141009" stroke="rgba(240,235,224,0.3)"/>
    <text x="155" y="282" fill="rgba(240,235,224,0.7)" text-anchor="middle">wake</text>

    <!-- temple / custodian 06:00-08:00 (accent — civic stake) -->
    <rect x="195" y="222" width="105" height="40" rx="5" fill="#2a160b" stroke="#ff4b1f" stroke-width="1.6"/>
    <text x="247" y="246" fill="#ff4b1f" text-anchor="middle">temple — custodian</text>

    <!-- council 09:00-11:00 (accent — tie-breaker stake) -->
    <rect x="352" y="222" width="105" height="40" rx="5" fill="#2a160b" stroke="#ff4b1f" stroke-width="1.6"/>
    <text x="404" y="246" fill="#ff4b1f" text-anchor="middle">council — tie-breaker</text>

    <!-- market 12:00-14:00 -->
    <rect x="510" y="222" width="105" height="40" rx="5" fill="#141009" stroke="rgb(255,158,51)"/>
    <text x="562" y="246" fill="rgb(255,158,51)" text-anchor="middle">market</text>

    <!-- rest/evening home 18:00-21:00 -->
    <rect x="825" y="222" width="105" height="40" rx="5" fill="#141009" stroke="rgba(240,235,224,0.3)"/>
    <text x="877" y="246" fill="rgba(240,235,224,0.7)" text-anchor="middle">home</text>

    <!-- sleep 22:00- -->
    <rect x="1035" y="222" width="105" height="40" rx="5" fill="#0f0b07" stroke="rgba(240,235,224,0.16)"/>
    <text x="1087" y="246" fill="rgba(240,235,224,0.45)" text-anchor="middle">sleep</text>
  </g>
  <text x="247" y="296" fill="rgba(240,235,224,0.4)" font-size="10" text-anchor="middle">lose her → temple loses its custodian, council loses a tie-breaker</text>

  <!-- ===== Lane 2 : Herd / patrol on boids ===== -->
  <text x="48" y="392" fill="rgb(230,209,158)" font-size="14" letter-spacing="0.5">HERD</text>
  <text x="48" y="410" fill="rgba(240,235,224,0.55)" font-size="11">Reynolds' boids</text>
  <line x="90" y1="375" x2="1140" y2="375" stroke="rgba(240,235,224,0.06)" stroke-width="1"/>

  <g font-size="11.5">
    <!-- graze near pen 05:00-07:00 -->
    <rect x="142" y="382" width="105" height="40" rx="5" fill="#141009" stroke="rgb(230,209,158)"/>
    <text x="194" y="406" fill="rgb(230,209,158)" text-anchor="middle">graze · pen</text>

    <!-- move to pasture 07:00-09:00 (flock) -->
    <rect x="247" y="382" width="105" height="40" rx="5" fill="#141009" stroke="rgb(255,158,51)"/>
    <text x="300" y="406" fill="rgb(255,158,51)" text-anchor="middle">flock → pasture</text>

    <!-- pasture grazing 09:00-16:00 -->
    <rect x="352" y="382" width="368" height="40" rx="5" fill="#141009" stroke="rgba(240,235,224,0.3)"/>
    <text x="536" y="406" fill="rgba(240,235,224,0.7)" text-anchor="middle">pasture — open grazing</text>

    <!-- return 17:00-19:00 -->
    <rect x="772" y="382" width="105" height="40" rx="5" fill="#141009" stroke="rgb(255,158,51)"/>
    <text x="824" y="406" fill="rgb(255,158,51)" text-anchor="middle">flock → return</text>

    <!-- bed down 20:00- -->
    <rect x="930" y="382" width="210" height="40" rx="5" fill="#0f0b07" stroke="rgba(240,235,224,0.16)"/>
    <text x="1035" y="406" fill="rgba(240,235,224,0.5)" text-anchor="middle">bed down</text>
  </g>
  <text x="536" y="440" fill="rgba(240,235,224,0.4)" font-size="10" text-anchor="middle">cohesion · alignment · separation — the same substrate as patrol formations</text>

  <!-- ===== legend ===== -->
  <g font-size="11" transform="translate(90,520)">
    <rect x="0" y="0" width="22" height="14" rx="3" fill="#2a160b" stroke="#ff4b1f" stroke-width="1.4"/>
    <text x="30" y="11" fill="rgba(240,235,224,0.72)">civic duty (permadeath stake)</text>
    <rect x="300" y="0" width="22" height="14" rx="3" fill="#141009" stroke="rgb(255,158,51)"/>
    <text x="330" y="11" fill="rgba(240,235,224,0.72)">boids movement</text>
    <rect x="510" y="0" width="22" height="14" rx="3" fill="#0f0b07" stroke="rgba(240,235,224,0.16)"/>
    <text x="540" y="11" fill="rgba(240,235,224,0.72)">rest / idle</text>
  </g>

  <!-- footer honesty note -->
  <rect x="90" y="630" width="1050" height="62" rx="8" fill="#100c08" stroke="rgba(240,235,224,0.14)"/>
  <text x="110" y="658" fill="rgba(240,235,224,0.72)" font-size="12.5">Illustrative routine design — emergent timings arise at runtime;</text>
  <text x="110" y="678" fill="rgba(240,235,224,0.72)" font-size="12.5">this is the authored schedule template, not a recording.</text>
  <text x="1152" y="724" fill="rgba(240,235,224,0.4)" font-size="10.5" text-anchor="end">Conceptual design · LifeSim · not gameplay</text>
</svg>
