<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBR studio · Raphael Giulieri</title>
<style>
    html, body { margin: 0; height: 100%; background: #0c0a07; color: #f0ebe0; font-family: "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .label { position: absolute; bottom: 12px; left: 12px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.78); pointer-events: none; line-height: 1.5; max-width: calc(100% - 24px); text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .label b { color: #ff4b1f; font-weight: 500; }
    .controls { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-direction: column; align-items: stretch; }
    .row { display: flex; gap: 8px; align-items: center; padding: 4px 8px; background: rgba(12,10,7,0.55); border: 1px solid rgba(240,235,224,0.18); backdrop-filter: blur(6px); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.78); }
    .row label { width: 80px; color: rgba(240,235,224,0.55); }
    .row input[type=range] { -webkit-appearance: none; appearance: none; width: 140px; height: 2px; background: rgba(240,235,224,0.25); outline: none; }
    .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 14px; background: #ff4b1f; cursor: pointer; }
    .row input[type=range]::-moz-range-thumb { width: 10px; height: 14px; background: #ff4b1f; cursor: pointer; border: none; }
    .row .v { color: #ff4b1f; min-width: 38px; text-align: right; font-weight: 500; }
    .err { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 13px; line-height: 1.6; color: #ff4b1f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls">
    <div class="row"><label>Metallic</label><input id="metallic" type="range" min="0" max="1" step="0.01" value="0.85"><span class="v" id="vMet">0.85</span></div>
    <div class="row"><label>Roughness</label><input id="roughness" type="range" min="0.05" max="1" step="0.01" value="0.22"><span class="v" id="vRgh">0.22</span></div>
    <div class="row"><label>Hue</label><input id="hue" type="range" min="0" max="360" step="1" value="18"><span class="v" id="vHue">18</span></div>
    <div class="row"><label>Env</label><input id="env" type="range" min="0" max="1" step="0.01" value="1.0"><span class="v" id="vEnv">1.00</span></div>
</div>
<p class="label"><b>PBR studio · drag to orbit</b><br>Single-pass fragment shader · GGX specular · Schlick Fresnel · Smith geometric term · procedural cubemap environment · 5-light direct illumination · live material parameters</p>
<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
    document.body.innerHTML = '<p class="err">Needs WebGL2. Try a recent Chrome / Firefox / Safari.</p>';
    return;
}

const VERT = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() {
    v_uv = a_pos;
    gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform vec2  u_resolution;
uniform float u_time;
uniform float u_yaw;
uniform float u_pitch;
uniform float u_metallic;
uniform float u_roughness;
uniform vec3  u_baseColor;
uniform float u_envStrength;

const float PI = 3.14159265359;

// --- Procedural cubemap environment ----------------------------------------
// A warm-paper sky at the top, vermilion horizon, deep below. Plus a key sun
// blob and three bounce highlights so the sphere catches multiple reflections.
vec3 sampleEnv(vec3 dir, float roughness) {
    // Mip-bias the env by roughness: blur as roughness goes up.
    float horizon = 1.0 - abs(dir.y);

    vec3 zenith  = vec3(0.05, 0.04, 0.04);
    vec3 horizonCol = vec3(0.95, 0.36, 0.14);
    vec3 below   = vec3(0.10, 0.06, 0.04);
    vec3 col = mix(zenith, horizonCol, pow(horizon, 4.0));
    col = mix(col, below, smoothstep(0.0, -0.4, dir.y));

    // Sun blob: warm, bright, sharp at low roughness
    vec3 sun = normalize(vec3(0.5, 0.7, -0.4));
    float ct = max(dot(dir, sun), 0.0);
    float blur = mix(48.0, 4.0, roughness);
    col += vec3(1.0, 0.85, 0.55) * pow(ct, blur) * (3.0 - 2.5 * roughness);

    // Cool fill from opposite hemisphere
    vec3 fill = normalize(vec3(-0.6, 0.4, 0.7));
    float ctf = max(dot(dir, fill), 0.0);
    col += vec3(0.30, 0.55, 0.70) * pow(ctf, mix(28.0, 3.0, roughness)) * (0.8 - 0.5 * roughness);

    // Two minor accent highlights
    vec3 acc1 = normalize(vec3(0.9, 0.0, 0.4));
    col += vec3(0.95, 0.5, 0.2) * pow(max(dot(dir, acc1), 0.0), mix(40.0, 6.0, roughness)) * 0.4;
    vec3 acc2 = normalize(vec3(-0.3, -0.3, -0.9));
    col += vec3(0.2, 0.3, 0.45) * pow(max(dot(dir, acc2), 0.0), mix(40.0, 6.0, roughness)) * 0.3;

    return col;
}

// --- GGX BRDF --------------------------------------------------------------
float D_GGX(float NoH, float a) {
    float a2 = a*a;
    float d = (NoH*NoH) * (a2 - 1.0) + 1.0;
    return a2 / max(PI * d * d, 1e-7);
}
float V_SmithGGX(float NoV, float NoL, float a) {
    float a2 = a*a;
    float gv = NoL * sqrt(NoV*NoV * (1.0 - a2) + a2);
    float gl = NoV * sqrt(NoL*NoL * (1.0 - a2) + a2);
    return 0.5 / max(gv + gl, 1e-7);
}
vec3 F_Schlick(float u, vec3 f0) {
    return f0 + (vec3(1.0) - f0) * pow(1.0 - u, 5.0);
}

// Sphere ray-cast (centred at origin, radius 1).
bool raySphere(vec3 ro, vec3 rd, out float t) {
    float b = dot(ro, rd);
    float c = dot(ro, ro) - 1.0;
    float h = b*b - c;
    if (h < 0.0) return false;
    t = -b - sqrt(h);
    return t > 0.0;
}

// Direct lighting: 5 fixed directional sources distributed across the upper hemisphere.
vec3 lightDirs[5] = vec3[5](
    normalize(vec3( 0.5,  0.7, -0.4)),
    normalize(vec3(-0.6,  0.4,  0.7)),
    normalize(vec3( 0.9,  0.0,  0.4)),
    normalize(vec3(-0.3, -0.3, -0.9)),
    normalize(vec3( 0.0, -0.4,  0.9))
);
vec3 lightCols[5] = vec3[5](
    vec3(2.4, 1.9, 1.2),
    vec3(0.9, 1.4, 1.7),
    vec3(1.6, 0.8, 0.5),
    vec3(0.5, 0.7, 1.0),
    vec3(0.4, 0.4, 0.5)
);

void main() {
    vec2 ndc = (gl_FragCoord.xy / u_resolution.xy) * 2.0 - 1.0;
    ndc.x *= u_resolution.x / u_resolution.y;

    // Camera basis
    float cy = cos(u_yaw),   sy = sin(u_yaw);
    float cp = cos(u_pitch), sp = sin(u_pitch);
    vec3 ro = vec3(sy * cp, sp, cy * cp) * 3.5;
    vec3 fwd = normalize(-ro);
    vec3 right = normalize(cross(fwd, vec3(0, 1, 0)));
    vec3 up = cross(right, fwd);
    vec3 rd = normalize(fwd + right * ndc.x * 0.85 + up * ndc.y * 0.85);

    // Background = sample env at the ray direction, with high roughness for blur.
    vec3 col = sampleEnv(rd, 0.65) * 0.6 * u_envStrength;

    float t;
    if (raySphere(ro, rd, t)) {
        vec3 p = ro + rd * t;
        vec3 n = p; // sphere centred at origin — normal = position
        vec3 v = -rd;
        float NoV = max(dot(n, v), 0.0);

        // Material
        vec3 base = u_baseColor;
        float metallic  = u_metallic;
        float roughness = clamp(u_roughness, 0.05, 1.0);
        float a = roughness * roughness;
        vec3 f0 = mix(vec3(0.04), base, metallic);

        // Direct lighting
        vec3 direct = vec3(0.0);
        for (int i = 0; i < 5; i++) {
            vec3 l = lightDirs[i];
            vec3 lc = lightCols[i];
            vec3 h = normalize(v + l);
            float NoL = max(dot(n, l), 0.0);
            float NoH = max(dot(n, h), 0.0);
            float VoH = max(dot(v, h), 0.0);
            if (NoL > 0.0) {
                float D = D_GGX(NoH, a);
                float V = V_SmithGGX(NoV, NoL, a);
                vec3  F = F_Schlick(VoH, f0);
                vec3 spec = D * V * F;
                vec3 diff = (vec3(1.0) - F) * (1.0 - metallic) * base / PI;
                direct += (spec + diff) * lc * NoL;
            }
        }

        // IBL approximation:
        //  - Specular: env sampled along the reflected ray, multiplied by Fresnel-roughness factor.
        //  - Diffuse: env sampled along the normal (very blurred).
        vec3 r = reflect(-v, n);
        vec3 envSpec = sampleEnv(r, roughness) * u_envStrength;
        vec3 envDiff = sampleEnv(n, 1.0) * u_envStrength * 0.55;
        vec3 F_ibl = f0 + (max(vec3(1.0 - roughness), f0) - f0) * pow(1.0 - NoV, 5.0);
        vec3 ibl = envSpec * F_ibl + envDiff * base * (1.0 - metallic) * (1.0 - F_ibl.r);

        col = direct + ibl;
    }

    // Vignette
    col *= 1.0 - 0.20 * dot(ndc, ndc) * 0.4;
    // Tonemap (Reinhard) + gamma
    col = col / (1.0 + col);
    col = pow(col, vec3(1.0 / 2.2));
    fragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(sh));
        throw new Error('shader compile failed');
    }
    return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link failed');

const u_res = gl.getUniformLocation(prog, 'u_resolution');
const u_time = gl.getUniformLocation(prog, 'u_time');
const u_yaw = gl.getUniformLocation(prog, 'u_yaw');
const u_pitch = gl.getUniformLocation(prog, 'u_pitch');
const u_metallic = gl.getUniformLocation(prog, 'u_metallic');
const u_roughness = gl.getUniformLocation(prog, 'u_roughness');
const u_baseColor = gl.getUniformLocation(prog, 'u_baseColor');
const u_envStrength = gl.getUniformLocation(prog, 'u_envStrength');

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');

let yaw = 0.6, pitch = 0.15;
const targetYaw = { v: yaw }, targetPitch = { v: pitch };
let dragging = false, lastX = 0, lastY = 0;
let auto = true;

canvas.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    auto = false;
    canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetYaw.v   += dx * 0.005;
    targetPitch.v -= dy * 0.005;
    targetPitch.v = Math.max(-0.6, Math.min(0.9, targetPitch.v));
});
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });

const metEl = document.getElementById('metallic');
const rghEl = document.getElementById('roughness');
const hueEl = document.getElementById('hue');
const envEl = document.getElementById('env');
const vMet = document.getElementById('vMet');
const vRgh = document.getElementById('vRgh');
const vHue = document.getElementById('vHue');
const vEnv = document.getElementById('vEnv');
metEl.addEventListener('input', () => { vMet.textContent = parseFloat(metEl.value).toFixed(2); });
rghEl.addEventListener('input', () => { vRgh.textContent = parseFloat(rghEl.value).toFixed(2); });
hueEl.addEventListener('input', () => { vHue.textContent = parseInt(hueEl.value); });
envEl.addEventListener('input', () => { vEnv.textContent = parseFloat(envEl.value).toFixed(2); });

function hsvToRgb(h, s, v) {
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        case 5: return [v, p, q];
    }
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    canvas.width  = Math.floor(canvas.clientWidth  * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
}
resize();
new ResizeObserver(resize).observe(canvas);

const start = performance.now();
function frame() {
    if (auto) targetYaw.v += 0.0015;
    yaw   += (targetYaw.v - yaw) * 0.12;
    pitch += (targetPitch.v - pitch) * 0.12;

    const hue = parseFloat(hueEl.value) / 360.0;
    const [r, g, b] = hsvToRgb(hue, 0.7, 0.85);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(u_res, canvas.width, canvas.height);
    gl.uniform1f(u_time, (performance.now() - start) * 0.001);
    gl.uniform1f(u_yaw, yaw);
    gl.uniform1f(u_pitch, pitch);
    gl.uniform1f(u_metallic, parseFloat(metEl.value));
    gl.uniform1f(u_roughness, parseFloat(rghEl.value));
    gl.uniform3f(u_baseColor, r, g, b);
    gl.uniform1f(u_envStrength, parseFloat(envEl.value));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
