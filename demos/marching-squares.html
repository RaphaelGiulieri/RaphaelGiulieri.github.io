<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marching squares · Raphael Giulieri</title>
<style>
    html, body { margin: 0; height: 100%; background: #0c0a07; color: #f0ebe0; font-family: "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .label { position: absolute; bottom: 12px; left: 12px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.78); pointer-events: none; line-height: 1.5; max-width: calc(100% - 24px); text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .label b { color: #ff4b1f; font-weight: 500; }
    .controls { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; align-items: center; }
    .controls button, .controls .pop { font: inherit; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.85); background: rgba(12,10,7,0.45); border: 1px solid rgba(240,235,224,0.20); padding: 4px 8px; cursor: pointer; backdrop-filter: blur(6px); }
    .controls button:hover, .controls button.on { border-color: #ff4b1f; color: #ff4b1f; }
    .controls .pop { cursor: default; color: rgba(240,235,224,0.55); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls">
    <button id="balls">Balls · 6</button>
    <button id="layers" class="on">Topographic</button>
    <button id="grid">Grid</button>
</div>
<p class="label"><b>Marching squares · move the cursor to drag a ball</b><br>6 metaballs · scalar field sampled on a 192×120 lattice · 16-case lookup table · linear edge interpolation · 8 stacked iso-levels for the topographic mode</p>
<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(canvas.clientWidth  * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    W = canvas.width; H = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
new ResizeObserver(resize).observe(canvas);

let nBalls = 6;
let showLayers = true;
let showGrid = false;

const ballsBtn = document.getElementById('balls');
const layersBtn = document.getElementById('layers');
const gridBtn = document.getElementById('grid');

ballsBtn.addEventListener('click', () => {
    nBalls = nBalls === 4 ? 6 : nBalls === 6 ? 9 : 4;
    ballsBtn.textContent = `Balls · ${nBalls}`;
    rebuildBalls();
});
layersBtn.addEventListener('click', () => {
    showLayers = !showLayers;
    layersBtn.classList.toggle('on', showLayers);
});
gridBtn.addEventListener('click', () => {
    showGrid = !showGrid;
    gridBtn.classList.toggle('on', showGrid);
});

// --- Metaballs -------------------------------------------------------------
class Ball {
    constructor(seed) {
        const a = seed * 1.7 + 0.3;
        this.cx = (Math.cos(a) * 0.3 + 0.5);
        this.cy = (Math.sin(a * 1.3) * 0.3 + 0.5);
        this.rx = 0.18 + 0.15 * Math.sin(seed);
        this.ry = 0.20 + 0.15 * Math.cos(seed * 0.7);
        this.fx = 0.13 + Math.random() * 0.07;
        this.fy = 0.10 + Math.random() * 0.08;
        this.px = Math.random() * Math.PI * 2;
        this.py = Math.random() * Math.PI * 2;
        this.r  = (0.06 + 0.03 * Math.sin(seed * 2.0)) ** 2; // r² in normalised UV
    }
    posAt(t) {
        return [
            (Math.cos(t * this.fx + this.px) * this.rx + this.cx) * W,
            (Math.sin(t * this.fy + this.py) * this.ry + this.cy) * H
        ];
    }
}

let balls = [];
function rebuildBalls() {
    balls = [];
    for (let i = 0; i < nBalls; i++) balls.push(new Ball(i * 11 + 0.7));
}
rebuildBalls();

// Player-controlled ball: replaces ball[0] when active.
let mouseX = -1e6, mouseY = -1e6, hasMouse = false;
canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    const dpr = canvas.width / r.width;
    mouseX = (e.clientX - r.left) * dpr;
    mouseY = (e.clientY - r.top) * dpr;
    hasMouse = true;
});
canvas.addEventListener('pointerleave', () => { hasMouse = false; });

// --- Marching squares ------------------------------------------------------
const COLS = 192;
const ROWS = 120;

// Field buffer reused each frame
let field = new Float32Array((COLS + 1) * (ROWS + 1));
function sampleField(t) {
    const W_ = W, H_ = H;
    const positions = balls.map(b => b.posAt(t));
    if (hasMouse) { positions[0] = [mouseX, mouseY]; }
    const radii = balls.map(b => b.r * (W_ * H_)); // r² in pixel² so /dist² is dimensionless
    const px = (COLS + 1);
    const sx = W_ / COLS;
    const sy = H_ / ROWS;
    for (let j = 0; j <= ROWS; j++) {
        for (let i = 0; i <= COLS; i++) {
            const x = i * sx, y = j * sy;
            let sum = 0;
            for (let k = 0; k < balls.length; k++) {
                const p = positions[k];
                const dx = x - p[0], dy = y - p[1];
                const d2 = dx * dx + dy * dy + 1e-3;
                sum += radii[k] / d2;
            }
            field[i + j * px] = sum;
        }
    }
}

// Edge midpoint table for 16 cases
// Each cell case (0..15) -> 0, 2 or 4 edge endpoints.
// Edges are numbered 0=top, 1=right, 2=bottom, 3=left.
// Lookup returns pairs of edges to connect.
const EDGE_TABLE = [
    [],           // 0
    [3, 0],       // 1
    [0, 1],       // 2
    [3, 1],       // 3
    [1, 2],       // 4
    [3, 0, 1, 2], // 5 (saddle)
    [0, 2],       // 6
    [3, 2],       // 7
    [3, 2],       // 8
    [0, 2],       // 9
    [3, 2, 0, 1], // 10 (saddle)
    [1, 2],       // 11
    [3, 1],       // 12
    [0, 1],       // 13
    [3, 0],       // 14
    []            // 15
];

function lerp(v0, v1, iso) {
    const t = (iso - v0) / (v1 - v0);
    return Math.max(0, Math.min(1, t));
}

// Returns the (u, v) ∈ [0,1] of the iso-crossing on each edge given corner values.
function edgePoint(edge, v0, v1, v2, v3, iso) {
    // Corner ordering: 0=TL, 1=TR, 2=BR, 3=BL
    if (edge === 0) return [lerp(v0, v1, iso), 0]; // top: TL -> TR
    if (edge === 1) return [1, lerp(v1, v2, iso)]; // right: TR -> BR
    if (edge === 2) return [lerp(v3, v2, iso), 1]; // bottom: BL -> BR
    if (edge === 3) return [0, lerp(v0, v3, iso)]; // left: TL -> BL
}

function drawIsoLine(iso, color, lineWidth) {
    const px = (COLS + 1);
    const sx = W / COLS;
    const sy = H / ROWS;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let j = 0; j < ROWS; j++) {
        for (let i = 0; i < COLS; i++) {
            const v0 = field[ i      +  j      * px]; // TL
            const v1 = field[(i + 1) +  j      * px]; // TR
            const v2 = field[(i + 1) + (j + 1) * px]; // BR
            const v3 = field[ i      + (j + 1) * px]; // BL
            let cs = 0;
            if (v0 > iso) cs |= 1;
            if (v1 > iso) cs |= 2;
            if (v2 > iso) cs |= 4;
            if (v3 > iso) cs |= 8;
            const edges = EDGE_TABLE[cs];
            if (edges.length === 0) continue;
            const x0 = i * sx, y0 = j * sy;
            for (let e = 0; e < edges.length; e += 2) {
                const a = edgePoint(edges[e],     v0, v1, v2, v3, iso);
                const b = edgePoint(edges[e + 1], v0, v1, v2, v3, iso);
                ctx.moveTo(x0 + a[0] * sx, y0 + a[1] * sy);
                ctx.lineTo(x0 + b[0] * sx, y0 + b[1] * sy);
            }
        }
    }
    ctx.stroke();
}

// --- Render loop -----------------------------------------------------------
const start = performance.now();

function frame() {
    const t = (performance.now() - start) * 0.001;

    // Background
    ctx.fillStyle = '#0c0a07';
    ctx.fillRect(0, 0, W, H);

    if (showGrid) {
        ctx.strokeStyle = 'rgba(240,235,224,0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const sx = W / COLS, sy = H / ROWS;
        for (let i = 0; i <= COLS; i += 8) { ctx.moveTo(i*sx, 0); ctx.lineTo(i*sx, H); }
        for (let j = 0; j <= ROWS; j += 8) { ctx.moveTo(0, j*sy); ctx.lineTo(W, j*sy); }
        ctx.stroke();
    }

    sampleField(t);

    if (showLayers) {
        // Topographic: 8 stacked iso-levels, brighter near the main one.
        const baseIso = 1.0;
        const levels = 8;
        for (let k = 0; k < levels; k++) {
            const iso = baseIso * Math.pow(1.45, k - 3);
            const intensity = 1 - Math.abs(k - 3) / 5;
            const r = 255;
            const g = 75 + intensity * 80;
            const b = 31 + intensity * 30;
            const a = 0.12 + 0.30 * intensity;
            drawIsoLine(iso, `rgba(${r|0},${g|0},${b|0},${a})`, 1 + intensity * 1.4);
        }
        // Main outline on top, bold
        drawIsoLine(baseIso, '#ff4b1f', 2.4);
    } else {
        drawIsoLine(1.0, '#ff4b1f', 2.4);
    }

    // Cursor halo
    if (hasMouse) {
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 75, 31, 0.85)';
        ctx.fill();
    }

    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
