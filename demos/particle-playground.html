  const canvasEl = el('canvas', { class: 'preview', width: 280, height: 28 });
  wrap.appendChild(canvasEl);
  drawCurvePreview(canvasEl, target[key]);
  return wrap;
}
function drawCurvePreview(canvas, curve) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#0c0a07'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ff4b1f'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let x = 0; x <= W; x++) {
    const y = curve.sample(x / W);
    const py = H - 2 - y * (H - 4);
    if (x === 0) ctx.moveTo(x, py); else ctx.lineTo(x, py);
  }
  ctx.stroke();
}

function gradientRow(target, key) {
  const wrap = el('div');
  wrap.appendChild(el('label', { class: 'v', html: 'gradient keys' }));
  const ta = el('textarea', { spellcheck: 'false' });
  ta.value = JSON.stringify(target[key].keys);
  ta.addEventListener('change', () => {
    try {
      const keys = JSON.parse(ta.value);
      target[key].update(keys);
      drawGradPreview(canvasEl, target[key]);
    } catch (e) {}
  });
  wrap.appendChild(ta);
  const canvasEl = el('canvas', { class: 'preview', width: 280, height: 28 });
  wrap.appendChild(canvasEl);
  drawGradPreview(canvasEl, target[key]);
  return wrap;
}
function drawGradPreview(canvas, g) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const tmp = [0,0,0,0];
  for (let x = 0; x < W; x++) {
    g.sample(x / (W - 1), tmp);
    ctx.fillStyle = `rgba(${(tmp[0]*255)|0},${(tmp[1]*255)|0},${(tmp[2]*255)|0},${tmp[3]})`;
    ctx.fillRect(x, 0, 1, H);
  }
}

// ----- module picker (search/category) -----
function openPicker(emitter) {
  picker.dataset.target = ps.emitters.indexOf(emitter);
  picker.classList.add('show');
  pickerSearch.value = '';
  renderPicker('');
  pickerSearch.focus();
}
function renderPicker(query) {
  pickerList.innerHTML = '';
  const q = query.trim().toLowerCase();
  const byCat = {};
  for (const def of MODULE_DEFS) {
    if (q && !def.name.toLowerCase().includes(q) && !(def.doc || '').toLowerCase().includes(q)) continue;
    const cat = def.category || 'Other';
    (byCat[cat] = byCat[cat] || []).push(def);
  }
  for (const [cat, items] of Object.entries(byCat)) {
    pickerList.appendChild(el('div', { class: 'pcat', html: cat }));
    for (const def of items) {
      const row = el('div', { class: 'pitem',
        onclick: () => addModule(parseInt(picker.dataset.target, 10), def) },
        [
          el('div', { class: 'pname', html: def.name }),
          el('div', { class: 'pdoc',  html: def.doc || '' }),
        ]);
      pickerList.appendChild(row);
    }
  }
}
function addModule(emitterIdx, def) {
  // Bulk-add path: skip emitters already carrying a module of this name,
  // mint a fresh factory instance per peer (modules can't be deep-cloned
  // safely — they're function objects with closure state).
  if (_bulkPickerEmitters) {
    const targets = _bulkPickerEmitters;
    _bulkPickerEmitters = null;
    const m0 = def.factory();
    const name = m0.moduleName;
    let added = 0;
    for (const e of targets) {
      if (!e.config.modules) e.config.modules = [];
      if (name && e.config.modules.some(mm => mm.moduleName === name)) continue;
      e.config.modules.push(added === 0 ? m0 : def.factory());
      added++;
    }
    picker.classList.remove('show');
    buildPanel();
    return;
  }
  const m = def.factory();
  const e = ps.emitters[emitterIdx];
  if (!e.config.modules) e.config.modules = [];
  e.config.modules.push(m);
  picker.classList.remove('show');
  buildPanel();
}
pickerSearch.addEventListener('input', e => renderPicker(e.target.value));
window.addEventListener('keydown', e => { if (e.key === 'Escape') picker.classList.remove('show'); });

// ============================================================ main loop
let last = performance.now();
let view = mat4LookAt([0, 4, 18], [0, 0, 0], [0, 1, 0]);
let proj = mat4Perspective(Math.PI / 3.4, canvas.width / canvas.height, 0.5, 200);

// rolling-window FPS: keep last ~30 frame timestamps, compute average dt.
const fpsWindow = [];
const FPS_WINDOW_SIZE = 30;
function pushFps(now) {
  fpsWindow.push(now);
  while (fpsWindow.length > FPS_WINDOW_SIZE) fpsWindow.shift();
}
function currentFps() {
  if (fpsWindow.length < 2) return 0;
  const span = (fpsWindow[fpsWindow.length - 1] - fpsWindow[0]) / 1000;
  return span > 0 ? (fpsWindow.length - 1) / span : 0;
}

function frame(now) {
  requestAnimationFrame(frame);
  pushFps(now);
  const dt = paused ? 0 : Math.min(0.05, (now - last) / 1000);
  last = now;

  const eye = [
    Math.cos(camAngle) * camDist * Math.cos(camAngleY),
    Math.sin(camAngleY) * camDist,
    Math.sin(camAngle) * camDist * Math.cos(camAngleY),
  ];
  view = mat4LookAt(eye, [0, 0, 0], [0, 1, 0]);
  proj = mat4Perspective(Math.PI / 3.4, canvas.width / canvas.height, 0.5, 200);

  const t0 = performance.now();
  if (!paused) ps.update(dt);
  const tSim = performance.now() - t0;

  // 1. render scene to postfx FBO
  const bg = stage.bgColor;
  const r0 = performance.now();
  ps.render({
    view, proj,
    pixelScale: Math.min(window.devicePixelRatio || 1, 2),
    bgColor: bg,
    postfx: {
      enableBloom:    stage.enableBloom,
      bloomThreshold: stage.bloomThreshold,
      bloomSoftKnee:  stage.bloomSoftKnee,
      bloomIntensity: stage.bloomIntensity,
      blurPasses:     stage.blurPasses,
      exposure:       stage.exposure,
      vignette:       stage.vignette,
    },
  });
  const tRen = performance.now() - r0;

  // PostFX runs inside ps.render() on WebGPU.

  const gStats = ps.getStats();
  // Prefer real presented-frame rate (from onSubmittedWorkDone) when the
  // backend reports it. The rAF-based currentFps() lies under GPU
  // saturation: rAF fires at display refresh while submitted work piles
  // up and frames drop silently. realFps counts actual GPU completions.
  const fps = (typeof gStats.realFps === 'number' && gStats.realFps > 0) ? gStats.realFps : currentFps();
  const backendEl = document.getElementById('stat-backend');
  backendEl.textContent = `backend: ${gStats.backend}`;
  backendEl.className = 'stat-backend backend-' + gStats.backend;
  // Honor stage.showStats — toggleable from the General tab.
  const statsEl = document.getElementById('stats');
  if (statsEl) statsEl.classList.toggle('hidden', !stage.showStats);
  document.getElementById('stat-fps').textContent = fps.toFixed(0);
  document.getElementById('stat-alive').textContent = gStats.alive.toLocaleString();
  document.getElementById('stat-sim').textContent = gStats.simMs.toFixed(2);
  document.getElementById('stat-render').textContent = gStats.renderMs.toFixed(2);
  document.getElementById('stat-gpumem').textContent = (gStats.gpuMemBytes / 1024 / 1024).toFixed(1);
  // Live audio dock: playhead, EQ bars, beat pulse, drum onset lights.
  updateAudioDockLive();
  // Scene overlay (grid + emitter markers + gizmo). SVG layer above the
  // canvas; pointer-events: none so canvas drags pass through.
  updateSceneOverlay();
  updateGizmo();
}

// ============================================================ scene overlay
// SVG-based overlay for the reference grid and selection markers. Drawn each
// frame off `view` / `proj`. Uses fixed pools of <line>/<rect> elements so
// the hot path mutates attributes only — no DOM mint/destroy per frame.
const SVG_NS = 'http://www.w3.org/2000/svg';
const _overlay = {
  svg:        document.getElementById('scene-overlay'),
  gridGroup:  null,
  gridLines:  [],            // pool of <line> elements
  markerGroup: null,
  markers:     [],           // pool of <g> elements (one per emitter slot)
  boxGroup:    null,         // wireframe for constraint.box
  boxLines:    [],           // 12 <line> elements
  initialized: false,
};

function _initSceneOverlay() {
  if (_overlay.initialized) return;
  if (!_overlay.svg) return;
  _overlay.gridGroup = document.createElementNS(SVG_NS, 'g');
  _overlay.gridGroup.setAttribute('id', 'overlay-grid');
  _overlay.svg.appendChild(_overlay.gridGroup);
  // 21 lines along X (constant Z) + 21 lines along Z (constant X) = 42.
  for (let i = 0; i < 42; i++) {
    const ln = document.createElementNS(SVG_NS, 'line');
    ln.setAttribute('stroke', 'rgba(240,235,224,0.10)');
    ln.setAttribute('stroke-width', '1');
    _overlay.gridGroup.appendChild(ln);
    _overlay.gridLines.push(ln);
  }
  _overlay.markerGroup = document.createElementNS(SVG_NS, 'g');
  _overlay.markerGroup.setAttribute('id', 'overlay-markers');
  _overlay.svg.appendChild(_overlay.markerGroup);
  // Wireframe-box pool: 12 edges of a cuboid. Only updated when a
  // constraint.box module is present on some emitter; otherwise hidden.
  _overlay.boxGroup = document.createElementNS(SVG_NS, 'g');
  _overlay.boxGroup.setAttribute('id', 'overlay-constraint-box');
  _overlay.svg.appendChild(_overlay.boxGroup);
  for (let i = 0; i < 12; i++) {
    const ln = document.createElementNS(SVG_NS, 'line');
    ln.setAttribute('stroke', 'rgba(140,200,255,0.45)');
    ln.setAttribute('stroke-width', '1.2');
    ln.setAttribute('stroke-dasharray', '4 3');
    _overlay.boxGroup.appendChild(ln);
    _overlay.boxLines.push(ln);
  }
  _overlay.initialized = true;
}

// Scan all emitters for the first enabled constraint.box; return {sx, sy, sz}
// or null. The box is treated as scene-level even though it's per-emitter —
// most presets have a single containment shape.
function _findConstraintBox() {
  if (!ps?.emitters) return null;
  for (const em of ps.emitters) {
    if (em.config?.disabled) continue;
    const mods = em.config?.modules || [];
    for (const m of mods) {
      if (m.disabled) continue;
      if (m.moduleName !== 'constraint.box') continue;
      const p = m.params || {};
      const sx = typeof p.sx === 'number' ? p.sx : 5;
      const sy = typeof p.sy === 'number' ? p.sy : 5;
      const sz = typeof p.sz === 'number' ? p.sz : 5;
      return { sx, sy, sz };
    }
  }
  return null;
}

// world (x,y,z) → screen CSS px in [0,cssW]×[0,cssH]; returns null when behind camera.
function _projectWorld(p, viewM, projM, cssW, cssH) {
  // clip = proj * view * (p, 1)
  const x = p[0], y = p[1], z = p[2];
  // view * p
  const vx = viewM[0]*x + viewM[4]*y + viewM[8]*z  + viewM[12];
  const vy = viewM[1]*x + viewM[5]*y + viewM[9]*z  + viewM[13];
  const vz = viewM[2]*x + viewM[6]*y + viewM[10]*z + viewM[14];
  const vw = viewM[3]*x + viewM[7]*y + viewM[11]*z + viewM[15];
  // proj * (vx,vy,vz,vw)
  const cx = projM[0]*vx + projM[4]*vy + projM[8]*vz  + projM[12]*vw;
  const cy = projM[1]*vx + projM[5]*vy + projM[9]*vz  + projM[13]*vw;
  const cz = projM[2]*vx + projM[6]*vy + projM[10]*vz + projM[14]*vw;
  const cw = projM[3]*vx + projM[7]*vy + projM[11]*vz + projM[15]*vw;
  if (cw <= 0.001) return null;
  const ndx = cx / cw, ndy = cy / cw, ndz = cz / cw;
  return [(ndx * 0.5 + 0.5) * cssW, (1 - (ndy * 0.5 + 0.5)) * cssH, ndz];
}

function updateSceneOverlay() {
  _initSceneOverlay();
  if (!_overlay.initialized) return;
  const cssW = canvas.clientWidth || canvas.width;
  const cssH = canvas.clientHeight || canvas.height;
  // ── grid ──
  const showGrid = !!stage.showGrid;
  _overlay.gridGroup.style.display = showGrid ? '' : 'none';
  if (showGrid) {
    const N = 21;          // 21 lines per axis (-10..+10 step 1)
    const HALF = 10;
    let li = 0;
    // Lines parallel to X (vary Z)
    for (let k = 0; k < N; k++) {
      const z = -HALF + k;
      const a = _projectWorld([-HALF, 0, z], view, proj, cssW, cssH);
      const b = _projectWorld([+HALF, 0, z], view, proj, cssW, cssH);
      const ln = _overlay.gridLines[li++];
      if (!a || !b) { ln.setAttribute('x1', '0'); ln.setAttribute('y1', '0'); ln.setAttribute('x2', '0'); ln.setAttribute('y2', '0'); ln.setAttribute('opacity', '0'); continue; }
      ln.setAttribute('x1', a[0].toFixed(1)); ln.setAttribute('y1', a[1].toFixed(1));
      ln.setAttribute('x2', b[0].toFixed(1)); ln.setAttribute('y2', b[1].toFixed(1));
      ln.setAttribute('opacity', z === 0 ? '0.45' : '1');
      ln.setAttribute('stroke-width', z === 0 ? '1.4' : '1');
    }
    // Lines parallel to Z (vary X)
    for (let k = 0; k < N; k++) {
      const x = -HALF + k;
      const a = _projectWorld([x, 0, -HALF], view, proj, cssW, cssH);
      const b = _projectWorld([x, 0, +HALF], view, proj, cssW, cssH);
      const ln = _overlay.gridLines[li++];
      if (!a || !b) { ln.setAttribute('x1', '0'); ln.setAttribute('y1', '0'); ln.setAttribute('x2', '0'); ln.setAttribute('y2', '0'); ln.setAttribute('opacity', '0'); continue; }
      ln.setAttribute('x1', a[0].toFixed(1)); ln.setAttribute('y1', a[1].toFixed(1));
      ln.setAttribute('x2', b[0].toFixed(1)); ln.setAttribute('y2', b[1].toFixed(1));
      ln.setAttribute('opacity', x === 0 ? '0.45' : '1');
      ln.setAttribute('stroke-width', x === 0 ? '1.4' : '1');
    }
  }
  // ── constraint.box wireframe ──
  const cb = _findConstraintBox();
  if (cb) {
    const { sx, sy, sz } = cb;
    // 8 corners of the cuboid centered at origin.
    const c = [
      [-sx,-sy,-sz], [+sx,-sy,-sz], [+sx,-sy,+sz], [-sx,-sy,+sz],   // bottom (0..3)
      [-sx,+sy,-sz], [+sx,+sy,-sz], [+sx,+sy,+sz], [-sx,+sy,+sz],   // top    (4..7)
    ];
    // 12 edges: 4 bottom, 4 top, 4 vertical.
    const edges = [
      [0,1],[1,2],[2,3],[3,0],
      [4,5],[5,6],[6,7],[7,4],
      [0,4],[1,5],[2,6],[3,7],
    ];
    const projected = c.map(p => _projectWorld(p, view, proj, cssW, cssH));
    _overlay.boxGroup.style.display = '';
    for (let i = 0; i < 12; i++) {
      const [a, b] = edges[i];
      const pa = projected[a], pb = projected[b];
      const ln = _overlay.boxLines[i];
      if (!pa || !pb) { ln.setAttribute('opacity', '0'); continue; }
      ln.setAttribute('x1', pa[0].toFixed(1)); ln.setAttribute('y1', pa[1].toFixed(1));
      ln.setAttribute('x2', pb[0].toFixed(1)); ln.setAttribute('y2', pb[1].toFixed(1));
      ln.setAttribute('opacity', '1');
    }
  } else {
    _overlay.boxGroup.style.display = 'none';
  }
  // ── selection markers ──
  // Grow pool to cover any selected emitter.
  const sel = (panelState.active.type === 'em') ? getSelectedEmitters() : [];
  while (_overlay.markers.length < sel.length) {
    const g = document.createElementNS(SVG_NS, 'g');
    const r = document.createElementNS(SVG_NS, 'rect');
    r.setAttribute('width', '14'); r.setAttribute('height', '14');
    r.setAttribute('fill', 'none');
    r.setAttribute('stroke-width', '1.5');
    g.appendChild(r);
    const dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('r', '2');
    g.appendChild(dot);
    _overlay.markerGroup.appendChild(g);
    _overlay.markers.push(g);
  }
  for (let i = 0; i < _overlay.markers.length; i++) {
    const g = _overlay.markers[i];
    if (i >= sel.length) { g.style.display = 'none'; continue; }
    const em = sel[i];
    const pos = em.config.position || [0, 0, 0];
    const s = _projectWorld(pos, view, proj, cssW, cssH);
    if (!s) { g.style.display = 'none'; continue; }
    g.style.display = '';
    const c = em.config.initial?.color || [1, 0.5, 0.1, 1];
    const css = rgbCss(c);
    const rect = g.children[0];
    const dot  = g.children[1];
    rect.setAttribute('x', (s[0] - 7).toFixed(1));
    rect.setAttribute('y', (s[1] - 7).toFixed(1));
    rect.setAttribute('stroke', css);
    dot.setAttribute('cx', s[0].toFixed(1));
    dot.setAttribute('cy', s[1].toFixed(1));
    dot.setAttribute('fill', css);
  }
}

// ============================================================ translate gizmo
// 3-axis translate gizmo at the selection centroid (or single emitter origin).
// Fixed pixel length so it stays usable at any camera distance. Pointer events
// are re-enabled on the gizmo handles only; the rest of the SVG overlay stays
// transparent to mouse so canvas orbit/zoom keep working.
const _gizmo = {
  group: null,
  axisLines: [null, null, null],
  arrows:    [null, null, null],
  axisScreen: [null, null, null], // {ux, uy, perPixelToWorld}
  screen:     null,                // [x, y] of gizmo origin in CSS px
  drag:       null,                // { axis, startX, startY, orig: Map<em, [x,y,z]>, sel: Em[] }
};

function _initGizmo() {
  if (_gizmo.group) return;
  if (!_overlay.svg) return;
  if (typeof window !== 'undefined') window._g = _gizmo;
  _gizmo.group = document.createElementNS(SVG_NS, 'g');
  _gizmo.group.setAttribute('id', 'overlay-gizmo');
  _overlay.svg.appendChild(_gizmo.group);
  const COLORS = ['#ff5566', '#66ff66', '#5599ff'];
  for (let i = 0; i < 3; i++) {
    const ln = document.createElementNS(SVG_NS, 'line');
    ln.setAttribute('stroke', COLORS[i]);
    ln.setAttribute('stroke-width', '3');
    ln.setAttribute('stroke-linecap', 'round');
    ln.style.cursor = 'grab';
    ln.style.pointerEvents = 'stroke';
    ln.dataset.axis = String(i);
    ln.addEventListener('mousedown', (ev) => _gizmoMouseDown(ev, i));
    _gizmo.group.appendChild(ln);
    _gizmo.axisLines[i] = ln;
    const tip = document.createElementNS(SVG_NS, 'circle');
    tip.setAttribute('r', '5');
    tip.setAttribute('fill', COLORS[i]);
    tip.style.cursor = 'grab';
    tip.style.pointerEvents = 'auto';
    tip.dataset.axis = String(i);
    tip.addEventListener('mousedown', (ev) => _gizmoMouseDown(ev, i));
    _gizmo.group.appendChild(tip);
    _gizmo.arrows[i] = tip;
  }
}

function updateGizmo() {
  _initGizmo();
  if (!_gizmo.group) return;
  const sel = (panelState.active.type === 'em') ? getSelectedEmitters() : [];
  if (sel.length === 0) { _gizmo.group.style.display = 'none'; return; }
  const cssW = canvas.clientWidth || canvas.width;
  const cssH = canvas.clientHeight || canvas.height;
  let cx = 0, cy = 0, cz = 0;
  for (const e of sel) {
    const p = e.config.position || [0, 0, 0];
    cx += p[0]; cy += p[1]; cz += p[2];
  }
  cx /= sel.length; cy /= sel.length; cz /= sel.length;
  const center = _projectWorld([cx, cy, cz], view, proj, cssW, cssH);
  if (!center) { _gizmo.group.style.display = 'none'; return; }
  _gizmo.group.style.display = '';
  _gizmo.screen = [center[0], center[1]];
  const GIZMO_PX = 60;
  for (let i = 0; i < 3; i++) {
    const dp = [cx, cy, cz]; dp[i] += 1;
    const sp = _projectWorld(dp, view, proj, cssW, cssH);
    if (!sp) { _gizmo.axisLines[i].style.display = 'none'; _gizmo.arrows[i].style.display = 'none'; _gizmo.axisScreen[i] = null; continue; }
    _gizmo.axisLines[i].style.display = '';
    _gizmo.arrows[i].style.display    = '';
    const dx = sp[0] - center[0], dy = sp[1] - center[1];
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const tipX = center[0] + ux * GIZMO_PX, tipY = center[1] + uy * GIZMO_PX;
    const ln = _gizmo.axisLines[i];
    ln.setAttribute('x1', center[0].toFixed(1)); ln.setAttribute('y1', center[1].toFixed(1));
    ln.setAttribute('x2', tipX.toFixed(1));      ln.setAttribute('y2', tipY.toFixed(1));
    const tip = _gizmo.arrows[i];
    tip.setAttribute('cx', tipX.toFixed(1));     tip.setAttribute('cy', tipY.toFixed(1));
    // For drag math: 1 px of mouse along (ux,uy) corresponds to (1/len) world units along axis.
    _gizmo.axisScreen[i] = { ux, uy, perPixelToWorld: 1 / len };
  }
}

function _gizmoMouseDown(ev, axis) {
  if (ev.button !== 0) return;
  ev.stopImmediatePropagation();
  ev.preventDefault();
  const sel = getSelectedEmitters();
  if (!sel.length) return;
  const orig = new Map();
  for (const e of sel) orig.set(e, (e.config.position || [0, 0, 0]).slice());
  _gizmo.drag = { axis, startX: ev.clientX, startY: ev.clientY, orig, sel };
  window.addEventListener('mousemove', _gizmoMouseMove, true);
  window.addEventListener('mouseup',   _gizmoMouseUp,   true);
  window.addEventListener('keydown',   _gizmoKey,       true);
  window.addEventListener('contextmenu', _gizmoCancel,  true);
}

function _gizmoMouseMove(ev) {
  if (!_gizmo.drag) return;
  const a = _gizmo.axisScreen[_gizmo.drag.axis];
  if (!a) return;
  const dx = ev.clientX - _gizmo.drag.startX;
  const dy = ev.clientY - _gizmo.drag.startY;
  const screenAlong = dx * a.ux + dy * a.uy;
  const worldDelta  = screenAlong * a.perPixelToWorld;
  for (const [em, p0] of _gizmo.drag.orig) {
    const p = em.config.position;
    p[0] = p0[0]; p[1] = p0[1]; p[2] = p0[2];
    p[_gizmo.drag.axis] += worldDelta;
  }
}

function _gizmoMouseUp(ev) {
  ev.stopImmediatePropagation();
  _gizmoEnd();
  buildPanel();
}

function _gizmoCancel(ev) {
  if (ev) { ev.preventDefault(); ev.stopImmediatePropagation(); }
  if (!_gizmo.drag) return;
  for (const [em, p0] of _gizmo.drag.orig) {
    const p = em.config.position;
    p[0] = p0[0]; p[1] = p0[1]; p[2] = p0[2];
  }
  _gizmoEnd();
  buildPanel();
}

function _gizmoKey(ev) {
  if (ev.key === 'Escape') _gizmoCancel(ev);
}

function _gizmoEnd() {
  _gizmo.drag = null;
  window.removeEventListener('mousemove',   _gizmoMouseMove, true);
  window.removeEventListener('mouseup',     _gizmoMouseUp,   true);
  window.removeEventListener('keydown',     _gizmoKey,       true);
  window.removeEventListener('contextmenu', _gizmoCancel,    true);
}

// ============================================================ click-pick
// Capture-phase mousedown on the canvas: if cursor is within 12 px of any
// emitter origin's projected position, that emitter is selected (with the
// same Shift/Ctrl/Cmd modifier rules as the tab list) and the orbit handler
// is suppressed via stopImmediatePropagation. Misses fall through to orbit.
canvas.addEventListener('mousedown', (ev) => {
  if (ev.button !== 0) return;
  if (ev.altKey)  return;          // Alt held → fall through to legacy burst
  if (!ps || !ps.emitters || !ps.emitters.length) return;
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left;
  const py = ev.clientY - rect.top;
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  const TH = 12;
  let best = null, bestD = TH * TH + 1;
  for (const em of ps.emitters) {
    const s = _projectWorld(em.config.position || [0, 0, 0], view, proj, cssW, cssH);
    if (!s) continue;
    const d = (s[0] - px) * (s[0] - px) + (s[1] - py) * (s[1] - py);
    if (d < bestD) { bestD = d; best = em; }
  }
  if (!best) return; // miss → orbit handles it
  ev.stopImmediatePropagation();
  const idx = ps.emitters.indexOf(best);
  if (ev.shiftKey && panelState.active.type === 'em') {
    const lo = Math.min(panelState.active.idx, idx);
    const hi = Math.max(panelState.active.idx, idx);
    panelState.selectedIdx.clear();
    for (let i = lo; i <= hi; i++) panelState.selectedIdx.add(ps.emitters[i]);
    panelState.active = { type: 'em', idx };
  } else if (ev.ctrlKey || ev.metaKey) {
    if (panelState.selectedIdx.has(best)) panelState.selectedIdx.delete(best);
    else { panelState.selectedIdx.add(best); panelState.active = { type: 'em', idx }; }
  } else {
    panelState.selectedIdx.clear();
    panelState.selectedIdx.add(best);
    panelState.active = { type: 'em', idx };
  }
  buildPanel();
}, { capture: true });

const warmup = parseInt(params.get('warmup') || '0', 10);
await loadPreset(PRESETS.includes(initialPreset) ? initialPreset : 'fountain');
if (warmup > 0) ps.runFrames(warmup, 1 / 60);
requestAnimationFrame(frame);
</script>
