// existing stageBlock kept for back-compat callers; now unused.
function stageBlock() { return el('div'); }

// ----- Persistent audio dock — built ONCE at startup. Lives outside the
// tabbed area so playback survives tab switches and the player is always
// reachable without leaving the current section. (_audioEl / _audioStatus
// are hoisted higher up in the module to avoid TDZ on early init calls.)
function buildAudioDock() {
  const dock = document.getElementById('audio-panel');
  if (!dock || dock.dataset.built) return;
  dock.dataset.built = '1';

  // Headless <audio> — provides standard playback APIs (play/pause/seek)
  // without rendering the browser's native UI; we render our own below.
  _audioEl = document.createElement('audio');
  _audioEl.preload = 'metadata';
  dock.appendChild(_audioEl);

  // ── Header: play/pause + track title + volume control ───────────────
  const playBtn  = el('button', { class: 'audio-play', title: 'play / pause', html: '▶' });
  const titleEl  = el('div', { class: 'audio-title', html: 'load a track to start' });
  const volIcon  = el('span', { class: 'audio-vol-icon', title: 'click to mute', html: '🔊' });
  const volSlide = el('input', {
    class: 'audio-vol-slider', type: 'range',
    min: '0', max: '1', step: '0.01', value: '1',
    title: 'volume',
  });
  const volWrap  = el('div', { class: 'audio-vol' }, [volIcon, volSlide]);
  dock.appendChild(el('div', { class: 'audio-head' }, [playBtn, titleEl, volWrap]));

  // ── Stat row: BPM | KEY | LUFS ─ values updated on load ──────────────
  function statCard(label, extraClass = '') {
    const value = el('div', { class: 'audio-stat-value', html: '—' });
    const unit  = el('div', { class: 'audio-stat-unit',  html: label });
    const root  = el('div', { class: 'audio-stat' + (extraClass ? ' ' + extraClass : '') }, [value, unit]);
    return { root, value, unit };
  }
  const statBpm  = statCard('BPM', 'bpm');   // .bpm — pulses on each beat
  const statKey  = statCard('KEY');
  const statLufs = statCard('LUFS');
  dock.appendChild(el('div', { class: 'audio-stats' }, [statBpm.root, statKey.root, statLufs.root]));

  // ── Progress scrubber + time row ─────────────────────────────────────
  const progressFill = el('div', { class: 'audio-progress-fill' });
  const progressTrack = el('div', { class: 'audio-progress-track' }, [progressFill]);
  const progressOuter = el('div', { class: 'audio-progress' }, [progressTrack]);
  progressOuter.addEventListener('click', (e) => {
    if (!_audioEl.duration || !isFinite(_audioEl.duration)) return;
    const rect = progressTrack.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    _audioEl.currentTime = pct * _audioEl.duration;
  });
  const timeCurr = el('span', { class: 'audio-time-curr', html: '0:00' });
  const timeEnd  = el('span', { class: 'audio-time-end',  html: '0:00' });
  dock.appendChild(progressOuter);
  dock.appendChild(el('div', { class: 'audio-time-row' }, [timeCurr, timeEnd]));

  // ── Live row: 7-band EQ + kick / snare / hat onset lights ───────────
  const eqContainer = el('div', { class: 'audio-eq' });
  const eqBars = [];
  for (let i = 0; i < 7; i++) {
    const bar = el('div', { class: 'audio-eq-bar' });
    eqBars.push(bar);
    eqContainer.appendChild(bar);
  }
  const drumKick  = el('span', { class: 'audio-drum',  title: 'kick',  html: 'K' });
  const drumSnare = el('span', { class: 'audio-drum',  title: 'snare', html: 'S' });
  const drumHat   = el('span', { class: 'audio-drum',  title: 'hat',   html: 'H' });
  const drumRow   = el('div', { class: 'audio-drum-lights' }, [drumKick, drumSnare, drumHat]);
  dock.appendChild(el('div', { class: 'audio-eq-row' }, [eqContainer, drumRow]));

  // ── Foot row: track picker + load / unload ───────────────────────────
  const select = el('select', { class: 'audio-track' });
  select.appendChild(el('option', { value: '', html: '— choose track —' }));
  // Track manifest lives at /output/index.json (this project's analysis
  // output) when the demo is served from AudioReactiveProject root, or
  // /index.json (legacy: served from visualiser's tracks/ folder).
  // First successful fetch wins; trackBase is set to the matching prefix
  // so the load button uses the same folder.
  let trackBase = '/output/';
  const _resolveManifest = async () => {
    for (const base of ['/output/', '/']) {
      try {
        const r = await fetch(base + 'index.json');
        if (r.ok) { trackBase = base; return await r.json(); }
      } catch (_) {}
    }
    return { tracks: [] };
  };
  _resolveManifest().then(data => {
    for (const t of (data.tracks || [])) {
      if (t.schema_version !== 2) continue;
      const opt = el('option', { value: t.path, html: `${t.title || t.id} (${t.bpm ? t.bpm.toFixed(0) + ' BPM' : '?'})` });
      select.appendChild(opt);
    }
  }).catch(() => {});
  const loadBtn   = el('button', { class: 'grad-btn', html: 'load' });
  const unloadBtn = el('button', { class: 'grad-btn', html: 'unload' });
  _audioStatus    = el('span', { class: 'audio-status' });   // kept for back-compat; hidden via CSS
  dock.appendChild(el('div', { class: 'audio-foot' }, [select, loadBtn, unloadBtn]));

  // ── Wire interactions ────────────────────────────────────────────────
  playBtn.addEventListener('click', () => {
    if (_audioEl.paused) _audioEl.play().catch(() => {});
    else                  _audioEl.pause();
  });
  _audioEl.addEventListener('play',  () => { playBtn.textContent = '❚❚'; });
  _audioEl.addEventListener('pause', () => { playBtn.textContent = '▶'; });
  _audioEl.addEventListener('ended', () => { playBtn.textContent = '▶'; });

  // Volume slider — direct binding. Mute toggle on the icon click.
  volSlide.addEventListener('input', (e) => {
    _audioEl.volume = parseFloat(e.target.value) || 0;
    if (_audioEl.muted && _audioEl.volume > 0) _audioEl.muted = false;
    volIcon.textContent = _audioEl.volume === 0 ? '🔇' : (_audioEl.volume < 0.5 ? '🔉' : '🔊');
  });
  volIcon.addEventListener('click', () => {
    _audioEl.muted = !_audioEl.muted;
    volIcon.textContent = _audioEl.muted ? '🔇' : (_audioEl.volume < 0.5 ? '🔉' : '🔊');
  });

  // Helper: revoke any prior Blob URL so we don't leak. Returns the URL
  // string we previously set as src (or '' if none was a blob).
  const revokeBlobSrc = () => {
    if (_audioEl.src && _audioEl.src.startsWith('blob:')) {
      URL.revokeObjectURL(_audioEl.src);
    }
  };

  loadBtn.addEventListener('click', async () => {
    const path = select.value;
    if (!path) return;
    titleEl.textContent = 'loading…';
    try {
      const url = trackBase + path + '/';
      const feed = await AudioFeed.load(url);
      // Fetch the source as a Blob and bind via Object URL. Python's stdlib
      // http.server doesn't send Accept-Ranges, which leaves the streamed
      // <audio>'s seekable range stuck at [0..0] — clicking the scrubber
      // would snap currentTime back to 0. A Blob URL is fully in-memory and
      // fully seekable.
      const audioResp = await fetch(url + feed.meta.track.filename);
      if (!audioResp.ok) throw new Error('fetch source: ' + audioResp.status);
      const audioBlob = await audioResp.blob();
      revokeBlobSrc();
      _audioEl.src = URL.createObjectURL(audioBlob);
      feed.bindAudio(_audioEl);
      ps.setAudioFeed(feed);
      const t = feed.meta.track || {};
      const g = feed.meta.globals || {};
      titleEl.textContent = t.artist ? `${t.title} — ${t.artist}` : (t.title || path);
      titleEl.title = titleEl.textContent;   // tooltip in case of ellipsis
      statBpm.value.textContent  = (g.bpm ?? feed.bpm).toFixed(1);
      statKey.value.textContent  = g.key  || '—';
      statKey.unit.textContent   = g.mode ? g.mode.toUpperCase() : 'KEY';
      statLufs.value.textContent = g.loudness_lufs != null ? g.loudness_lufs.toFixed(1) : '—';
      timeEnd.textContent = formatTime(feed.duration);
      dock.classList.add('has-track');
    } catch (e) {
      titleEl.textContent = 'error: ' + e.message;
      dock.classList.remove('has-track');
    }
  });
  unloadBtn.addEventListener('click', () => {
    _audioEl.pause();
    revokeBlobSrc();
    _audioEl.removeAttribute('src');
    _audioEl.load();
    ps.setAudioFeed(null);
    titleEl.textContent = 'load a track to start';
    statBpm.value.textContent = '—';
    statKey.value.textContent = '—'; statKey.unit.textContent = 'KEY';
    statLufs.value.textContent = '—';
    timeCurr.textContent = '0:00'; timeEnd.textContent = '0:00';
    progressFill.style.width = '0%';
    dock.classList.remove('has-track');
  });

  // Refs for the live tick (called from frame()). Envelope state for
  // each gated visual (kick / snare / hat / beat) is held here so the
  // follower has access to the previous frame's value. Fast attack +
  // slow release = stable, eye-readable pulses without visual jitter.
  _audioDock = {
    playBtn, titleEl, progressFill, timeCurr, eqBars,
    drumKick, drumSnare, drumHat, bpmCard: statBpm.root,
    envKick: 0, envSnare: 0, envHat: 0, envBeat: 0,
    // Track-wide running peak per drum stem — used to normalise the
    // drum_band envelope into [0,1]. Initial values seeded by first hits.
    peakKick: 0, peakSnare: 0, peakHat: 0,
  };
}

// "1:35" / "12:04" formatting for playhead times.
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// Per-frame tick from frame(). Reads live audio samples and pushes them
// into the dock DOM. Cheap: a feed.update + ~11 sample() calls + a few
// style writes per frame.
//
// Two real signal-processing details here:
//
//  (1) feed.update() syncs feed.currentFrame from the audio element's
//      currentTime. Without this, feed.currentFrame only advances on the
//      <audio> 'timeupdate' event, which Chrome fires at 4–15 Hz. At a
//      150 ms onset-flash decay, that's slow enough to miss most peaks
//      entirely — the dock would visibly stutter even though the data is
//      perfectly clean. We sync at 60 Hz instead.
//
//  (2) Onset / beat flashes are sub-frame impulses. The raw signal is
//      visually jittery: a kick at frame 1480 spikes to 1.0, decays to
//      ~0.15 by frame 1490, then nothing for 30+ frames until the next
//      kick. Driving a CSS opacity off that produces hard blink-blink
//      visuals. An envelope follower with FAST attack (max(raw, prev))
//      and SLOW release (prev * 0.93 per frame ≈ 230 ms tau) holds the
//      pulse long enough to read while still tracking the rising edge.
function updateAudioDockLive() {
  if (!_audioDock) return;
  const feed = ps.audioFeed;
  if (!feed || !_audioEl || !_audioEl.src) return;
  const t   = _audioEl.currentTime;
  const dur = _audioEl.duration || feed.duration || 1;
  // (1) Force feed.currentFrame to track audio playhead at render rate.
  feed.update(t);

  // Playhead + scrubber fill.
  _audioDock.progressFill.style.width = (Math.min(1, t / dur) * 100).toFixed(2) + '%';
  _audioDock.timeCurr.textContent = formatTime(t);

  // 7-band EQ heights — bands.* are raw STFT magnitudes (bass ~25, presence
  // ~1), so log-compress for visually balanced bars across the spectrum.
  const bands = ['bands.sub', 'bands.bass', 'bands.low_mid', 'bands.mid',
                 'bands.high_mid', 'bands.presence', 'bands.brilliance'];
  for (let i = 0; i < 7; i++) {
    const v = feed.sample(bands[i]) || 0;
    const h = Math.min(1, Math.log10(1 + v) / 1.5);
    _audioDock.eqBars[i].style.height = (Math.max(2, h * 100)).toFixed(1) + '%';
  }

  // (2) Drum lights drive off the precomputed `drum_band.<name>`
  // envelopes — the continuous signal you see in the dashboard's "drum
  // components" panel. Much steadier than `onsets.*.flash`, which is a
  // sparse impulse-decay train that the eye reads as on/off blink.
  // We still rectify and run an envelope follower on top: drum_band can
  // jitter by a few percent within a single drum hit, and the follower
  // smooths that out without sacrificing rising-edge precision.
  // Track-wide peaks vary (snare loud in choruses, hat quiet in verses),
  // so scale each by an auto-tracking peak so the light reads "lit at the
  // CURRENT loudness ceiling" not "lit at a hardcoded threshold".
  const REL = 0.93;             // ≈ 230 ms visual release tau
  const PK_REL = 0.9985;        // ≈ 11 s peak-tracker tau — slow enough
                                //   to be section-stable, fast enough to
                                //   adapt across tracks / live energy
  const env = (prev, raw) => Math.max(raw, prev * REL);
  const trackPeak = (prev, raw) => Math.max(raw, prev * PK_REL);
  const norm = (v, peak) => peak > 1e-3 ? Math.min(1, v / peak) : 0;

  const kickRaw  = feed.sample('drum_band.kick')  || 0;
  const snareRaw = feed.sample('drum_band.snare') || 0;
  const hatRaw   = feed.sample('drum_band.hat')   || 0;
  _audioDock.peakKick  = trackPeak(_audioDock.peakKick,  kickRaw);
  _audioDock.peakSnare = trackPeak(_audioDock.peakSnare, snareRaw);
  _audioDock.peakHat   = trackPeak(_audioDock.peakHat,   hatRaw);

  _audioDock.envKick  = env(_audioDock.envKick,  norm(kickRaw,  _audioDock.peakKick));
  _audioDock.envSnare = env(_audioDock.envSnare, norm(snareRaw, _audioDock.peakSnare));
  _audioDock.envHat   = env(_audioDock.envHat,   norm(hatRaw,   _audioDock.peakHat));
  _audioDock.envBeat  = env(_audioDock.envBeat,  feed.sample('beat.flash') || 0);

  _audioDock.drumKick.style.setProperty('--lit',  _audioDock.envKick.toFixed(3));
  _audioDock.drumSnare.style.setProperty('--lit', _audioDock.envSnare.toFixed(3));
  _audioDock.drumHat.style.setProperty('--lit',   _audioDock.envHat.toFixed(3));
  _audioDock.bpmCard.style.setProperty('--beat',  _audioDock.envBeat.toFixed(3));
}

function renderEmitterTab(host, emitter) {
  if (!emitter) return;
  // Header
  host.appendChild(emitterHeader(emitter));

  const c = emitter.config;

  // ─── 01 / SPAWN ─── (sampled once when a particle is born)
  // Split into 5 sections, each one focused on a single concern, instead
  // of three overloaded buckets that mix "where", "when", "how fast" and
  // "what does it look like".
  //
  //   Trigger     → when to fire (rate, bursts, incoming sub-emits)
  //   Position    → where to spawn (origin offset + spawn shape)
  //   Velocity    → initial motion (direction + speed) — direction sits
  //                 next to speed because they describe the same thing
  //   Lifetime    → how long each particle lives
  //   Appearance  → initial visuals (size, rotation, color)

  // Trigger — three independent spawn sources, visually separated so the
  // user can see at a glance which modes are active. Any source at zero /
  // empty is dormant; the summary above states which are firing.
  const triggerRows = [
    triggerModeSummary(emitter),
    el('div', { class: 'sub-divider', html: 'continuous spawn rate' }),
    rowSlider('rate /s', c, 'rate', 0, 5000, 1),
    el('div', { class: 'sub-divider', html: 'timed bursts — fire at fixed times' }),
    burstsEditor(emitter),
    el('div', { class: 'sub-divider', html: 'audio triggers — fire on rising edge of a source' }),
    triggersEditor(emitter),
  ];
  const incomingRows = incomingSpawnRows(emitter);
  if (incomingRows && incomingRows.length) {
    triggerRows.push(el('div', {
      class: 'incoming-head',
      title: 'other emitters whose emit.* modules spawn particles into this one — click any row to jump to that emitter',
      html: 'spawned externally by',
    }));
    for (const r of incomingRows) triggerRows.push(r);
  }

  // Position — origin + shape together (both describe "where particles appear")
  const positionRows = [
    vec3Row('origin', c.position, -25, 25, 0.1),
    el('div', { class: 'sub-divider', html: 'spawn shape — ' + c.shape.type }),
    shapeEditor(emitter),
  ];

  // Velocity — direction + speed (both describe "how particles move at birth")
  const velocityRows = [
    directionEditor(c.initial),
    rangeOrScalar('speed', c.initial, 'speed', 0, 50, 0.1),
  ];

  // Lifetime — its own section so it's not buried under appearance
  const lifetimeRows = [
    rangeOrScalar('lifetime', c.initial, 'lifetime', 0.05, 30, 0.05),
  ];

  // Appearance — all initial visual properties
  const appearanceRows = [
    rangeOrScalar('size',     c.initial, 'size',            0.01, 5,           0.01),
    rangeOrScalar('rotation', c.initial, 'rotation',        0,    Math.PI * 2, 0.01),
    rangeOrScalar('ang.vel',  c.initial, 'angularVelocity', -10,  10,          0.05),
    c.initial.color ? staticColorRow('color', c.initial, 'color') : null,
    blendModeRow(ps),
  ];

  host.appendChild(phaseBlock('01', 'spawn', 'evaluated once at birth', [
    section('Trigger',    triggerRows),
    section('Position',   positionRows),
    section('Velocity',   velocityRows),
    section('Lifetime',   lifetimeRows),
    section('Appearance', appearanceRows),
  ]));

  // ─── 02 / UPDATE ─── (per-frame modules acting on existing particles)
  // Modules grouped by category so a long list (forces + colour rules + audio
  // sugar + emit triggers) reads as a small set of focused buckets instead of
  // one undifferentiated stack.
  host.appendChild(phaseBlock('02', 'update', 'evaluated every frame',
    renderModuleSections(emitter)));
}

// Group an emitter's modules by category prefix and render each non-empty
// category as its own collapsible section. The "+ ADD MODULE" affordance
// sits at the bottom in its own row so it's reachable regardless of state.
const _MODULE_CAT_LABELS = {
  force:      'Forces',
  set:        'Set (replace)',
  mul:        'Multiply',
  add:        'Add',
  constraint: 'Constraint',
  emit:       'Emit triggers',
  audio:      'Audio sugar',
};
const _MODULE_CAT_ORDER = ['force', 'set', 'mul', 'add', 'constraint', 'emit', 'audio', 'other'];
function renderModuleSections(emitter) {
  const mods = emitter.config.modules || [];
  // Bucket by category prefix of moduleName ("force.gravity" → "force").
  const groups = {};
  mods.forEach((m, i) => {
    const name = m.moduleName || 'other';
    const cat  = name.split('.')[0];
    const key  = _MODULE_CAT_LABELS[cat] ? cat : 'other';
    (groups[key] ||= []).push({ m, i });
  });
  const out = [];
  for (const cat of _MODULE_CAT_ORDER) {
    const items = groups[cat];
    if (!items || items.length === 0) continue;
    const label = _MODULE_CAT_LABELS[cat] || 'Other';
    out.push(section(`${label} (${items.length})`,
      items.map(({ m, i }) => moduleCard(emitter, m, i))));
  }
  if (out.length === 0) {
    out.push(el('div', { class: 'modules-empty', html: 'no modules — particles will fall under physics defaults only' }));
  }
  out.push(el('div', { id: 'addBtn', html: '+ ADD MODULE',
    onclick: () => openPicker(emitter) }));
  return out;
}

// Phase block: header + collapsible body. Persists open/closed per emitter
// in localStorage (so toggling 'sparks' doesn't change 'ambient').
function phaseBlock(num, name, subtitle, contents) {
  const id = 'phase-em' + panelState.active.idx + '-' + num + '-' + name;
  const collapsed = getCollapsed(id);
  const wrap = el('div', { class: 'phase-block' + (collapsed ? ' collapsed' : '') });
  const head = phaseDivider(num, name, subtitle);
  head.addEventListener('click', () => {
    const willCollapse = !wrap.classList.contains('collapsed');
    wrap.classList.toggle('collapsed', willCollapse);
    setCollapsedSt(id, willCollapse);
  });
  const body = el('div', { class: 'phase-body' });
  for (const c of contents) if (c) body.appendChild(c);
  wrap.appendChild(head);
  wrap.appendChild(body);
  return wrap;
}

function emitterHeader(emitter) {
  const c = emitter.config.initial?.color || [1, 0.5, 0.1, 1];
  const idx = ps.emitters.indexOf(emitter);
  const isDisabled = !!emitter.config.disabled;
  const head = el('header', {
    class: 'em-head' + (isDisabled ? ' disabled' : ''),
    style: { '--c': rgbCss(c) },
  });
  head.appendChild(el('div', { class: 'em-color' }));
  head.appendChild(el('input', {
    class: 'em-name',
    value: emitter.config.name || ('em_' + idx),
    onchange: (e) => { emitter.config.name = e.target.value; renderTabs(); },
  }));
  head.appendChild(el('span', { class: 'em-stats', html: `<b>${countAlive(idx)}</b> ALIVE` }));
  head.appendChild(el('button', {
    class: 'em-power',
    title: isDisabled ? 'enable emitter' : 'disable emitter',
    onclick: () => {

}
function deleteEmitter(idx) {
  if (ps.emitters.length <= 1) return;
  const removed = ps.emitters[idx];
  ps.emitters.splice(idx, 1);
  panelState.selectedIdx.delete(removed);
  // Re-id remaining emitters and re-tag their particles.
  for (let i = 0; i < ps.emitters.length; i++) ps.emitters[i].id = i;
  if (ps.emitterId) {
    for (let i = 0; i < ps.alive; i++) {
      if (ps.emitterId[i] >= ps.emitters.length) ps.emitterId[i] = 0;
    }
  }
  panelState.active = { type: 'em', idx: 0 };
  buildPanel();
}

// Multi-emitter header — drawn when 2+ emitters selected. Mirrors emitterHeader
// shape (color swatch, name, ON/OFF, ✕) but reads/writes across the selection.
function emittersHeader(emitters) {
  const colors = emitters.slice(0, 6).map(e => rgbCss(e.config.initial?.color || [1,0.5,0.1,1]));
  const head = el('header', { class: 'em-head em-head-multi' });

function bulkDeleteEmitters(emitters) {
  // Preserve at least one emitter overall (matches single deleteEmitter).
  let toDelete = emitters.slice();
  if (ps.emitters.length - toDelete.length < 1) {
    toDelete = toDelete.slice(0, ps.emitters.length - 1);
  }
  if (!toDelete.length) return;
  for (const em of toDelete) {
    const i = ps.emitters.indexOf(em);
    if (i < 0) continue;
    ps.emitters.splice(i, 1);
    panelState.selectedIdx.delete(em);
  }
  for (let i = 0; i < ps.emitters.length; i++) ps.emitters[i].id = i;
  if (ps.emitterId) {
    for (let i = 0; i < ps.alive; i++) {
      if (ps.emitterId[i] >= ps.emitters.length) ps.emitterId[i] = 0;
    }
  }
  panelState.active = { type: 'em', idx: 0 };
  buildPanel();
}

// ─── Phase B: bulk-edit views ────────────────────────────────────────────────
// `bv(emitters, getter, setter)` is the read/write/mixed abstraction over a
// selection. Bulk row helpers below mirror the single-emitter row helpers but
// render `???` placeholders when values diverge across the selection.

const _MIXED = Symbol('mixed');

function _eq(a, b) {
  if (a === b) return true;
  if (a == null || b == null) return false;
  if (typeof a !== typeof b) return false;
  if (typeof a !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (!_eq(a[i], b[i])) return false;
    return true;
  }
  // Special-case Curve/Gradient: compare on `keys` array.
  if (a && b && Array.isArray(a.keys) && Array.isArray(b.keys)) return _eq(a.keys, b.keys);
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (const k of ka) if (!_eq(a[k], b[k])) return false;
  return true;
}

function bv(emitters, getter, setter) {
  return {
    read() {
      let v;
      for (let i = 0; i < emitters.length; i++) {
        const cur = getter(emitters[i]);
        if (i === 0) v = cur;
        else if (!_eq(v, cur)) return _MIXED;
      }
      return v;
    },
    write(val) { for (const e of emitters) setter(e, val); },
    mixed() { return this.read() === _MIXED; },
  };
}

function bulkRowSlider(label, view, min, max, step) {
  const v0 = view.read();
  if (v0 === _MIXED) {
    const inp = el('input', {
      type: 'text', class: 'v v-input row-mixed-input',
      value: '???', placeholder: '???',
      style: { 'font-style': 'italic', 'opacity': '0.55' },
    });
    inp.addEventListener('focus', () => { inp.value = ''; inp.style.removeProperty('font-style'); inp.style.removeProperty('opacity'); });
    inp.addEventListener('blur',  () => { if (inp.value === '') { inp.value = '???'; inp.style.fontStyle = 'italic'; inp.style.opacity = '0.55'; } });
    inp.addEventListener('change', () => {
      const n = parseFloat(inp.value.replace(',', '.'));
      if (!isFinite(n)) return;
      const f = step >= 1 ? Math.round(Math.max(min, n)) : Math.max(min, n);
      view.write(f);
      buildPanel();
    });
    return el('div', { class: 'row' }, [el('label', { html: label }), inp, el('span', { html: 'mixed', style: { 'font-size': '9px', opacity: '0.5' } })]);
  }
  const inp = el('input', { type: 'range', min, max, step, value: v0 });
  const get = () => view.read(), set = (v) => view.write(v);
  const valEl = makeValueInput(get, set, inp, min, max, step);
  inp.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    const f = step >= 1 ? Math.round(v) : v;
    view.write(f);
    valEl.value = fmt(f, step);
  });
  return el('div', { class: 'row' }, [el('label', { html: label }), inp, valEl]);
}

function bulkRowToggle(label, view) {
  const v0 = view.read();
  const cb = el('input', { type: 'checkbox' });
  if (v0 === _MIXED) cb.indeterminate = true;
  else cb.checked = !!v0;
  cb.addEventListener('input', () => { view.write(cb.checked); buildPanel(); });
  return el('div', { class: 'row' }, [el('label', { html: label }), cb, el('span')]);
}

function bulkRowEnum(label, view, options) {
  const v0 = view.read();
  const sel = el('select', { onchange: (e) => { view.write(e.target.value); } });
  if (v0 === _MIXED) sel.appendChild(el('option', { value: '', html: '??? (mixed)' }));
  for (const o of options) {
    const opt = el('option', { value: o, html: o });
    if (o === v0) opt.selected = true;
    sel.appendChild(opt);
  }
  return el('div', { class: 'row' }, [el('label', { html: label }), sel, el('span')]);
}

function bulkVec3Row(label, emitters, getArr, min, max, step) {
  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'row' }, [el('label', { html: label }), el('span'), el('span')]));
  for (let i = 0; i < 3; i++) {
    const axis = ['x', 'y', 'z'][i];
    const v = bv(emitters, e => getArr(e)[i], (e, val) => { getArr(e)[i] = val; });
    wrap.appendChild(bulkRowSlider(axis, v, min, max, step));
  }
  return wrap;
}

// "Mixed across selection" placeholder for non-trivially-bulkable rows
// (curves, gradients, ranges, complex objects). Provides an "overwrite all"
// affordance that copies the anchor emitter's value into every selected one.
function bulkMixedRow(label, anchor, emitters, getter, copyValue) {
  const wrap = el('div', { class: 'row' });
  wrap.appendChild(el('label', { html: label }));
  wrap.appendChild(el('span', { html: 'differs across selection', style: { 'font-size': '11px', opacity: '0.55', flex: '1' } }));
  wrap.appendChild(el('button', {
    class: 'rng-toggle',
    title: `copy ${anchor.config.name || 'anchor'}'s value to all selected`,
    html: 'overwrite all',
    onclick: () => {
      const src = getter(anchor);
      for (const e of emitters) if (e !== anchor) copyValue(e, src);
      buildPanel();
    },
  }));
  return wrap;
}

// Module intersection: names where every selected emitter has exactly one
// instance of that moduleName. Returns array of { name, modulesByEmitter[] }.
function intersectModules(emitters) {
  if (!emitters.length) return [];
  const counts = new Map();
  for (const e of emitters) {
    const seen = new Map();
    for (const m of (e.config.modules || [])) {
      const n = m.moduleName;
      if (!n) continue;
      seen.set(n, (seen.get(n) || 0) + 1);
    }
    for (const [n, c] of seen) {
      if (!counts.has(n)) counts.set(n, []);
      counts.get(n).push(c);
    }
  }
  const out = [];
  for (const [name, cs] of counts) {
    if (cs.length !== emitters.length) continue;          // missing on some
    if (!cs.every(c => c === 1)) continue;                // multiple on some
    const mods = emitters.map(e => e.config.modules.find(m => m.moduleName === name));
    out.push({ name, modules: mods });
  }
  return out;
}

// Bulk module card: float / bool / enum params edited via bulkView; curves /
// gradients fall back to "differs / overwrite all" or render the anchor's
// editor when all keys match.
function bulkModuleCard(emitters, name, mods) {
  const c = emitters[0].config.initial?.color || [1, 0.5, 0.1, 1];
  const collapseKey = 'em*/' + name;
  const collapsed = !!panelState.modOpen[collapseKey + '_closed'];
  const wrap = el('div', { class: 'mod' + (collapsed ? ' collapsed' : ''), style: { '--c': rgbCss(c) } });
  const ns = name.includes('.') ? name.split('.')[0] + '.' : '';
  const tail = name.slice(ns.length);
  const head = el('div', { class: 'mod-head', onclick: (e) => {
    if (e.target.classList && (e.target.classList.contains('del') || e.target.classList.contains('pip'))) return;
    panelState.modOpen[collapseKey + '_closed'] = !panelState.modOpen[collapseKey + '_closed'];
    wrap.classList.toggle('collapsed');
  } }, [
    el('span', { class: 'pip', title: 'toggle disabled across selection',
      onclick: (ev) => {
        ev.stopPropagation();
        const allOff = mods.every(m => m.disabled);
        for (const m of mods) m.disabled = !allOff;
        buildPanel();
      },
    }),
    el('span', { class: 'mod-chev' }, ['▾']),
    el('span', { class: 'name', html: '<span class="ns">' + ns + '</span>' + tail }),
    el('span', { class: 'kind' }, [`× ${emitters.length}`]),
    el('span', { class: 'del', html: '✕', onclick: () => {
      // Remove this moduleName from every selected emitter.
      for (const e of emitters) {
        const i = e.config.modules.findIndex(m => m.moduleName === name);
        if (i >= 0) e.config.modules.splice(i, 1);
      }
      buildPanel();
    } }),
  ]);
  wrap.appendChild(head);
  const body = el('div', { class: 'mod-body' });
  const schema = mods[0].schema;
  if (!schema) {
    body.appendChild(el('div', { style: { color: 'rgba(240,235,224,0.30)', fontSize: '9px' }, html: 'opaque function module — no editable params' }));
  } else {
    for (const [pkey, def] of Object.entries(schema)) {
      if (def.type === 'float') {
        const view = bv(mods, m => m.params[pkey], (m, v) => { m.params[pkey] = v; });
        // float can be a Bound (object with .source) or a plain number;
        // bulk editing is only sane on the plain-number path. If any
        // emitter has the param bound, treat it as mixed and offer
        // overwrite-all from the anchor.
        const anyBound = mods.some(m => m.params[pkey] && typeof m.params[pkey] === 'object' && 'source' in m.params[pkey]);
        if (anyBound) {
          body.appendChild(bulkMixedRow(pkey, emitters[0], emitters, e => e.config.modules.find(m => m.moduleName === name).params[pkey], (e, src) => {
            const m = e.config.modules.find(mm => mm.moduleName === name);
            m.params[pkey] = (src && typeof src === 'object') ? JSON.parse(JSON.stringify(src)) : src;
          }));
        } else {
          body.appendChild(bulkRowSlider(pkey, view, def.min, def.max, def.step));
        }
      } else if (def.type === 'enum') {
        body.appendChild(bulkRowEnum(pkey, bv(mods, m => m.params[pkey], (m, v) => { m.params[pkey] = v; }), def.options));
      } else if (def.type === 'curve' || def.type === 'gradient') {
        body.appendChild(bulkMixedRow(pkey, emitters[0], emitters, e => e.config.modules.find(m => m.moduleName === name).params[pkey], (e, src) => {
          const m = e.config.modules.find(mm => mm.moduleName === name);
          if (src && Array.isArray(src.keys)) {
            // clone keys; m.params[pkey] is a Curve/Gradient instance
            const cloned = JSON.parse(JSON.stringify(src.keys));
            if (m.params[pkey] && typeof m.params[pkey].update === 'function') m.params[pkey].update(cloned);
            else m.params[pkey] = src;
          } else {
            m.params[pkey] = src;
          }
        }));
      } else {
        body.appendChild(el('div', { class: 'row' }, [el('label', { html: pkey }), el('span', { html: 'unsupported in bulk', style: { opacity: '0.5' } }), el('span')]));
      }
    }
  }
  wrap.appendChild(body);
  return wrap;
}

function renderEmittersTab(host, emitters) {
  host.appendChild(emittersHeader(emitters));

  // ─── 01 / SPAWN ───
  // Trigger
  const rateView = bv(emitters, e => e.config.rate, (e, v) => { e.config.rate = v; });
  const anyRateBound = emitters.some(e => e.config.rate && typeof e.config.rate === 'object' && 'source' in e.config.rate);
  const triggerRows = [
    el('div', { class: 'sub-divider', html: 'continuous spawn rate' }),
    anyRateBound
      ? bulkMixedRow('rate /s', emitters[0], emitters, e => e.config.rate, (e, src) => { e.config.rate = (src && typeof src === 'object') ? JSON.parse(JSON.stringify(src)) : src; })
      : bulkRowSlider('rate /s', rateView, 0, 5000, 1),
    el('div', { class: 'sub-divider', html: 'timed bursts' }),
    el('div', { class: 'row' }, [
      el('span', { html: 'edit per emitter — bulk burst editing not supported in v1', style: { opacity: '0.55', 'font-size': '11px' } }),
    ]),
    el('div', { class: 'sub-divider', html: 'audio triggers' }),
    el('div', { class: 'row' }, [
      el('span', { html: 'edit per emitter — bulk trigger editing not supported in v1', style: { opacity: '0.55', 'font-size': '11px' } }),
    ]),
  ];

  // Position — origin + shape (shape edited per-emitter; only origin is bulkable)
  const positionRows = [
    bulkVec3Row('origin', emitters, e => e.config.position, -25, 25, 0.1),
    el('div', { class: 'row' }, [
      el('span', { html: 'spawn shape — edit per emitter (Ctrl-click to drop down to single)', style: { opacity: '0.55', 'font-size': '11px' } }),
    ]),
  ];

  // Velocity (speed only — direction is structural)
  const velRows = [
    bulkRowSlider('speed', bv(emitters, e => {
      const s = e.config.initial?.speed;
      return (typeof s === 'object' && s) ? (s.min + s.max) / 2 : s;
    }, (e, v) => { if (e.config.initial) e.config.initial.speed = v; }), 0, 50, 0.1),
    el('div', { class: 'row' }, [
      el('span', { html: 'direction — edit per emitter', style: { opacity: '0.55', 'font-size': '11px' } }),
    ]),
  ];

  // Lifetime
  const lifeRows = [
    bulkRowSlider('lifetime', bv(emitters, e => {
      const l = e.config.initial?.lifetime;
      return (typeof l === 'object' && l) ? (l.min + l.max) / 2 : l;
    }, (e, v) => { if (e.config.initial) e.config.initial.lifetime = v; }), 0.05, 30, 0.05),
  ];

  // Appearance
  const appearanceRows = [
    bulkRowSlider('size', bv(emitters, e => {
      const s = e.config.initial?.size;
      return (typeof s === 'object' && s) ? (s.min + s.max) / 2 : s;
    }, (e, v) => { if (e.config.initial) e.config.initial.size = v; }), 0.01, 5, 0.01),
    bulkRowSlider('rotation', bv(emitters, e => {
      const r = e.config.initial?.rotation;
      return (typeof r === 'object' && r) ? (r.min + r.max) / 2 : r;
    }, (e, v) => { if (e.config.initial) e.config.initial.rotation = v; }), 0, Math.PI * 2, 0.01),
    bulkRowSlider('ang.vel', bv(emitters, e => {
      const a = e.config.initial?.angularVelocity;
      return (typeof a === 'object' && a) ? (a.min + a.max) / 2 : a;
    }, (e, v) => { if (e.config.initial) e.config.initial.angularVelocity = v; }), -10, 10, 0.05),
    bulkMixedRow('color', emitters[0], emitters, e => e.config.initial?.color, (e, src) => { if (e.config.initial && Array.isArray(src)) e.config.initial.color = src.slice(); }),
    blendModeRow(ps),
  ];

  host.appendChild(phaseBlock('01', 'spawn', `bulk edit · ${emitters.length} emitters`, [
    section('Trigger',    triggerRows),
    section('Position',   positionRows),
    section('Velocity',   velRows),
    section('Lifetime',   lifeRows),
    section('Appearance', appearanceRows),
  ]));

  // ─── 02 / UPDATE ─── module intersection
  const inter = intersectModules(emitters);
  const groups = {};
  for (const { name, modules } of inter) {
    const cat = name.split('.')[0];
    const key = _MODULE_CAT_LABELS[cat] ? cat : 'other';
    (groups[key] ||= []).push({ name, modules });
  }
  const modContent = [];
  for (const cat of _MODULE_CAT_ORDER) {
    const items = groups[cat];
    if (!items || items.length === 0) continue;
    const label = _MODULE_CAT_LABELS[cat] || 'Other';
    modContent.push(section(`${label} (${items.length})`,
      items.map(({ name, modules }) => bulkModuleCard(emitters, name, modules))));
  }
  if (modContent.length === 0) {
    modContent.push(el('div', { class: 'modules-empty', html: 'no modules common to every selected emitter' }));
  }
  modContent.push(el('div', { id: 'addBtn', html: '+ ADD MODULE',
    onclick: () => openPickerBulk(emitters) }));
  host.appendChild(phaseBlock('02', 'update', `intersection · ${inter.length} common modules`, modContent));
}

// Module card with header + collapsible body. Click anywhere on the head
// (except the × delete) to toggle. Body shows the module's schema-driven
// param editors + curve/gradient pickers when applicable.
function moduleCard(emitter, m, idx) {
  const c = emitter.config.initial?.color || [1, 0.5, 0.1, 1];
  const key = panelState.active.idx + '/' + idx + '/' + (m.moduleName || 'fn');
  // Default state: expanded for new mods, but collapsed if user toggled off.
  const collapsed = !!panelState.modOpen[key + '_closed'];
  const isDisabled = !!m.disabled;
  const wrap = el('div', {
    class: 'mod' + (collapsed ? ' collapsed' : '') + (isDisabled ? ' disabled' : ''),
    style: { '--c': rgbCss(c) },
  });
  const ns = (m.moduleName || '').includes('.')
    ? m.moduleName.split('.')[0] + '.'
    : '';
  const tail = (m.moduleName || 'fn').slice(ns.length);
  const head = el('div', { class: 'mod-head', onclick: (e) => {
    // The pip and del buttons own their own clicks.
    if (e.target.classList && (e.target.classList.contains('del') || e.target.classList.contains('pip'))) return;
    panelState.modOpen[key + '_closed'] = !panelState.modOpen[key + '_closed'];
    wrap.classList.toggle('collapsed');
  } }, [
    // enable/disable pip (filled = enabled, hollow = disabled)
    el('span', {
      class: 'pip',
      title: isDisabled ? 'enable module' : 'disable module',
      onclick: (e) => {
        e.stopPropagation();
        m.disabled = !m.disabled;
        wrap.classList.toggle('disabled', !!m.disabled);
        // Also recolor: the filled state of the pip is driven by .disabled.
      },
    }),
    el('span', { class: 'mod-chev' }, ['▾']),
    el('span', { class: 'name', html: '<span class="ns">' + ns + '</span>' + tail }),
    el('span', { class: 'kind' }, [m.kind || 'fn']),
    el('span', { class: 'del', html: '✕', onclick: () => {
      const i = emitter.config.modules.indexOf(m);
      if (i >= 0) emitter.config.modules.splice(i, 1);
      buildPanel();
    } }),
  ]);
  wrap.appendChild(head);
  // Body
  const body = el('div', { class: 'mod-body' });
  if (!m.schema) {
    body.appendChild(el('div', { style: { color: 'rgba(240,235,224,0.30)', fontSize: '9px' }, html: 'opaque function module — no editable params' }));
  } else {
    for (const [pkey, def] of Object.entries(m.schema)) {
      body.appendChild(rowFromSchema(pkey, def, m.params));
      // Curve/Gradient pickers attach below the row when relevant
      if (def.type === 'curve' && m.params[pkey] instanceof Curve) {
        body.appendChild(curvePicker(m.params, pkey));
      } else if (def.type === 'gradient' && m.params[pkey] instanceof Gradient) {
        body.appendChild(gradientPicker(m.params, pkey));
      } else if ((def.type === 'curve' || def.type === 'gradient') && isSourceBinding(m.params[pkey])) {
        const pill = el('div', { class: 'bound-pill', html: '<span class="src">' + m.params[pkey].source + '</span>' });
        pill.addEventListener('click', () => openSourcePicker(m.params, pkey, pill));
        body.appendChild(el('div', { class: 'row' }, [el('label', { html: pkey }), pill, el('span')]));
      }
    }
    if (m.params.curve && !m.schema.curve)    body.appendChild(curvePicker(m.params, 'curve'));
    if (m.params.gradient && !m.schema.gradient) body.appendChild(gradientPicker(m.params, 'gradient'));
  }
  wrap.appendChild(body);
  return wrap;
}

// Back-compat wrappers — older code calls these names.
function emitterBlock(emitter) { const w = el('div'); renderEmitterTab(w, emitter); return w; }

// ---------------------------- Emitter spawn-settings UI -----------------------

function emitterSettings(emitter) {

// Direction override editor — lets the user set the velocity direction
// independently from the spawn shape. Modes:
//   shape    use the spawn shape's outDir (default)
//   outward  radial unit vector from local origin to spawn position
//   inward   opposite of outward
//   vector   fixed [x,y,z] direction
//   cone     uniform random direction within a half-angle around an axis
function directionEditor(initial) {
  const wrap = el('div', { class: 'dir-editor' });
  const d = initial.direction;
  let mode;
  if (!d || d === 'shape')                        mode = 'shape';
  else if (d === 'outward' || d === 'inward')     mode = d;
  else if (Array.isArray(d) && d.length >= 3)     mode = 'vector';
  else if (d && typeof d === 'object' && d.axis)  mode = 'cone';
  else                                            mode = 'shape';

  const sel = el('select');
  for (const m of ['shape', 'outward', 'inward', 'vector', 'cone']) {
    const opt = el('option', { value: m, html: m });
    if (m === mode) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => {
    const m = sel.value;
    if (m === 'shape')        delete initial.direction;
    else if (m === 'outward' || m === 'inward') initial.direction = m;
    else if (m === 'vector')  initial.direction = [0, 1, 0];
    else if (m === 'cone')    initial.direction = { axis: [0, 1, 0], halfAngle: 0.5 };
    buildPanel();
  });
  wrap.appendChild(el('div', { class: 'row' }, [
    el('label', { html: 'direction' }), sel, el('span'),
  ]));

  if (mode === 'vector') {
    wrap.appendChild(vec3Row('vec', initial.direction, -1, 1, 0.01));
  } else if (mode === 'cone') {
    wrap.appendChild(vec3Row('axis', initial.direction.axis, -1, 1, 0.01));
    wrap.appendChild(rowSliderObj('halfAngle', initial.direction, 'halfAngle', 0, Math.PI, 0.01));
  } else if (mode === 'outward' || mode === 'inward') {
    wrap.appendChild(el('div', {
      class: 'dir-hint',
      html: mode === 'outward'
        ? 'velocity = unit(spawn position) — points away from local origin'
        : 'velocity = -unit(spawn position) — points toward local origin',
    }));
  } else {
    wrap.appendChild(el('div', {
      class: 'dir-hint',
      html: 'using spawn-shape direction (e.g. cone → +Y, sphere → radial, ring → outward in XZ)',
    }));
  }
  return wrap;
}

// Scans every OTHER emitter's modules for emit.* triggers that target
// this emitter, so the inspector can show "← from ring_inner on kick onset"
// instead of the user having to grep through every other emitter to figure
// out why a rate-0 emitter is producing particles.
function incomingSpawnRows(emitter) {
  const myName = emitter.config.name;
  if (!myName) return [];
  const rows = [];
  ps.emitters.forEach((other, otherIdx) => {
    if (other === emitter) return;
    for (const m of (other.config.modules || [])) {
      if (m.kind !== 'emit' || !m.params || m.params.target !== myName) continue;
      const p = m.params;
      const trigger = (p.source || 'audio.beat.flash').replace(/^audio\./, '');
      let countTxt;
      if (p.count !== null && typeof p.count === 'object' && 'source' in p.count) {
        const sc = p.count.scale !== undefined ? p.count.scale : 1;
        const off = p.count.offset !== undefined ? p.count.offset : 0;
        countTxt = `${p.count.source.replace(/^audio\./, '')}×${sc}` + (off ? `+${off}` : '');
      } else {
        countTxt = '×' + p.count;
      }
      const row = el('div', {
        class: 'incoming-row',
        title: 'click to jump to ' + (other.config.name || 'em_' + otherIdx),
      });
      row.innerHTML =
        `<span class="inc-from">← ${other.config.name || 'em_' + otherIdx}</span>` +
        `<span class="inc-trigger">${trigger}</span>` +
        `<span class="inc-count">${countTxt}</span>`;
      row.addEventListener('click', () => {
        panelState.active = { type: 'em', idx: otherIdx };
        buildPanel();
      });
      rows.push(row);
    }
  });
  return rows;
}

function vec3Row(label, arr, min, max, step) {
  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'row' }, [
    el('label', { html: label }), el('span'), el('span'),
  ]));
  for (let i = 0; i < 3; i++) {
    const axis = ['x', 'y', 'z'][i];
    wrap.appendChild(rowSliderArr(axis, arr, i, min, max, step));
  }
  return wrap;
}
// Editable value cell. Click → type a number → Enter / blur to commit. Esc
// reverts. Stays in sync with the slider in both directions.
// Round v up to the next "nice" tick (1, 2, 5 × 10^n) for slider headroom.
function niceCeil(v) {
  if (!isFinite(v) || v <= 0) return 0;
  const e = Math.floor(Math.log10(v));
  const m = v / Math.pow(10, e);
  const nice = m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10;
  return nice * Math.pow(10, e);
}

function makeValueInput(getValue, setValue, slider, min, max, step) {
  const inp = el('input', {
    type: 'text', class: 'v v-input', spellcheck: 'false',
    inputmode: 'decimal', value: fmt(getValue(), step),
  });
  inp.addEventListener('focus', () => inp.select());
  inp.addEventListener('change', () => {
    const v = parseFloat(inp.value.replace(',', '.'));
    if (!isFinite(v)) { inp.value = fmt(getValue(), step); return; }
    // No upper clamp via the number input — the slider's `max` attribute
    // is just a coarse-handle range, not a value ceiling. Type any number
    // and the slider's max grows to fit (rounded to a nice 1/2/5 × 10^n
    // tick). Keeps the lower bound (e.g. rate≥0) intact.
    const floored = Math.max(min, v);
    setValue(step >= 1 ? Math.round(floored) : floored);
    inp.value = fmt(getValue(), step);
    if (slider) {
      const sliderMax = parseFloat(slider.max);
      if (isFinite(sliderMax) && floored > sliderMax) {
        slider.max = niceCeil(floored);
      }
      slider.value = getValue();
    }
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter')  inp.blur();
    if (e.key === 'Escape') { inp.value = fmt(getValue(), step); inp.blur(); }
  });
  return inp;
}
function rowSliderArr(label, arr, idx, min, max, step) {
  const get = () => arr[idx], set = (v) => { arr[idx] = v; };
  const inp = el('input', { type: 'range', min, max, step, value: arr[idx] });
  const valEl = makeValueInput(get, set, inp, min, max, step);
  inp.addEventListener('input', (e) => {
    arr[idx] = parseFloat(e.target.value);
    valEl.value = fmt(arr[idx], step);
  });
  return el('div', { class: 'row' }, [el('label', { html: label }), inp, valEl]);
}

// Renders a single slider for a scalar OR two sliders (min/max) for a range.
// Tracks the original kind so editing preserves range vs scalar.
function rangeOrScalar(label, target, key, min, max, step) {
  const wrap = el('div');
  const initial = target[key];
  const isRange = initial && typeof initial === 'object' && 'min' in initial && 'max' in initial;
  // Header + toggle to convert between scalar and range
  const tgl = el('button', {
    class: 'rng-toggle',
    title: isRange ? 'switch to single value' : 'switch to range',
    html: isRange ? 'range' : 'fixed',
    onclick: () => {
      if (isRange) {
        target[key] = (initial.min + initial.max) / 2;
      } else {
        const v = target[key];
        target[key] = { min: v * 0.7, max: v * 1.3 };
      }
      buildPanel();
    },
  });
  wrap.appendChild(el('div', { class: 'row' }, [
    el('label', { html: label }), tgl, el('span'),
  ]));
  if (isRange) {
    const r = target[key];
    wrap.appendChild(rowSliderObj('min', r, 'min', min, max, step));
    wrap.appendChild(rowSliderObj('max', r, 'max', min, max, step));
  } else {
    wrap.appendChild(rowSlider('value', target, key, min, max, step));
  }
  return wrap;
}
function rowSliderObj(label, obj, key, min, max, step) {
  const get = () => obj[key], set = (v) => { obj[key] = v; };
  const inp = el('input', { type: 'range', min, max, step, value: obj[key] });
  const valEl = makeValueInput(get, set, inp, min, max, step);
  inp.addEventListener('input', (e) => {
    obj[key] = parseFloat(e.target.value);
    valEl.value = fmt(obj[key], step);
  });
  return el('div', { class: 'row' }, [el('label', { html: label }), inp, valEl]);
}

// Blend mode selector — scene-level (ps.blend), one dropdown shared across all emitter panels.
function blendModeRow(ps) {
  const wrap = el('div', { class: 'row' });
  wrap.appendChild(el('label', { html: 'blend (scene)' }));
  const sel = el('select');
  for (const mode of ['additive', 'alpha-over', 'opaque']) {
    const opt = el('option', { html: mode });
    opt.value = mode;
    // Match 'alpha-over' against both 'alpha-over' and the legacy 'alphaover' spelling.
    const current = ps.blend || 'additive';
    if (mode === current || (mode === 'alpha-over' && current === 'alphaover')) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => { ps.blend = sel.value; });
  wrap.appendChild(sel);
  return wrap;
}

// Hex + intensity + alpha for a [r,g,b,a] array. RGB can exceed 1.0 for HDR.
function staticColorRow(label, target, key) {
  const wrap = el('div', { class: 'static-color' });
  const rgba = target[key];
  // Decompose: intensity = max(r,g,b) clamped >= 1; base = rgb / intensity
  let intensity = Math.max(rgba[0], rgba[1], rgba[2], 1);
  let baseR = rgba[0] / intensity, baseG = rgba[1] / intensity, baseB = rgba[2] / intensity;
  let alpha = rgba[3];

  function commit() {
    target[key][0] = baseR * intensity;
    target[key][1] = baseG * intensity;
    target[key][2] = baseB * intensity;
    target[key][3] = alpha;
    refresh();
  }
  function refresh() {
    const hex = '#' + [baseR, baseG, baseB].map(v => Math.round(Math.min(1, v) * 255).toString(16).padStart(2, '0')).join('');
    swatch.style.background = hex;
    hexEl.value = hex;
    intLab.textContent = intensity.toFixed(2);
    alphLab.textContent = alpha.toFixed(2);
  }

  // Custom color picker — clicking the swatch opens an HSV popover styled
  // to match the rest of the UI (no chunky OS dialog).
  const swatch = el('button', { class: 'color-swatch', type: 'button', title: 'click to pick color' });
  swatch.addEventListener('click', (e) => {
    e.stopPropagation();
    openColorPicker(swatch, { r: baseR, g: baseG, b: baseB }, (rgb) => {
      baseR = rgb.r; baseG = rgb.g; baseB = rgb.b;
      commit();
    });
  });
  const hexEl = el('input', { type: 'text', class: 'grad-hex', maxlength: 7, spellcheck: 'false',
    onchange: () => {
      const m = /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.exec(hexEl.value.trim());
      if (!m) return;
      let h = m[1]; if (h.length === 3) h = h.split('').map(c => c + c).join('');
      baseR = parseInt(h.slice(0,2), 16) / 255;
      baseG = parseInt(h.slice(2,4), 16) / 255;
      baseB = parseInt(h.slice(4,6), 16) / 255;
      commit();
    },
  });
  const intLab = el('span', { class: 'v' });
  const alphLab = el('span', { class: 'v' });
  const intInp = el('input', { type: 'range', min: 0, max: 10, step: 0.05, value: intensity,
    oninput: (e) => { intensity = parseFloat(e.target.value); commit(); } });
  const alphInp = el('input', { type: 'range', min: 0, max: 1, step: 0.01, value: alpha,
    oninput: (e) => { alpha = parseFloat(e.target.value); commit(); } });

  wrap.appendChild(el('div', { class: 'row' }, [el('label', { html: label }), swatch, el('span')]));
  wrap.appendChild(el('div', { class: 'row' }, [el('label', { html: 'hex' }), hexEl, el('span')]));
  wrap.appendChild(el('div', { class: 'row' }, [el('label', { html: 'intens.' }), intInp, intLab]));
  wrap.appendChild(el('div', { class: 'row' }, [el('label', { html: 'alpha' }), alphInp, alphLab]));
  refresh();
  return wrap;
}

// Render a single burst (one card with stacked rows: time / count / repeat /
// interval / delete). Stacked layout means a 7-digit count like 1,000,000
// always renders in full without column truncation.
function burstCard(emitter, b, i, refresh) {
  const card = el('div', { class: 'burst-card' });

  const labelRow = (label, control) => {
    const row = el('div', { class: 'burst-row' });
    row.appendChild(el('span', { class: 'burst-label', html: label }));
    row.appendChild(control);
    return row;
  };

  const timeInput = el('input', {
    type: 'number', step: 0.05, value: b.time ?? 0,
    oninput: (e) => {
      b.time = parseFloat(e.target.value) || 0;
      emitter._reset?.(); ps.reset();
    },
  });

  const countInput = el('input', {
    type: 'number', step: 1, min: 0, value: b.count ?? 0,
    oninput: (e) => {
      b.count = parseInt(e.target.value, 10) || 0;
      // Auto-grow the particle pool when the user types a count larger
      // than the current cap. Destructive (alive particles reset) but
      // gives the "no max" feel — type 5,000,000 and it just works.
      if (ps.setMaxParticles && b.count > ps.maxParticles) {
        ps.setMaxParticles(b.count + 1024).then(() => {
          emitter._reset?.();
          ps.reset();
        });
      }
    },
  });

  const repeatCheckbox = el('input', { type: 'checkbox' });
  repeatCheckbox.checked = !!b.repeat;

  const intervalRow = el('div', {
    class: 'burst-row',
    style: { display: b.repeat ? 'grid' : 'none' },
  });
  intervalRow.appendChild(el('span', { class: 'burst-label', html: 'interval (s)' }));
  const intervalInput = el('input', {
    type: 'number', step: 0.05, min: 0.01, value: b.interval ?? 1.0,
    oninput: (e) => {
      b.interval = parseFloat(e.target.value) || 1.0;
      emitter._reset?.(); ps.reset();
    },
  });
  intervalRow.appendChild(intervalInput);

  repeatCheckbox.addEventListener('input', () => {
    b.repeat = repeatCheckbox.checked;
    if (b.repeat && !b.interval) b.interval = 1.0;
    intervalRow.style.display = b.repeat ? 'grid' : 'none';
    emitter._reset?.(); ps.reset();
  });

  const deleteButton = el('button', {
    class: 'grad-btn', html: 'remove',
    onclick: () => {
      emitter.config.bursts.splice(i, 1);
      emitter._reset?.(); ps.reset();
      refresh();
    },
  });

  card.appendChild(labelRow('delay (s)',    timeInput));
  card.appendChild(labelRow('count',        countInput));
  card.appendChild(labelRow('repeat',       repeatCheckbox));
  card.appendChild(intervalRow);
  const actions = el('div', { class: 'burst-actions' });
  actions.appendChild(deleteButton);
  card.appendChild(actions);
  return card;
}

function burstsEditor(emitter) {
  const wrap = el('div', { class: 'bursts' });
  const list = el('div', { class: 'bursts' });
  function refresh() {
    list.innerHTML = '';
    (emitter.config.bursts || []).forEach((b, i) => {
      list.appendChild(burstCard(emitter, b, i, refresh));
    });
  }
  refresh();
  wrap.appendChild(list);
  const addButton = el('button', {
    class: 'grad-btn', html: '+ burst',
    onclick: () => {
      if (!emitter.config.bursts) emitter.config.bursts = [];
      emitter.config.bursts.push({ time: 0, count: 50 });
      refresh();
    },
  });
  wrap.appendChild(addButton);
  return wrap;
}

// Audio-driven trigger entries: each fires a burst when its source crosses
// `threshold` (rising edge). `count` is either a scalar or a Bound on a
// per-particle source like drum_band.kick. Mirrors the burst-card layout
// so the spawn-tab Trigger section reads as one consistent design.
function triggerCard(emitter, t, i, refresh) {
  const card = el('div', { class: 'burst-card' });
  const labelRow = (label, control) => {
    const row = el('div', { class: 'burst-row' });
    row.appendChild(el('span', { class: 'burst-label', html: label }));
    row.appendChild(control);
    return row;
  };

  // ── source — clickable pill, opens source picker in raw-string mode
  const sourcePill = el('span', {
    class: 'bound-pill',
    title: 'click to change source',
  });
  sourcePill.innerHTML = '<span class="src">' + (t.source || '<unset>') + '</span>';
  sourcePill.addEventListener('click', (e) => {
    e.stopPropagation();
    openSourcePicker(t, 'source', sourcePill, { writeAsString: true });
  });

  // ── threshold — gating value, free-form number input
  const thresholdInput = el('input', {
    type: 'number', step: 0.05, min: 0, value: t.threshold ?? 0.7,
    oninput: (e) => {
      const v = parseFloat(e.target.value);
      if (isFinite(v)) t.threshold = v;
    },
  });

  // ── count — scalar OR Bound. When Bound: pill + scale + offset (the trigger
  // count formula is `source * scale + offset` rounded to int).
  let countControl;
  if (t.count !== null && typeof t.count === 'object' && 'source' in t.count) {
    const countPill = el('span', { class: 'bound-pill', title: 'click to change count source' });
    countPill.innerHTML = '<span class="src">' + t.count.source + '</span>';
    countPill.addEventListener('click', (e) => {
      e.stopPropagation();
      openSourcePicker(t, 'count', countPill);
    });
    const scaleInput = el('input', {
      type: 'number', step: 'any', value: t.count.scale ?? 1, class: 'bound-scale',
      oninput: (e) => {
        const v = parseFloat(e.target.value);
        if (isFinite(v)) t.count.scale = v;
      },
    });
    const offsetInput = el('input', {
      type: 'number', step: 'any', value: t.count.offset ?? 0, class: 'bound-scale',
      oninput: (e) => {
        const v = parseFloat(e.target.value);
        if (isFinite(v)) t.count.offset = v;
      },
    });
    const unbindBtn = el('button', {
      class: 'bound-unbind', title: 'unbind count to a fixed value', html: '✕',
      onclick: (e) => {
        e.stopPropagation();
        t.count = Math.max(1, Math.round((t.count.offset || 0) + (t.count.scale || 0) * 0.5));
        refresh();
      },
    });
    countControl = el('div', { class: 'bound-editor' }, [
      countPill,
      el('span', { html: '×', class: 'bound-mul' }), scaleInput,
      el('span', { html: '+', class: 'bound-mul' }), offsetInput,
      unbindBtn,
    ]);
  } else {
    const inp = el('input', {
      type: 'number', step: 1, min: 0, value: t.count ?? 0,
      oninput: (e) => { t.count = parseInt(e.target.value, 10) || 0; },
    });
    const bindBtn = el('button', {
      class: 'bound-unbind', title: 'bind count to a source', html: '🔗',
      onclick: (e) => {
        e.stopPropagation();
        t.count = { source: 'audio.drum_band.kick', scale: 200, offset: 50 };
        refresh();
      },
    });
    countControl = el('div', { class: 'bound-editor' }, [inp, el('span'), bindBtn]);
  }

  const deleteButton = el('button', {

// One-line summary at the top of the Trigger section telling the user
// which of the three spawn sources are active. Keeps the user oriented
// when a long list of bursts/triggers/rate-bound is visible below.
function triggerModeSummary(emitter) {
  const c = emitter.config;
  const parts = [];
  // Continuous: rate is non-zero scalar OR rate is bound (always treated
  // as active since the bound value at runtime is the effective rate).
  const rate = c.rate;
  if (rate !== null && typeof rate === 'object' && 'source' in rate) {
    parts.push(`continuous (${rate.source.replace(/^audio\./, '')} × ${rate.scale ?? 1})`);
  } else if (typeof rate === 'number' && rate > 0) {
    parts.push(`continuous (${rate}/s)`);
  }
  // Bursts: count of one-shots and repeating ones separately.
  const bursts = c.bursts || [];
  if (bursts.length) {
    const reps = bursts.filter(b => b.repeat).length;
    const oneshots = bursts.length - reps;
    if (oneshots) parts.push(`${oneshots} burst${oneshots > 1 ? 's' : ''}`);
    if (reps)     parts.push(`${reps} repeating burst${reps > 1 ? 's' : ''}`);
  }
  // Audio triggers.
  const trigs = c.triggers || [];
  if (trigs.length) parts.push(`${trigs.length} audio trigger${trigs.length > 1 ? 's' : ''}`);

  const summary = parts.length === 0
    ? 'spawning: nothing — set a rate, add a burst, or add an audio trigger'
    : 'spawning: ' + parts.join(' + ');
  return el('div', { class: 'trigger-summary', html: summary });
}

  else if (h < 240) { g = x; b = c; }

    const rgb = hsvToRgb(h, s, v);

    hexInp.value = hexFromRgb(rgb.r, rgb.g, rgb.b);

      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });

    const m = /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.exec(hexInp.value.trim());
