<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff4b1f"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a51f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="750" fill="#0c0a07"/>

  <!-- title -->
  <text x="48" y="56" fill="#f0ebe0" font-size="26" letter-spacing="1">Signal pipeline</text>
  <text x="48" y="82" fill="rgba(240,235,224,0.6)" font-size="13" letter-spacing="0.5">market data &#8594; per-ticker features &#8594; calibrated model &#8594; conformal gate &#8594; sized bracket order</text>

  <!-- ticker chip row -->
  <text x="1152" y="56" fill="rgba(240,235,224,0.45)" font-size="11" text-anchor="end" letter-spacing="0.5">live universe</text>
  <text x="1152" y="74" fill="rgba(240,235,224,0.72)" font-size="11" text-anchor="end" letter-spacing="1">AAPL · AVGO · COST · GLD · LLY · NVDA · TSM · WMT · XLB · XLI · XLU</text>

  <!-- ============ ROW 1: ingest -> features -> SHAP -> scaler ============ -->
  <!-- node template: box 220x86 -->

  <!-- 1 Data ingestion -->
  <g>
    <rect x="48" y="128" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="64" y="156" fill="#f0ebe0" font-size="15">1 · Data ingestion</text>
    <text x="64" y="178" fill="rgba(240,235,224,0.65)" font-size="11">OHLCV · ^VIX ^TNX DXY QQQ</text>
    <text x="64" y="195" fill="rgba(240,235,224,0.65)" font-size="11">FRED macro &amp; credit spreads</text>
    <text x="64" y="212" fill="rgba(240,235,224,0.65)" font-size="11">Fama–French factors</text>
  </g>

  <!-- 2 Feature engineering -->
  <g>
    <rect x="328" y="128" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="344" y="156" fill="#f0ebe0" font-size="15">2 · Feature engineering</text>
    <text x="344" y="178" fill="rgba(240,235,224,0.65)" font-size="11">~51-feature base universe</text>
    <text x="344" y="195" fill="rgba(240,235,224,0.65)" font-size="11">technical · cross-asset · macro</text>
    <text x="344" y="212" fill="rgba(240,235,224,0.65)" font-size="11">multi-TF · regime · quant/IV</text>
  </g>

  <!-- 3 SHAP selection -->
  <g>
    <rect x="608" y="128" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="624" y="156" fill="#f0ebe0" font-size="15">3 · SHAP selection</text>
    <text x="624" y="178" fill="rgba(240,235,224,0.65)" font-size="11">per-ticker feature set</text>
    <text x="624" y="195" fill="rgba(240,235,224,0.65)" font-size="11">shap35 / gld_k5 / aapl_k4_iv</text>
    <text x="624" y="212" fill="rgba(240,235,224,0.65)" font-size="11">each ticker scored on its own</text>
  </g>

  <!-- 4 Scaler -->
  <g>
    <rect x="888" y="128" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="904" y="156" fill="#f0ebe0" font-size="15">4 · RobustScaler</text>
    <text x="904" y="178" fill="rgba(240,235,224,0.65)" font-size="11">scaler.pkl</text>
    <text x="904" y="195" fill="rgba(240,235,224,0.65)" font-size="11">median / IQR normalisation</text>
    <text x="904" y="212" fill="rgba(240,235,224,0.65)" font-size="11">robust to fat-tailed inputs</text>
  </g>

  <!-- row1 arrows -->
  <line x1="280" y1="174" x2="326" y2="174" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="560" y1="174" x2="606" y2="174" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="840" y1="174" x2="886" y2="174" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- wrap arrow from scaler(row1) down to ensemble(row2) -->
  <path d="M1004,220 L1004,258" stroke="#ff4b1f" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ ROW 2: ensemble -> platt -> CONFORMAL -> decision ============ -->
  <!-- (laid out right-to-left so the flow snakes back) -->

  <!-- 5 Ensemble (under scaler) -->
  <g>
    <rect x="888" y="266" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="904" y="294" fill="#f0ebe0" font-size="15">5 · Ensemble inference</text>
    <text x="904" y="316" fill="rgba(240,235,224,0.65)" font-size="11">XGBoost + LightGBM</text>
    <text x="904" y="333" fill="rgba(240,235,224,0.65)" font-size="11">(+ TabPFN for AAPL)</text>
    <text x="904" y="350" fill="rgba(240,235,224,0.65)" font-size="11">raw ensemble probability</text>
  </g>

  <!-- 6 Platt calibration -->
  <g>
    <rect x="608" y="266" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="624" y="294" fill="#f0ebe0" font-size="15">6 · Platt calibration</text>
    <text x="624" y="316" fill="rgba(240,235,224,0.65)" font-size="11">calibrator.pkl</text>
    <text x="624" y="333" fill="rgba(240,235,224,0.65)" font-size="11">score &#8594; honest probability</text>
    <text x="624" y="350" fill="rgba(240,235,224,0.65)" font-size="11">so 0.6 means 0.6</text>
  </g>

  <!-- 7 CONFORMAL REJECT — highlighted thesis node -->
  <g>
    <rect x="328" y="262" width="232" height="100" rx="6" fill="rgba(255,75,31,0.10)" stroke="#ff4b1f" stroke-width="2"/>
    <text x="344" y="290" fill="#ff4b1f" font-size="15" font-weight="bold">7 · Conformal reject</text>
    <text x="344" y="312" fill="#f0ebe0" font-size="11">abstain when the prediction</text>
    <text x="344" y="329" fill="#f0ebe0" font-size="11">set is ambiguous — no bet</text>
    <text x="344" y="349" fill="rgba(242,165,31,0.95)" font-size="11">GLD &amp; WMT gated · the thesis</text>
  </g>

  <!-- 8 Signal decision -->
  <g>
    <rect x="48" y="266" width="232" height="92" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="64" y="294" fill="#f0ebe0" font-size="15">8 · Signal decision</text>
    <text x="64" y="316" fill="rgba(240,235,224,0.65)" font-size="11">per-ticker buy thresholds</text>
    <text x="64" y="333" fill="rgba(240,235,224,0.65)" font-size="11">out-of-sample gate</text>
    <text x="64" y="350" fill="rgba(240,235,224,0.65)" font-size="11">SELL hysteresis</text>
  </g>

  <!-- row2 arrows (right to left) -->
  <line x1="886" y1="312" x2="842" y2="312" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="606" y1="312" x2="562" y2="312" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- abstain branch (off the conformal node, upward) -->
  <path d="M444,262 L444,236" stroke="#f2a51f" stroke-width="1.6" fill="none" marker-end="url(#arrow-amber)" stroke-dasharray="5 4"/>
  <text x="452" y="246" fill="#f2a51f" font-size="11">abstain &#8594; skip the trade</text>
  <!-- conformal pass-through to decision -->
  <line x1="326" y1="312" x2="282" y2="312" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- wrap arrow from decision(row2) down to sizing(row3) -->
  <path d="M164,358 L164,396" stroke="#ff4b1f" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ ROW 3: sizing -> bracket -> circuit breakers ============ -->

  <!-- 9 Position sizing -->
  <g>
    <rect x="48" y="404" width="296" height="96" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="64" y="432" fill="#f0ebe0" font-size="15">9 · Position sizing</text>
    <text x="64" y="454" fill="rgba(240,235,224,0.65)" font-size="11">1%-risk / ATR sizing</text>
    <text x="64" y="471" fill="rgba(240,235,224,0.65)" font-size="11">confidence · correlation caps</text>
    <text x="64" y="488" fill="rgba(240,235,224,0.65)" font-size="11">coherence cap across book</text>
  </g>

  <!-- 10 Bracket order -->
  <g>
    <rect x="392" y="404" width="296" height="96" rx="6" fill="#141009" stroke="rgba(240,235,224,0.20)"/>
    <text x="408" y="432" fill="#f0ebe0" font-size="15">10 · Bracket order</text>
    <text x="408" y="454" fill="rgba(240,235,224,0.65)" font-size="11">ATR stop-loss + take-profit</text>
    <text x="408" y="471" fill="rgba(240,235,224,0.65)" font-size="11">GTC · routed before the open</text>
    <text x="408" y="488" fill="rgba(240,235,224,0.65)" font-size="11">paper broker (Alpaca)</text>
  </g>

  <!-- 11 Circuit breakers -->
  <g>
    <rect x="736" y="404" width="296" height="96" rx="6" fill="#141009" stroke="rgba(242,165,31,0.45)"/>
    <text x="752" y="432" fill="#f2a51f" font-size="15">11 · Circuit breakers</text>
    <text x="752" y="454" fill="rgba(240,235,224,0.65)" font-size="11">drawdown / high-water halt</text>
    <text x="752" y="471" fill="rgba(240,235,224,0.65)" font-size="11">drift &amp; decay monitoring</text>
    <text x="752" y="488" fill="rgba(240,235,224,0.65)" font-size="11">can freeze the whole book</text>
  </g>

  <!-- row3 arrows -->
  <line x1="344" y1="452" x2="390" y2="452" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="688" y1="452" x2="734" y2="452" stroke="#ff4b1f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ============ validation band (footer) ============ -->
  <rect x="48" y="560" width="1104" height="120" rx="6" fill="rgba(20,16,9,0.6)" stroke="rgba(240,235,224,0.14)"/>
  <text x="68" y="592" fill="rgba(240,235,224,0.85)" font-size="14" letter-spacing="0.5">Validation underneath the whole pipeline</text>
  <text x="68" y="620" fill="rgba(240,235,224,0.6)" font-size="11.5">Every parameter above is fitted and judged on walk-forward folds with purged embargo gaps — never on the same window it</text>
  <text x="68" y="638" fill="rgba(240,235,224,0.6)" font-size="11.5">trades. The calibrator and conformal gate are refit per fold so the probabilities stay honest out-of-sample.</text>
  <text x="68" y="666" fill="rgba(242,165,31,0.9)" font-size="11.5">Concept diagram of the system architecture — not a screenshot of a running instance.</text>

  <!-- thin connector line from circuit breakers down into validation band, suggesting feedback -->
  <path d="M884,500 L884,540 L600,540 L600,558" stroke="rgba(240,235,224,0.22)" stroke-width="1.2" fill="none" stroke-dasharray="3 4"/>
</svg>
