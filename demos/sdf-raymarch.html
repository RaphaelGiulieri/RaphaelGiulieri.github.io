<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDF raymarch · Raphael Giulieri</title>
<style>
    html, body { margin: 0; height: 100%; background: #0c0a07; color: #f0ebe0; font-family: "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .label { position: absolute; bottom: 12px; left: 12px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.78); pointer-events: none; line-height: 1.5; max-width: calc(100% - 24px); text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .label b { color: #ff4b1f; font-weight: 500; }
    .controls { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; }
    .controls button { font: inherit; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(240,235,224,0.85); background: rgba(12,10,7,0.45); border: 1px solid rgba(240,235,224,0.2); padding: 4px 8px; cursor: pointer; backdrop-filter: blur(6px); }
    .controls button:hover, .controls button.active { border-color: #ff4b1f; color: #ff4b1f; }
    .err { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 13px; line-height: 1.6; color: #ff4b1f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls">
    <button data-scene="0" class="active">Lattice</button>
    <button data-scene="1">Hall</button>
    <button data-scene="2">Fractal</button>
</div>
<p class="label"><b>Sphere-trace SDF · drag to orbit</b><br>Single-pass fragment shader · primitives composed with smooth-min unions · numerical-gradient normals · soft shadows · 5-tap ambient occlusion</p>
<script>
(() => {
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
    document.body.innerHTML = '<p class="err">Needs WebGL2. Try a recent Chrome / Firefox / Safari.</p>';
    return;
}

const VERT = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() {
    v_uv = a_pos;
    gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform vec2 u_resolution;
uniform float u_time;
uniform float u_yaw;
uniform float u_pitch;
uniform int u_scene;

const float PI = 3.14159265359;
const float MAX_DIST = 60.0;
const int   MAX_STEPS = 160;

// --- SDF primitives & ops --------------------------------------------------
float sdSphere(vec3 p, float r)   { return length(p) - r; }
float sdBox(vec3 p, vec3 b)       { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }
float sdTorus(vec3 p, vec2 t)     { vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float sdRoundBox(vec3 p, vec3 b, float r) { return sdBox(p, b - r) - r; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
    vec3 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return length(pa - ba * h) - r;
}

// Smooth-min union (Inigo Quilez polynomial)
float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}

// Domain repeat (1D / 2D)
float repeat1(float p, float c) { return mod(p + 0.5*c, c) - 0.5*c; }
vec2  repeat2(vec2 p, vec2 c)   { return mod(p + 0.5*c, c) - 0.5*c; }

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c,-s,s,c); }

// --- Scenes ----------------------------------------------------------------
// Each returns the scene SDF value at p.

float scene0(vec3 p) {
    // Infinite lattice: rounded boxes at every grid cell, with a pulse modulating size.
    vec3 q = p;
    q.xz = repeat2(q.xz, vec2(2.4));
    float pulse = 0.5 + 0.5 * sin(p.y * 0.3 + u_time * 0.6);
    float box = sdRoundBox(q, vec3(0.55 + 0.15 * pulse, 0.55, 0.55 + 0.15 * pulse), 0.12);
    // Floor with subtle waves
    float floorH = -1.6 + 0.06 * sin(p.x * 0.4) * sin(p.z * 0.4);
    float floorD = p.y - floorH;
    return smin(box, floorD, 0.18);
}

float scene1(vec3 p) {
    // Greek-temple hall: paired columns repeating along Z, with a stepped capital,
    // a roof beam connecting them, an architrave on top, and a tiled floor.
    float floorD = p.y + 1.5;

    // Columns: two rows, repeating along Z every 2.4 units.
    vec3 q = p;
    q.z = repeat1(q.z, 2.4);
    float side = abs(q.x) - 1.8;          // mirror to right side, columns at x = ±1.8
    vec3 cp = vec3(side, q.y, q.z);

    // Column shaft (vertical capsule with rounded ends — flutes hinted by sin)
    float shaft = sdRoundBox(cp - vec3(0.0, -0.2, 0.0), vec3(0.18, 1.20, 0.18), 0.05);
    // Capital (a slightly wider cap on top of the shaft)
    float capital = sdRoundBox(cp - vec3(0.0, 1.05, 0.0), vec3(0.28, 0.10, 0.28), 0.04);
    // Base (wider plinth at the bottom)
    float base = sdRoundBox(cp - vec3(0.0, -1.45, 0.0), vec3(0.32, 0.10, 0.32), 0.03);
    float column = min(shaft, min(capital, base));

    // Architrave: a long horizontal beam spanning the colonnade, on each side, AT the column tops.
    vec3 ap = vec3(abs(p.x) - 1.8, p.y - 1.32, 0.0);
    float architrave = sdRoundBox(ap, vec3(0.32, 0.20, 100.0), 0.04);

    // Roof: a thicker beam crossing the top, also long along Z.
    vec3 rp = vec3(p.x, p.y - 1.85, 0.0);
    float roof = sdRoundBox(rp, vec3(2.30, 0.18, 100.0), 0.05);

    // Ceiling-step (decorative): a thin slab between architrave and roof.
    vec3 sp = vec3(p.x, p.y - 1.62, 0.0);
    float step_ = sdRoundBox(sp, vec3(2.05, 0.06, 100.0), 0.02);

    // Compose with smooth-min so joints look continuous.
    float scene = smin(column, floorD, 0.05);
    scene = smin(scene, architrave, 0.04);
    scene = smin(scene, step_, 0.04);
    scene = smin(scene, roof, 0.05);

    // Subtle hovering torus halo as a focal point (Inigo Quilez style)
    float halo = sdTorus(p - vec3(0.0, 0.7, 0.0), vec2(0.85, 0.06));
    scene = smin(scene, halo, 0.10);

    return scene;
}

// --- Menger sponge helpers -------------------------------------------------
float sdCross(vec3 p) {
    float da = sdBox(p, vec3(1e10, 1.0, 1.0));
    float db = sdBox(p.yzx, vec3(1.0, 1e10, 1.0));
    float dc = sdBox(p.zxy, vec3(1.0, 1.0, 1e10));
    return min(da, min(db, dc));
}

float scene2(vec3 p) {
    // Menger sponge: a unit box with iterated crucifix-shaped subtractions,
    // slowly rotating around Y. Sits on a soft floor.
    vec3 q = p;
    q.xz *= rot(u_time * 0.12);
    q.y -= 0.05;                 // lift slightly so it doesn't sink into the floor
    q /= 1.4;                    // bring it to a nicer scale

    float d = sdRoundBox(q, vec3(1.0), 0.04);

    float s = 1.0;
    for (int m = 0; m < 3; m++) {
        vec3 a = mod(q * s, 2.0) - 1.0;
        s *= 3.0;
        vec3 r = abs(1.0 - 3.0 * abs(a));
        float c = sdCross(r) / s;
        d = max(d, c);
    }
    d *= 1.4;                    // undo the inverse scale on the return distance

    float floorD = p.y + 1.5;
    return smin(d, floorD, 0.10);
}

float map(vec3 p) {
    if (u_scene == 1) return scene1(p);
    if (u_scene == 2) return scene2(p);
    return scene0(p);
}

// Numerical gradient normal
vec3 calcNormal(vec3 p) {
    const float h = 0.0005;
    vec2 k = vec2(1.0, -1.0);
    return normalize(
        k.xyy * map(p + k.xyy * h) +
        k.yyx * map(p + k.yyx * h) +
        k.yxy * map(p + k.yxy * h) +
        k.xxx * map(p + k.xxx * h)
    );
}

// Sphere-trace with adaptive surface tolerance (looser tolerance with distance,
// so grazing rays at the back of the scene actually converge in budget).
float raymarch(vec3 ro, vec3 rd, out int steps) {
    float t = 0.0;
    steps = 0;
    for (int i = 0; i < MAX_STEPS; i++) {
        steps = i;
        vec3 p = ro + rd * t;
        float d = map(p);
        // Tolerance scales with distance: 0.5 px-equivalent at the worst case.
        float tol = max(0.0008, t * 0.0008);
        if (d < tol) return t;
        if (t > MAX_DIST) return -1.0;
        t += d * 0.92;
    }
    return -1.0;
}

// Soft shadow
float softShadow(vec3 ro, vec3 rd, float k) {
    float res = 1.0;
    float t = 0.05;
    for (int i = 0; i < 32; i++) {
        float d = map(ro + rd * t);
        if (d < 0.0005) return 0.0;
        res = min(res, k * d / t);
        t += clamp(d, 0.04, 0.6);
        if (t > 12.0) break;
    }
    return clamp(res, 0.0, 1.0);
}

// 5-tap ambient occlusion
float ao(vec3 p, vec3 n) {
    float occ = 0.0;
    float sca = 1.0;
    for (int i = 0; i < 5; i++) {
        float h = 0.04 + 0.12 * float(i) / 4.0;
        float d = map(p + n * h);
        occ += (h - d) * sca;
        sca *= 0.85;
    }
    return clamp(1.0 - 1.5 * occ, 0.0, 1.0);
}

vec3 shade(vec3 ro, vec3 rd) {
    int steps;
    float t = raymarch(ro, rd, steps);

    // Background gradient (warm-paper to deep)
    vec3 sky = mix(vec3(0.05, 0.04, 0.04), vec3(0.18, 0.10, 0.05), pow(max(rd.y, 0.0), 0.5));
    sky += vec3(0.95, 0.36, 0.12) * pow(max(1.0 - abs(rd.y), 0.0), 12.0) * 0.2;

    if (t < 0.0) return sky;

    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p);

    vec3 keyDir  = normalize(vec3( 0.8, 0.8,  0.4));
    vec3 fillDir = normalize(vec3(-0.6, 0.5, -0.3));

    float keyLambert  = max(dot(n, keyDir), 0.0);
    float fillLambert = max(dot(n, fillDir), 0.0);
    float keyShadow   = softShadow(p, keyDir, 6.0);
    float occ = ao(p, n);

    vec3 keyCol  = vec3(1.00, 0.36, 0.14) * 1.3;
    vec3 fillCol = vec3(0.24, 0.50, 0.65);
    vec3 ambient = vec3(0.10, 0.08, 0.07);

    vec3 albedo = vec3(0.92, 0.86, 0.78);
    albedo *= 0.8 + 0.2 * sin(p.y * 1.6 + p.x * 0.4);

    vec3 col  = ambient * occ;
    col += albedo * keyCol  * keyLambert  * keyShadow;
    col += albedo * fillCol * fillLambert * (0.6 + 0.4 * occ);

    vec3 h = normalize(keyDir - rd);
    float spec = pow(max(dot(n, h), 0.0), 28.0) * keyShadow;
    col += vec3(1.0, 0.95, 0.85) * spec * 0.6;

    float fog = 1.0 - exp(-t * 0.05);
    col = mix(col, sky, fog);

    return col;
}

void main() {
    // Camera basis: orbits the origin at radius 5.0
    float cy = cos(u_yaw),   sy = sin(u_yaw);
    float cp = cos(u_pitch), sp = sin(u_pitch);
    vec3 ro = vec3(sy * cp, sp, cy * cp) * 5.0 + vec3(0.0, 0.4, 0.0);
    vec3 fwd = normalize(-ro + vec3(0.0, 0.4, 0.0));
    vec3 right = normalize(cross(fwd, vec3(0, 1, 0)));
    vec3 up = cross(right, fwd);

    // 4-sample sub-pixel AA via rotated-grid offsets
    vec2 offsets[4] = vec2[4](
        vec2( 0.125,  0.375),
        vec2( 0.375, -0.125),
        vec2(-0.125, -0.375),
        vec2(-0.375,  0.125)
    );
    vec3 col = vec3(0.0);
    vec2 invRes = 1.0 / u_resolution.xy;
    float aspect = u_resolution.x / u_resolution.y;
    for (int i = 0; i < 4; i++) {
        vec2 sub = (gl_FragCoord.xy + offsets[i]) * invRes * 2.0 - 1.0;
        sub.x *= aspect;
        vec3 rd = normalize(fwd + right * sub.x * 0.85 + up * sub.y * 0.85);
        col += shade(ro, rd);
    }
    col *= 0.25;

    // Vignette + tonemap
    vec2 ndc = (gl_FragCoord.xy * invRes) * 2.0 - 1.0;
    ndc.x *= aspect;
    col *= 1.0 - 0.20 * dot(ndc, ndc) * 0.4;
    col = col / (1.0 + col);
    col = pow(col, vec3(1.0 / 2.2));
    fragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(sh));
        throw new Error('shader compile failed');
    }
    return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    throw new Error('link failed');
}

const u_res    = gl.getUniformLocation(prog, 'u_resolution');
const u_time   = gl.getUniformLocation(prog, 'u_time');
const u_yaw    = gl.getUniformLocation(prog, 'u_yaw');
const u_pitch  = gl.getUniformLocation(prog, 'u_pitch');
const u_scene  = gl.getUniformLocation(prog, 'u_scene');

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');

let yaw = 0.6, pitch = 0.35;
const targetYaw = { v: 0.6 }, targetPitch = { v: 0.35 };
let dragging = false, lastX = 0, lastY = 0;
let scene = 0;
let auto = true;

document.querySelectorAll('.controls button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scene = parseInt(btn.dataset.scene, 10);
    });
});

canvas.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    auto = false;
    canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetYaw.v   += dx * 0.005;
    targetPitch.v -= dy * 0.005;
    targetPitch.v = Math.max(-0.2, Math.min(1.0, targetPitch.v));
});
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    canvas.width  = Math.floor(canvas.clientWidth  * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
}
resize();
new ResizeObserver(resize).observe(canvas);

const start = performance.now();
function frame() {
    if (auto) targetYaw.v += 0.0015;
    yaw   += (targetYaw.v - yaw) * 0.12;
    pitch += (targetPitch.v - pitch) * 0.12;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(u_res, canvas.width, canvas.height);
    gl.uniform1f(u_time, (performance.now() - start) * 0.001);
    gl.uniform1f(u_yaw, yaw);
    gl.uniform1f(u_pitch, pitch);
    gl.uniform1i(u_scene, scene);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
